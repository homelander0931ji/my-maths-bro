<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganit Abhyaas — Speed Math Trainer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101B2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ganit Abhyaas">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@500;600;700;800&family=Outfit:wght@300;400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B2E;
    --navy2:#16233B;
    --chalk:#F1ECDD;
    --amber:#E3A93B;
    --teal:#37918C;
    --red:#D9564C;
    --green:#4FA872;
    --line: rgba(241,236,221,0.08);
  }
  body[data-theme="paper"]{
    --navy:#EFE9D8;
    --navy2:#E3DBC4;
    --chalk:#2B2418;
    --amber:#B5651D;
    --teal:#2E7D6B;
    --red:#C0392B;
    --green:#3C8C4A;
    --line: rgba(43,36,24,0.10);
  }
  body[data-theme="forest"]{
    --navy:#10241C;
    --navy2:#163A2B;
    --chalk:#EAF3EA;
    --amber:#D9A441;
    --teal:#4FB08C;
    --red:#E0645A;
    --green:#7BC97E;
    --line: rgba(234,243,234,0.08);
  }
  body[data-theme="graphite"]{
    --navy:#191919;
    --navy2:#262626;
    --chalk:#EDEDED;
    --amber:#E3A93B;
    --teal:#37918C;
    --red:#E5483B;
    --green:#4FA872;
    --line: rgba(255,255,255,0.055);
  }
  body[data-theme="sunset"]{
    --navy:#221A2E;
    --navy2:#332444;
    --chalk:#FBEFE3;
    --amber:#F2A65A;
    --teal:#C4587A;
    --red:#E4574C;
    --green:#6FBF8B;
    --line: rgba(251,239,227,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 27px, var(--line) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--line) 27px, var(--line) 28px),
      var(--navy);
    color:var(--chalk);
    transition: background-color .2s ease, color .2s ease;
    font-family: Georgia, 'Noto Sans Devanagari', 'Segoe UI', sans-serif;
    min-height:100vh;
  }
  .num, .timer, .stat-num{
    font-family: 'Consolas', 'Courier New', monospace;
    font-variant-numeric: tabular-nums;
  }
  header{
    padding: 30px 20px 16px;
    text-align:center;
    background: linear-gradient(180deg, rgba(0,0,0,0.12), transparent);
  }
  header h1{
    margin:0;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 2.1rem;
    letter-spacing:0.5px;
    color: var(--amber);
    font-weight:700;
    text-shadow: 0 2px 18px rgba(227,169,59,0.25);
  }
  header p{
    margin:6px 0 0;
    color: rgba(241,236,221,0.65);
    font-size:0.95rem;
  }
  .theme-row{ display:flex; justify-content:center; gap:10px; margin-top:14px; }
  .theme-dot{
    width:26px; height:26px; border-radius:50%;
    border:2px solid rgba(241,236,221,0.3);
    cursor:pointer;
    padding:0;
  }
  .theme-dot.active{ border-color:var(--amber); box-shadow:0 0 0 2px var(--amber); }
  nav{
    position:sticky; top:0;
    background:var(--navy);
    border-bottom:1px solid var(--line);
    padding:12px 18px;
    z-index:20;
  }
  .nav-bar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .nav-current{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-size:1.05rem;
    color:var(--amber);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .kebab-btn{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius:50%;
    background:transparent;
    border:1px solid rgba(241,236,221,0.28);
    color:var(--chalk);
    font-size:1.3rem;
    line-height:1;
    letter-spacing:1px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: all .15s ease;
  }
  .kebab-btn:hover, .kebab-btn.open{ border-color:var(--amber); color:var(--amber); background:rgba(227,169,59,0.08); }
  .nav-menu-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.4);
    z-index:19;
    animation: splashFade .15s ease both;
  }
  .nav-menu{
    position:absolute;
    right:18px; top:60px;
    background:var(--navy2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px;
    min-width:230px;
    max-height:calc(100vh - 90px);
    overflow-y:auto;
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    z-index:21;
    display:flex;
    flex-direction:column;
    gap:3px;
    animation: cardIn .18s cubic-bezier(.2,.8,.3,1) both;
  }
  .nav-menu-item{
    background:transparent;
    border:none;
    text-align:left;
    color:var(--chalk);
    padding:11px 14px;
    border-radius:9px;
    cursor:pointer;
    font-size:0.92rem;
    font-weight:600;
    transition: background .12s ease, color .12s ease;
  }
  .nav-menu-item:hover{ background:rgba(227,169,59,0.1); }
  .nav-menu-item.active{ background:var(--amber); color:var(--navy); }
  .nav-menu-divider{ height:1px; background:var(--line); margin:6px 6px; flex-shrink:0; }
  .nav-menu-danger{ color:var(--red); }
  .nav-menu-danger:hover{ background:rgba(217,86,76,0.12); }
  .pw-modal-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    z-index:30;
    animation: splashFade .15s ease both;
  }
  .pw-modal.card{
    position:fixed;
    left:50%; top:50%;
    z-index:31;
    width:min(340px, 88vw);
    max-height:85vh;
    overflow-y:auto;
    margin:0;
    animation: pwModalIn .18s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes pwModalIn{
    from{ opacity:0; transform:translate(-50%,-50%) translateY(8px); }
    to{ opacity:1; transform:translate(-50%,-50%) translateY(0); }
  }
  .pw-modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .pw-modal-actions .btn{ flex:1; text-align:center; margin:0; }
  .pw-error{
    color:var(--red);
    font-size:0.85rem;
    margin:10px 0 0;
  }
  main{
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 18px 60px;
  }
  .card{
    background: var(--navy2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 20px;
    margin-bottom:18px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.22), inset 0 1px 0 rgba(241,236,221,0.04);
    animation: cardIn .35s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card h2{
    margin-top:0;
    font-family: 'Fraunces', Georgia, serif;
    color:var(--amber);
    font-size:1.2rem;
    font-weight:600;
    border-bottom:1px dashed rgba(241,236,221,0.2);
    padding-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  label{
    display:block;
    font-size:0.85rem;
    color: rgba(241,236,221,0.7);
    margin: 12px 0 5px;
  }
  select, input[type=number], input[type=text], input[type=password]{
    width:100%;
    padding:9px 11px;
    background: var(--navy);
    border:1px solid rgba(241,236,221,0.25);
    color:var(--chalk);
    border-radius:8px;
    font-size:1rem;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  select:focus, input[type=number]:focus, input[type=text]:focus, input[type=password]:focus{
    outline:none;
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(227,169,59,0.18);
  }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .row > div{ flex:1; min-width:130px; }
  .btn{
    display:inline-block;
    background: linear-gradient(180deg, var(--amber), color-mix(in srgb, var(--amber) 82%, black));
    color: var(--navy);
    border:none;
    padding:11px 22px;
    border-radius:9px;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    margin-top:16px;
    box-shadow: 0 3px 10px rgba(227,169,59,0.28);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(227,169,59,0.36); filter:brightness(1.04); }
  .btn:active{ transform:translateY(0); box-shadow:0 2px 6px rgba(227,169,59,0.3); }
  .btn.secondary{
    background:transparent;
    color: var(--amber);
    border:1px solid var(--amber);
    box-shadow:none;
  }
  .btn.secondary:hover{ background:rgba(227,169,59,0.08); }
  .btn.teal{ background: linear-gradient(180deg, var(--teal), color-mix(in srgb, var(--teal) 82%, black)); color:var(--chalk); box-shadow:0 3px 10px rgba(55,145,140,0.3); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; filter:none; box-shadow:none; }

  /* Practice screen */
  .practice-box{ text-align:center; }
  .qtext{
    font-size:2.6rem;
    margin: 18px 0;
    letter-spacing:1px;
    white-space:nowrap;
    overflow:hidden;
    display:block;
    width:100%;
    text-align:center;
  }
  .qtext-vertical{
    display:inline-block;
    margin: 18px auto;
    text-align:right;
    font-size:2.2rem;
    letter-spacing:1px;
  }
  .qtext-vertical .vline{
    padding:2px 10px;
    white-space:nowrap;
  }
  .qtext-vertical .vline.vline-rule{
    border-top:3px solid var(--chalk);
    margin-top:6px;
    padding-top:6px;
  }
  .practice-box input[type=text]{
    text-align:center;
    font-size:1.6rem;
    max-width:220px;
    margin:0 auto;
    display:block;
    transition: border-color .1s ease, color .1s ease;
  }
  .practice-box input[type=text].wrong{
    border-color: var(--red);
    color: var(--red);
    background: rgba(217,86,76,0.12);
  }
  .answer-display{
    text-align:center;
    font-size:1.6rem;
    min-width:140px;
    max-width:220px;
    min-height:1.3em;
    margin:0 auto;
    padding:8px 16px;
    border-radius:10px;
    border:1px solid rgba(241,236,221,0.28);
    background:rgba(241,236,221,0.04);
    color:var(--chalk);
    transition: border-color .1s ease, color .1s ease, background .1s ease;
  }
  .answer-display.placeholder{ color: rgba(241,236,221,0.4); font-size:1rem; }
  .answer-display.wrong{
    border-color: var(--red);
    color: var(--red);
    background: rgba(217,86,76,0.12);
  }
  .answer-cursor{
    display:inline-block;
    margin-left:2px;
    animation: cursorBlink 1s step-end infinite;
  }
  @keyframes cursorBlink{ 0%,50%{opacity:1;} 50.01%,100%{opacity:0;} }
  .keypad{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:9px;
    width:100%;
    max-width:520px;
    margin:14px auto 0;
    padding:8px;
    background:#262626;
    border-radius:14px;
  }
  .keypad-btn{
    touch-action:manipulation; -webkit-touch-callout:none; will-change:background;
    height:76px;
    padding:0;
    font-size:1.9rem;
    font-weight:300;
    font-family:'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif;
    border:none;
    border-radius:8px;
    background:#3a3a3a;
    color:#fff;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    display:flex; align-items:center; justify-content:center;
  }
  .keypad-btn:active{ background:#505050; }
  .keypad-btn svg{ width:30px; height:30px; }
  /* Full-screen practice layout (on-screen keypad mode) — sizes measured from the reference screenshot (~412px wide phone) */
  .practice-full{
    position:fixed; inset:0; z-index:40;
    display:flex; flex-direction:column;
    background:var(--navy);
    color:var(--chalk);
    font-family:'Montserrat','Segoe UI',Roboto,sans-serif;
  }
  .practice-full::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px),
      linear-gradient(0deg,  rgba(255,255,255,0.12) 1px, transparent 1px);
    background-size:80px 54px;
    background-position:4px 33px;
    -webkit-mask-image: radial-gradient(ellipse 78% 36% at 50% 38%, #000 35%, transparent 100%);
            mask-image: radial-gradient(ellipse 78% 36% at 50% 38%, #000 35%, transparent 100%);
  }
  .practice-full{ touch-action:manipulation; }
  .practice-full > *{ position:relative; z-index:1; }
  body.pf-active header, body.pf-active nav, body.pf-active footer{ display:none !important; }
  body.pf-active{ overflow:hidden; }
  body.wp-on .practice-full{ background:transparent; }
  body.wp-on .practice-full::before{ display:none; }
  .pf-top{
    display:flex; align-items:center; gap:12px;
    padding:calc(18px + env(safe-area-inset-top)) 18px 10px;
  }
  .pf-timer{
    display:flex; align-items:center; gap:10px;
    height:40px; padding:0 13px;
    border:1.5px solid rgba(237,237,237,0.28);
    border-radius:12px;
    font-family:'Montserrat','Segoe UI',Roboto,sans-serif;
    font-size:18px; font-weight:600;
    color:var(--chalk);
    font-variant-numeric: tabular-nums;
  }
  .pf-timer svg{ width:20px; height:20px; flex-shrink:0; }
  .pf-timer.slow{ color:var(--red); border-color:var(--red); }
  .pf-qno{ font-family:'Montserrat','Segoe UI',Roboto,sans-serif; font-size:17px; font-weight:500; color:rgba(237,237,237,0.88); }
  .pf-quit{
    margin-left:auto;
    display:flex; align-items:center; gap:7px;
    background:none; border:none; cursor:pointer;
    color:var(--red); font-family:'Montserrat','Segoe UI',Roboto,sans-serif;
    font-weight:700; letter-spacing:0.8px; font-size:16px;
    padding:8px 0;
  }
  .pf-quit svg{ width:20px; height:20px; }
  .pf-mid{
    flex:1; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:5.5vh 16px 0; overflow:hidden;
  }
  .pf-mid .qtext, .pf-mid .qtext-vertical{
    font-family:'Montserrat','Segoe UI',Roboto,sans-serif;
    font-weight:700; font-variant-numeric: tabular-nums; letter-spacing:3px;
  }
  .pf-mid .qtext{ font-size:1.75rem; }
  .pf-mid .qtext-vertical{ font-size:1.75rem; margin:0; }
  .pf-mid .qtext-vertical .vline{ display:flex; justify-content:space-between; gap:10px; padding:0 6px; line-height:1.4; }
  .pf-mid .qtext-vertical .vop{ min-width:1ch; text-align:left; }
  .pf-mid .feedback{ min-height:0; margin:0; }
  .pf-extra{ min-height:0; margin-top:6px; }
  .pf-extra .timer{ margin-top:4px; font-size:0.85rem; }
  .pf-answer-wrap{ padding:0 16px 18px; text-align:center; }
  .pf-answer-label{
    font-family:'Montserrat','Segoe UI',Roboto,sans-serif;
    font-size:0.68rem; font-weight:700; letter-spacing:0.2px;
    color:rgba(237,237,237,0.42); margin-bottom:8px; text-transform:uppercase;
  }
  .pf-answer-wrap .answer-display{
    width:60%; min-width:200px; max-width:360px;
    height:55px; min-height:55px; display:flex; align-items:center; justify-content:center;
    margin:0 auto; font-family:'Montserrat','Segoe UI',Roboto,sans-serif; font-weight:600;
    font-size:1.6rem; border-radius:18px; padding:0 14px;
    background: color-mix(in srgb, var(--chalk) 16%, var(--navy));
    border:2px solid rgba(0,0,0,0.7);
  }
  .pf-answer-wrap .answer-display.placeholder{ font-size:1rem; color:transparent; }
  .pf-answer-wrap .answer-display.wrong{ border-color:var(--red); }
  .pf-answer-wrap input.pf-input{
    width:60%; min-width:200px; max-width:360px; height:55px;
    margin:0 auto; display:block; text-align:center;
    font-family:'Montserrat','Segoe UI',Roboto,sans-serif; font-weight:600; font-size:1.6rem;
    border-radius:18px; padding:0 14px;
    color:var(--chalk);
    background: color-mix(in srgb, var(--chalk) 16%, var(--navy));
    border:2px solid rgba(0,0,0,0.7);
  }
  .pf-answer-wrap input.pf-input:focus{ outline:none; box-shadow:none; border-color:rgba(0,0,0,0.7); }
  .pf-answer-wrap input.pf-input.wrong{ border-color:var(--red); color:var(--red); }
  .keypad.keypad-full{
    max-width:none; width:100%; margin:0;
    border-radius:0;
    padding:8px 7px calc(12px + env(safe-area-inset-bottom));
    gap:7px;
    grid-auto-rows: clamp(50px, 14.3vw, 74px);
    background: var(--navy2);
  }
  .keypad.keypad-full .keypad-btn{
    height:auto; font-family:'Outfit','Segoe UI',Roboto,sans-serif;
    font-size:1.5rem; font-weight:300;
    background: color-mix(in srgb, var(--chalk) 16%, var(--navy));
    border-radius:7px;
  }
  .keypad.keypad-full .keypad-btn:active{ background: color-mix(in srgb, var(--chalk) 26%, var(--navy)); }
  .keypad.keypad-full .keypad-btn svg{ width:24px; height:24px; }

  /* Wallpaper system */
  #wallpaperLayer{
    position:fixed; inset:0; z-index:-1;
    display:none;
    background-size:cover; background-position:center; background-repeat:no-repeat;
  }
  body.wp-on #wallpaperLayer{ display:block; }
  body.wp-on .card{ background: color-mix(in srgb, var(--navy2) 80%, transparent); backdrop-filter: blur(6px); }
  body.wp-on nav{ background: color-mix(in srgb, var(--navy) 78%, transparent); backdrop-filter: blur(8px); }
  .wp-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
  .wp-swatch{
    height:78px; border-radius:12px; border:2px solid var(--line); cursor:pointer;
    display:flex; align-items:flex-end; justify-content:flex-start; padding:6px 8px;
    color:#fff; font-size:0.74rem; font-weight:700; text-shadow:0 1px 4px rgba(0,0,0,0.8);
    background-size:cover; background-position:center; text-align:left;
  }
  .wp-swatch.active{ border-color:var(--amber); box-shadow:0 0 0 2px var(--amber); }
  .progress{
    font-size:0.85rem;
    color: rgba(241,236,221,0.6);
    margin-bottom:6px;
  }
  .timer{
    font-size:1.1rem;
    color: var(--teal);
    margin-top:10px;
  }
  .stopwatch{
    font-size:2rem;
    color:var(--teal);
    font-weight:700;
    margin-top:12px;
    letter-spacing:0.5px;
  }
  .stopwatch.slow{ color:var(--red); }
  .countdown-num{
    font-size:5rem;
    font-weight:700;
    color:var(--amber);
    margin:26px 0;
    animation: countdownPulse .7s ease both;
  }
  .countdown-num.countdown-word{
    font-size:2.6rem;
    font-family: Georgia, 'Noto Sans Devanagari', 'Segoe UI', sans-serif;
    letter-spacing:1px;
  }
  @keyframes countdownPulse{
    from{ opacity:0; transform:scale(0.6); }
    to{ opacity:1; transform:scale(1); }
  }
  .blink-progress{
    font-size:0.85rem;
    color: rgba(241,236,221,0.55);
    margin-top:8px;
    letter-spacing:0.5px;
  }
  .blink-num{
    font-size:4.4rem;
    font-weight:700;
    color:var(--amber);
    min-height:1.6em;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:10px 0 6px;
  }
  .blink-num.show{ animation: blinkFlash .12s ease both; }
  @keyframes blinkFlash{
    from{ opacity:0; transform:scale(0.85); }
    to{ opacity:1; transform:scale(1); }
  }
  .split-row{ display:flex; justify-content:center; gap:16px; margin-top:6px; font-size:0.78rem; color:rgba(241,236,221,0.55); }
  .split-row span b{ color:rgba(241,236,221,0.85); font-family:'Consolas',monospace; }
  .feedback{
    min-height:26px;
    font-weight:700;
    margin-top:10px;
  }
  .feedback.ok{ color:var(--green); }

/* ================= PERSISTENCE — survive page reloads ================= */
const STORAGE_KEY = 'ganit-abhyaas-progress';
const PERSIST_KEYS = ['combos','records','tips','history','bestRank','weakFilter','theme','course','levelProgress','tablesSettings','subtableSettings','learnSettings','gkSettings','progressDigitFilter','security','practiceCustomize','speakSettings','wallpaper','profile','online'];
let saveInFlight = false, savePending = false;

function getPersistedSlice(){
  const slice = {};
  PERSIST_KEYS.forEach(k => { slice[k] = state[k]; });
  return slice;
}

// Saving (JSON.stringify of the whole state + localStorage write) is synchronous and was running on EVERY
// question change — that froze the UI for a moment while typing. Now: never during a live practice session,
// otherwise debounced, and flushed when the app is hidden/closed so nothing is lost.
let saveTimer = null;
function saveState(){
  if(state.session) return; // practice running — saved right after the session ends / is quit
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer = null; saveStateNow(); }, 300);
}
function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; saveStateNow(); }
}
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSave(); });

async function saveStateNow(){
  const payload = JSON.stringify(getPersistedSlice());

  // localStorage is what keeps progress once this app is packaged into a standalone APK/WebView —
  // window.storage only exists inside the Claude artifact preview, so this is the path that matters on-device.
  try{
    if(typeof localStorage !== 'undefined') localStorage.setItem(STORAGE_KEY, payload);
  }catch(e){
    console.error('Ganit Abhyaas: localStorage save failed', e);
  }

  // Mirror to window.storage too when available (Claude artifact preview) — best-effort, never blocks the localStorage save above.
  if(typeof window !== 'undefined' && window.storage){
    if(saveInFlight){ savePending = true; return; }
    saveInFlight = true;
    try{
      await window.storage.set(STORAGE_KEY, payload, false);
    }catch(e){
      console.error('Ganit Abhyaas: window.storage save failed', e);
    }finally{
      saveInFlight = false;
      if(savePending){ savePending = false; saveStateNow(); }
    }
  }
}

async function loadState(){
  let saved = null;

  // Prefer window.storage when running inside Claude's artifact preview.
  if(typeof window !== 'undefined' && window.storage){
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      if(result && result.value) saved = JSON.parse(result.value);
    }catch(e){ /* nothing saved there yet */ }
  }

  // Fall back to localStorage — this is the path used once packaged as a standalone APK.
  if(!saved && typeof localStorage !== 'undefined'){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) saved = JSON.parse(raw);
    }catch(e){ /* nothing saved there yet either — first ever visit, keep defaults */ }
  }

  if(saved){
    PERSIST_KEYS.forEach(k => { if(saved[k]!==undefined) state[k] = saved[k]; });
  }
  // backfill any new tablesSettings fields (older saved data may pre-date them) without touching existing saved values
  state.tablesSettings = Object.assign(
    { tableNum:11, mode:'normal', cubeMode:'normal', cubeRange:12, squareMode:'normal', squareRange:12 },
    state.tablesSettings
  );
  state.learnSettings = Object.assign(
    { tableNum:1, powerExp:4, powerRange:20 },
    state.learnSettings
  );
  state.subtableSettings = Object.assign(
    { n:9, mode:'normal' },
    state.subtableSettings
  );
  state.security = Object.assign({ password: null }, state.security);
  state.profile = Object.assign({}, DEFAULT_PROFILE, state.profile);
  state.online = Object.assign({ joined:false, uid:'', pending:[], lastError:'' }, state.online);
  if(!Array.isArray(state.online.pending)) state.online.pending = [];
  state.practiceCustomize = Object.assign(
    { inputMode:'keypad', vibration:false, showCountdown:true, countdownStyle:'numeric', showProgress:true, showStopwatch:true, showLiveAccuracy:false, showStreak:false },
    state.practiceCustomize
  );
  state.wallpaper = Object.assign({ mode:'none', preset:'aurora', dataUrl:'', dim:0.4, scope:'all' }, state.wallpaper);
  state.speakSettings = Object.assign(
    { medium:'hi', voiceURI:'', rate:0.9, pitch:1 },
    state.speakSettings
  );
  // recompute accuracy on older saved history — previously every session showed 100% accuracy
  // because a question only got recorded once it was answered correctly; now wrong attempts
  // (already tracked per-question as `mistakes`) count against accuracy too.
  if(Array.isArray(state.history)){
    state.history.forEach(h=>{
      if(h.details && h.details.length){
        const trueCorrect = h.details.filter(d=>(d.mistakes||0)===0).length;
        h.correctCt = trueCorrect;
        h.accuracy = (trueCorrect/h.total)*100;
        h.rank = computeRank(h.op, h.avgTime, h.accuracy, h.digitTier||1);
      }
    });
    const recomputedBest = {};
    state.history.forEach(h=>{
      if(!h.rank) return;
      if(!recomputedBest[h.op] || h.rank.score > recomputedBest[h.op].score){
        recomputedBest[h.op] = { tier:h.rank.tier, emoji:h.rank.emoji, score:h.rank.score, sub:h.rank.sub };
      }
    });
    state.bestRank = recomputedBest;
  }
  state.gkSettings = Object.assign(
    { subject:'history', mode:'read' },
    state.gkSettings
  );
  if(state.progressDigitFilter==null) state.progressDigitFilter = 'all';
}

      'Venus is the hottest planet in the solar system and is called "Earth\'s twin" due to its similar size and mass; it is the brightest planet, visible to the naked eye at dawn and dusk. It has the slowest rotation (243 days for one spin) and thick clouds of sulphuric acid (H2SO4). Its other names include Morning Star, Evening Star, and Lucifer ("light-bringer").',
      'Earth is the only planet supporting life; called the "Blue Planet" due to water covering ~70% of its surface. It has one natural satellite, the Moon, and is the densest planet (5.5 g/cm³). Venus is Earth\'s nearest planetary neighbour.',
      'Mars is called the "Red Planet" due to iron-rich soil; it is the second-smallest planet after Mercury, with two moons, Phobos and Deimos. Its atmosphere is very thin, and its surface has valleys, craters, deserts and icy peaks.',
      'Olympus Mons on Mars (22–25 km high) is the largest and tallest volcano in the solar system. A Martian day lasts 1 day and 37 minutes. The asteroid belt lies between the orbits of Mars and Jupiter; NASA\'s OSIRIS-REx mission studied the asteroid Bennu.',
    ]},
    { title:'Sourmandal – Gas Giant Planets', facts:[
      'Jupiter is the largest planet in the solar system and has the shortest rotation period (9 hours 55 minutes); its atmosphere is hydrogen and helium. It hosts the "Great Red Spot" storm and currently has 95 known moons, including the four large "Galilean moons" (Io, Europa, Ganymede, Callisto) discovered by Galileo — Ganymede is the largest moon in the solar system.',
      'Saturn is the second-largest planet, famous for its bright rings of ice and rock. It is the least dense planet (0.69 g/cm³) — less dense than water, so it could float on it. It has 274 known moons; Titan is the largest, and Titan and Enceladus show potential signs of habitability. Huygens discovered its rings (1655); Cassini discovered the gap between the rings (1675).',
      'Uranus appears green (methane in its atmosphere) and is called the "Green Planet"; discovered by William Herschel (1781). Its atmosphere (hydrogen, helium, plus water and ammonia) is the coldest in the solar system. Tilted 98° on its axis, it is called the "rolling/sideways planet"; it has at least 27 moons (e.g. Miranda, Ariel, Umbriel).',
      'Neptune is the farthest planet from the Sun, with the longest orbital period (165 years); it appears blue due to methane. Discovered in 1846 by Johann Galle and Urbain Le Verrier — the only planet found through mathematical prediction. It has 14 known moons (largest: Triton) and the fastest winds in the solar system.',

    { title:'Sourmandal – Moon & Earth-Moon System', facts:[
      'The Moon is Earth\'s only natural satellite and is non-luminous; its radius is 1.74 × 10⁶ metres, and it is about 3,84,000 km from Earth — moonlight takes 1.26 seconds to reach Earth.',
      'Gravity on the Moon is about 1/6th of Earth\'s gravity. Only about 60% (the near side) of the Moon is ever visible from Earth because the Moon\'s rotation period equals its orbital period (27.3 days) — called synchronous/tidal rotation.',

    { title:'Sourmandal – Dwarf Planets & Kuiper Belt', facts:[
      'The Kuiper Belt is a ring beyond Neptune\'s orbit containing many asteroids, rocks and comets, forming a major part of the outer solar system.',
      'Under the IAU\'s 2006 planet definition, Pluto was reclassified from a planet to a dwarf planet because it cannot clear its orbital neighbourhood of debris; it is now considered a Kuiper Belt member. Pluto was discovered by Clyde Tombaugh; its largest moon is Charon (of its 5 moons); it takes 248 Earth years to orbit the Sun, and its elliptical orbit overlaps Neptune\'s.',
      'The three defining features of dwarf planets: they orbit the Sun, are roughly spherical, and have not cleared their orbital neighbourhood of debris.',
      'Largest dwarf planets: Pluto (largest & brightest), Eris (2nd largest), Makemake (3rd largest, 310-year orbit), Haumea (fastest-spinning, in the Kuiper Belt), and Ceres (located in the asteroid belt, not the Kuiper Belt).',
    ]},
    { title:'Sourmandal – Comets, Asteroids & Meteors', facts:[
      'Comets are large icy bodies orbiting the Sun, made of dust, rock and frozen gases (water, CO2, ammonia, methane); as a comet nears the Sun its ice melts, forming an ion tail and a dust tail. Short-period comets come from the Kuiper Belt; long-period comets come from the Oort Cloud (a cloud of icy objects beyond the Kuiper Belt).',
      'Halley\'s Comet appears every 76 years; it was last seen in 1986 and is expected to return in 2061.',
      'An asteroid is a rocky, metallic or icy body orbiting the Sun; a meteoroid is a much smaller rocky/metallic space object (from dust-sized up to about a metre wide).',
      'A meteor ("shooting star") is a meteoroid burning up as it enters Earth\'s atmosphere; the Quadrantids meteor shower appears in early January. A meteorite is a meteoroid that survives passage through the atmosphere and strikes Earth\'s surface.',

    { title:'Sourmandal – Constellations & Stars', facts:[
      'A constellation is a group of stars forming a recognizable pattern in the night sky.',

      'Cassiopeia is a W-shaped constellation whose brightest star is Shedar (Alpha Cassiopeiae). Cygnus is a major northern constellation known for its distinctive cross shape.',
      'Orion ("the Hunter") is a prominent constellation visible in the northern hemisphere in winter; its brightest star is Rigel. Sirius is the brightest star in the night sky overall, and Proxima Centauri is the nearest star to Earth after the Sun.',

    { title:'Sourmandal – Space Missions', facts:[
      'Aditya-L1 is India\'s first solar observatory mission (ISRO), studying the Sun from the first Lagrange point (L1) — one of 5 Lagrange points (L1–L5) around the Sun, where the gravitational pull of two large bodies balances the centripetal force needed to move with them.',
      'Chandrayaan-3 (ISRO), India\'s third lunar mission, used the lander Vikram (landed 23 August, marked as National Space Day) and rover Pragyan, touching down at Shiv Shakti Point near the Moon\'s south pole; its launch vehicle was GSLV-Mk3. Upcoming missions: Chandrayaan-4 will return lunar samples (regolith) to Earth, and Chandrayaan-5 is a joint ISRO–JAXA LUPEX mission for extended south-pole exploration.',
      'The Mars Orbiter Mission (MOM/Mangalyaan) was launched by ISRO and has orbited Mars since 24 September 2014, making ISRO the first space agency in the world to successfully reach Mars orbit on its very first attempt, without help from any other country. MOM-2, expected to carry a rover and helicopter, would be India\'s most ambitious Mars mission yet.',
      'The International Space Station (ISS) is the largest human-made object in space, a joint project of 5 space agencies — NASA, Roscosmos, JAXA, ESA and CSA; its first module (Zarya) launched in 1998, and it was fully assembled by 2011. It orbits about 400 km above Earth at ~28,000 km/h, completing an orbit roughly every 90 minutes.',

const OP_SYMBOL = { add:'+', sub:'−', mul:'×', div:'÷' };
const TIER_LABEL = { 1:'1-Digit', 2:'2-Digit', 3:'3-Digit', 4:'4-Digit' };
const RANK_TIERS = [
  { tier:'Bronze',      emoji:'🥉', min:0,  max:20 },
  { tier:'Silver',      emoji:'🥈', min:20, max:35 },
  { tier:'Gold',        emoji:'🥇', min:35, max:55 },
  { tier:'Diamond',     emoji:'💎', min:55, max:80 },
  { tier:'Heroic',      emoji:'⚔️', min:80, max:93 },
  { tier:'Grandmaster', emoji:'👑', min:93, max:100 },
];

function tierFromScore(score){
  for(let i=0;i<RANK_TIERS.length;i++){
    const t = RANK_TIERS[i];
    if(score>=t.min && score<t.max){
      const pos = (score - t.min) / (t.max - t.min); // 0..1 progress within this tier
      const sub = Math.min(4, Math.floor(pos*4) + 1); // 1 = just entered tier, 4 = right at the edge of promotion
      return { ...t, next: RANK_TIERS[i+1]||null, sub };
    }
  }
  const last = RANK_TIERS[RANK_TIERS.length-1];
  return { ...last, next:null, sub:4 };
}
function computeRank(op, avgTime, accuracy, digitTier){
  const mult = TIER_MULT[Math.min(4, digitTier||1)] || 1; // bigger numbers get fair extra time
  const thresh = (THRESH[op] || 5) * mult;
  const ratio = avgTime/thresh;
  const speedScore = Math.max(0, 1 - Math.min(ratio,2)/2) * 100; // 100 = instant, 0 = very slow
  const score = Math.round(accuracy*0.5 + speedScore*0.5);
  const t = tierFromScore(score);
  const progressPct = t.next ? Math.round(((score - t.min)/(t.max - t.min))*100) : 100;
  return { ...t, ratio, score, progressPct };
}

/* ================= HELPERS ================= */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randDigit(len){
  if(len<=1) return randInt(1,9);
  const min = Math.pow(10,len-1), max = Math.pow(10,len)-1;
  return randInt(min,max);
}
function gcd(a,b){ return b===0? a : gcd(b,a%b); }
function lcm(a,b){ return (a*b)/gcd(a,b); }

function formatPulse(sec){
  // "God level" precision display: whole seconds + millisecond "pulse", e.g. 1s 989ms
  const s = Math.floor(sec);
  const ms = Math.round((sec - s) * 1000);
  return `${s}s ${String(ms).padStart(3,'0')}ms`;
}
function comboKey(a,b){ return a+"_"+b; }
function tierOf(a,b){ return Math.min(4, Math.max(String(Math.abs(a)).length, String(Math.abs(b)).length)); }

const PERCENT_TIERS = {
  1: [10,20,25,50],
  2: [5,15,35,40,60,75],
  3: [12,18,24,32,45,65,85,90],
};
function randPercentQ(tier, baseDigits){
  const set = PERCENT_TIERS[Math.min(3, tier||1)] || PERCENT_TIERS[1];
  const p = set[randInt(0,set.length-1)];
  const mult = 100/gcd(100,p); // base must be a multiple of this for a whole-number answer
  const maxK = Math.max(1, Math.floor(Math.pow(10,baseDigits||1)/mult));
  const base = mult*randInt(1,maxK);
  return { p, base, answer:(p*base)/100 };
}

/* ================= QUESTION GENERATION ================= */
function generateQuestion(){
  const s = state.settings;
  if(s.op === 'mix'){
    const pick = ['add','sub','mul','div'][randInt(0,3)];
    if(pick==='add'){
      const a = randDigit(s.digitA), b = randDigit(s.digitB);
      return { text: `${a} + ${b}`, answer: a+b, tag: {op:'add', a, b} };
    }
    if(pick==='sub'){
      let a = randDigit(s.digitA), b = randDigit(s.digitB);
      if(a<b) [a,b]=[b,a];
      return { text: `${a} - ${b}`, answer: a-b, tag: {op:'sub', a, b} };
    }
    if(pick==='mul'){
      const a = randDigit(s.digitA), b = randDigit(s.digitB);
      return { text: `${a} × ${b}`, answer: a*b, tag: {op:'mul', a, b} };
    }
    const divisor = Math.max(1, randDigit(s.digitB));
    const quotient = randDigit(s.digitA);
    const dividend = divisor*quotient;
    return { text: `${dividend} ÷ ${divisor}`, answer: quotient, tag: {op:'div', a:divisor, b:quotient} };
  }
  if(s.op === 'add' && s.rowCount > 2){
    const nums = [];
    for(let i=0;i<s.rowCount;i++) nums.push(randDigit(s.digitA));
    const answer = nums.reduce((x,y)=>x+y,0);
    return { text: nums.join(' + '), answer, tag:null, nums };
  }
  if(s.op === 'add' && s.range){
    const [lo,hi] = s.range;
    const a = randInt(lo,hi), b = randInt(lo,hi);
    return { text: `${a} + ${b}`, answer: a+b, tag: {op:'add', a, b} };
  }
  if(s.op === 'add' && s.carryOnly && s.digitA===1 && s.digitB===1){
    const a = randInt(1,9);
    const b = randInt(Math.max(1,10-a), 9); // forces a+b >= 10, e.g. 9+1, 7+6, 6+5 — never 3+4, 8+1
    return { text: `${a} + ${b}`, answer: a+b, tag: {op:'add', a, b} };
  }
  if(s.op === 'add'){
    const a = randDigit(s.digitA), b = randDigit(s.digitB);
    const answer = a+b;
    return { text: `${a} + ${b}`, answer, tag: {op:'add', a, b} };
  }
  if(s.op === 'sub' && s.rowCount > 2){
    // multi-row subtraction like 98 - 40 - 30 : first number big enough that the result never goes negative
    const subs = s.rowCount - 1;
    let first = 0, rest = [], ok = false;
    for(let t=0; t<60 && !ok; t++){
      first = randDigit(s.digitA);
      rest = [];
      let remaining = first;
      for(let i=0;i<subs;i++){
        const lo = s.digitA>1 ? Math.pow(10,s.digitA-1) : 1;
        const hi = Math.min(remaining, Math.pow(10,s.digitA)-1);
        if(hi < 1){ rest = null; break; }
        const b = randInt(Math.min(lo,hi), hi);
        rest.push(b); remaining -= b;
      }
      ok = !!rest;
    }
    if(!ok){ rest = Array.from({length:subs},()=>randDigit(s.digitA)); first = rest.reduce((x,y)=>x+y,0) + randInt(0,9); }
    const answer = first - rest.reduce((x,y)=>x+y,0);
    return { text: [first, ...rest].join(' - '), answer, tag:null };
  }
  if(s.op === 'sub'){
    let a = randDigit(s.digitA), b = randDigit(s.digitB);
    if(a<b) [a,b]=[b,a];
    return { text: `${a} - ${b}`, answer: a-b, tag: {op:'sub', a, b} };
  }
  if(s.op === 'mul'){
    const a = randDigit(s.digitA), b = randDigit(s.digitB);
    return { text: `${a} × ${b}`, answer: a*b, tag: {op:'mul', a, b} };
  }
  if(s.op === 'div'){
    const divisor = Math.max(1, randDigit(s.digitB));
    const quotient = randDigit(s.digitA);
    const dividend = divisor*quotient;
    return { text: `${dividend} ÷ ${divisor}`, answer: quotient, tag: {op:'div', a:divisor, b:quotient} };
  }
  if(s.op === 'lcm'){
    const a = Math.max(1,randDigit(s.digitA)), b = Math.max(1,randDigit(s.digitB));
    return { text: `LCM(${a}, ${b})`, answer: lcm(a,b), tag:null };
  }
  if(s.op === 'square'){
    const n = randDigit(s.digitA);
    return { text: `${n}²`, answer: n*n, tag:null };
  }
  if(s.op === 'percent'){
    const { p, base, answer } = randPercentQ(s.digitA, s.digitB);
    return { text: `${p}% of ${base}`, answer, tag:null };
  }
}

function questionFromCombo(op,a,b){
  if(op==='add') return { text:`${a} + ${b}`, answer:a+b, tag:{op,a,b} };
  if(op==='sub') return { text:`${a} - ${b}`, answer:a-b, tag:{op,a,b} };
  if(op==='mul') return { text:`${a} × ${b}`, answer:a*b, tag:{op,a,b} };
  if(op==='div') return { text:`${a*b} ÷ ${a}`, answer:b, tag:{op,a,b} };
}

function shuffleArr(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=randInt(0,i); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function numberToWordsHI(n){
  if(n===0) return HI_WORDS[0];
  if(n<0) return 'ऋण ' + numberToWordsHI(-n);
  if(n<=100) return HI_WORDS[n];
  const h = Math.floor(n/100), r = n%100;
  return HI_WORDS[h] + ' सौ' + (r ? ' ' + HI_WORDS[r] : '');
}

// Traditional pahada recitation words for 1x-10x (jaise "ekam", "dooni", "tiya"); 11x-12x ke liye
// seedha number + "guna" (times) bola jaata hai kyunki unke koi alag traditional shabd nahi hote.
const HI_PAHADA_WORD = {1:'एकम',2:'दूनी',3:'तिया',4:'चौका',5:'पांच',6:'छक्के',7:'सत्ते',8:'आठे',9:'नवे',10:'दहाई'};

const EN_ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const EN_TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

function numberToWordsEN(n){
  if(n===0) return 'zero';
  if(n<0) return 'minus ' + numberToWordsEN(-n);
  if(n<20) return EN_ONES[n];
  if(n<100) return EN_TENS[Math.floor(n/10)] + (n%10 ? '-' + EN_ONES[n%10] : '');
  if(n<1000){
    const h = Math.floor(n/100), r = n%100;
    return EN_ONES[h] + ' hundred' + (r ? ' ' + numberToWordsEN(r) : '');
  }
  const th = Math.floor(n/1000), r = n%1000;
  return numberToWordsEN(th) + ' thousand' + (r ? ' ' + numberToWordsEN(r) : '');
}

// Classic English times-table recitation style: "Eleven ones are eleven, Eleven twos are twenty-two..."
const EN_MULT_PLURAL = {1:'ones',2:'twos',3:'threes',4:'fours',5:'fives',6:'sixes',7:'sevens',8:'eights',9:'nines',10:'tens',11:'elevens',12:'twelves'};

// One spoken line per multiplier (1x through 12x), in the chosen medium (Hindi pahada-style or English table-style)
function buildTableSpeechLines(tableNum, medium){
  const lines = [];
  for(let m=1; m<=12; m++){
    const product = tableNum * m;
    if(medium === 'en'){
      const label = numberToWordsEN(tableNum);
      const cap = label.charAt(0).toUpperCase() + label.slice(1);
      lines.push(`${cap} ${EN_MULT_PLURAL[m]} are ${numberToWordsEN(product)}.`);
    } else {
      const multWord = m <= 10 ? HI_PAHADA_WORD[m] : (numberToWordsHI(m) + ' गुणा');
      lines.push(`${numberToWordsHI(tableNum)} ${multWord} ${numberToWordsHI(product)}`);
    }
  }
  return lines;
}

function getAvailableVoices(){
  if(!('speechSynthesis' in window)) return [];
  return window.speechSynthesis.getVoices() || [];
}

function pickSpeechVoice(medium){
  const voices = getAvailableVoices();
  if(!voices.length) return null;
  if(state.speakSettings.voiceURI){
    const chosen = voices.find(v => v.voiceURI === state.speakSettings.voiceURI);
    if(chosen) return chosen;
  }
  const langPrefix = medium === 'en' ? 'en' : 'hi';
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix)) || voices[0];
}

// Naye voice model nahi bana sakte — yeh device par pehle se installed voices me se
// sabse behtar Indian male/female voice DHOONDTA hai (jaana-maana naam pattern + hi-IN/en-IN lang se).
const INDIAN_FEMALE_NAMES = ['heera','veena','lekha','kalpana','swara','divya','priya','neerja','ananya','kajal'];
const INDIAN_MALE_NAMES = ['ravi','prabhat','hemant','rishi','madhur','arjun','aditya','rohan'];

function findIndianVoice(gender){
  const voices = getAvailableVoices();
  if(!voices.length) return null;
  const indianVoices = voices.filter(v => v.lang && /^(hi-in|en-in)/i.test(v.lang));
  const nameList = gender === 'female' ? INDIAN_FEMALE_NAMES : INDIAN_MALE_NAMES;
  // pehle: Indian-lang voice jiska naam jaane-maane male/female pattern se milta ho
  let match = indianVoices.find(v => nameList.some(n => v.name.toLowerCase().includes(n)));
  if(match) return match;
  // agar naam se pehchaan na ho, to koi bhi Indian-lang voice de do (behtar se behtar available)
  if(indianVoices.length) return indianVoices[0];
  // Indian-lang voice bilkul na ho to naam pattern kisi bhi voice me dhoondo (kai fonts locale-agnostic hote hain)
  match = voices.find(v => nameList.some(n => v.name.toLowerCase().includes(n)));
  return match || null;
}

function useIndianVoice(gender){
  const found = findIndianVoice(gender);
  if(!found){
    alert('Aapke device par abhi koi Indian voice installed nahi hai.\n\nNeeche wale "📥 Awaaz Install Screen Kholein" button try karein — agar wo na chale to Settings → Text-to-speech output → voice data install karein, aur Hindi (India) ya English (India) voice download karein. Uske baad yeh button dobara use karein.');
    return;
  }
  state.speakSettings.voiceURI = found.voiceURI;
  render();
}

  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  state.speakingActive = false;
  state.speakingRow = null;
  render();
}

function speakTable(tableNum){
  if(!('speechSynthesis' in window)){
    alert('Is browser/device me Text-to-Speech (bolne ki) suvidha available nahi hai.');
    return;
  }
  window.speechSynthesis.cancel();
  const medium = state.speakSettings.medium;
  const lines = buildTableSpeechLines(tableNum, medium);
  const voice = pickSpeechVoice(medium);
  state.speakingActive = true;
  state.speakingRow = null;
  let i = 0;
  const speakNext = ()=>{
    if(!state.speakingActive || i >= lines.length){
      state.speakingActive = false;
      state.speakingRow = null;
      render();
      return;
    }
    const utt = new SpeechSynthesisUtterance(lines[i]);
    if(voice) utt.voice = voice;
    utt.lang = medium === 'en' ? 'en-US' : 'hi-IN';
    utt.rate = state.speakSettings.rate || 0.9;
    utt.pitch = state.speakSettings.pitch || 1;
    state.speakingRow = i + 1;
    render();
    utt.onend = ()=>{ i++; speakNext(); };
    utt.onerror = ()=>{ i++; speakNext(); };
    window.speechSynthesis.speak(utt);
  };
  speakNext();
}

function speakTestPhrase(){
  if(!('speechSynthesis' in window)){
    alert('Is browser/device me Text-to-Speech (bolne ki) suvidha available nahi hai.');
    return;
  }
  window.speechSynthesis.cancel();
  const medium = state.speakSettings.medium;

  window.speechSynthesis.speak(utt);
}

/* ================= LEARN TABLES + CUBE ROOTS + SQUARES ================= */
function buildTableQuestions(tableNum, mode){
  let mults = Array.from({length:12},(_,i)=>i+1); // 1x through 12x — covers 11 & 12 ka table fully
  if(mode==='mix') mults = shuffleArr(mults);
  return mults.map(i => ({ text:`${tableNum} × ${i}`, answer: tableNum*i, tag:null }));
}

function buildSubtractTableQuestions(n, mode){
  if(n==='all'){
    // Mix (All Systems) — sabhi −1 se −9 tak ke systems ke sawaal ek saath, 9 × 10 = 90 sawaal
    let combos = [];
    for(let sub=1; sub<=9; sub++){
      for(let m=20; m>=11; m--){ combos.push({m, sub}); }
    }
    if(mode==='mix') combos = shuffleArr(combos);
    return combos.map(({m,sub}) => ({ text:`${m} - ${sub}`, answer: m-sub, tag:null }));
  }
  // "−9 system" jaisi ginti tables: 20-n se shuru hokar 11-n tak, jaise 20-9,19-9,...,11-9
  let mins = Array.from({length:10},(_,i)=>20-i); // 20,19,18,...,11
  if(mode==='mix') mins = shuffleArr(mins);
  return mins.map(m => ({ text:`${m} - ${n}`, answer: m-n, tag:null }));
}

function buildCubeQuestions(range, mode){
  let nums = Array.from({length:range||12},(_,i)=>i+1); // 1³ through <range>³ (up to 100³)
  if(mode==='mix') nums = shuffleArr(nums);
  return nums.map(i => ({ text:`∛${i*i*i}`, answer:i, tag:null }));
}

function buildSquareQuestions(range, mode){
  let nums = Array.from({length:range||12},(_,i)=>i+1); // 1² through <range>² (up to 100²)
  if(mode==='mix') nums = shuffleArr(nums);
  return nums.map(i => ({ text:`${i}²`, answer:i*i, tag:null }));
}

// The 3-2-1 countdown is skipped entirely when Blinking Mode is active (flash cards should
// start flashing immediately) or when the person has turned the countdown off in Customize Practice.
function sessionSkipsCountdown(questions){
  if(!state.practiceCustomize.showCountdown) return true;
  if(state.settings.blinkMode && questions.length && questions[0].nums && questions[0].nums.length > 1) return true;
  return false;
}

function startTablesPractice(kind){
  let questions;
  if(kind==='table'){
    const tableNum = state.tablesSettings.tableNum;
    const mode = state.tablesSettings.mode;
    questions = buildTableQuestions(tableNum, mode);
    state.settings = { op:'table', tableNum, mode, qCount: questions.length };
  } else if(kind==='subtable'){
    const n = state.subtableSettings.n;
    const mode2 = state.subtableSettings.mode;
    questions = buildSubtractTableQuestions(n, mode2);
    state.settings = { op:'subtable', n, mode:mode2, qCount: questions.length };
  } else if(kind==='cbrt'){
    const mode = state.tablesSettings.cubeMode;
    const range = state.tablesSettings.cubeRange;
    questions = buildCubeQuestions(range, mode);
    state.settings = { op:'cbrt', mode, range, qCount: questions.length };
  } else {
    const mode = state.tablesSettings.squareMode;
    const range = state.tablesSettings.squareRange;
    questions = buildSquareQuestions(range, mode);
    state.settings = { op:'sqdrill', mode, range, qCount: questions.length };
  }
  state.masterMode = false;
  state.courseLevel = null;
  state.activeLevelRun = null;
  state.session = { questions, index:0, results:[], qStart: performance.now(), firstKeyAt:null, countdown:3, liveCorrect:0, liveWrong:0, typedValue:'' };
  state.tab = 'practice';
  state.navMenuOpen = false;
  if(sessionSkipsCountdown(questions)){
    state.session.countdown = 0;
    beginQuestion(state.session);
  } else {
    render();
  }
}

/* ================= COMBO TRACKING ================= */
const TIER_MULT = { 1:1, 2:1.7, 3:2.4, 4:3.2 }; // bigger numbers naturally take longer

function recordCombo(tag, timeSec){
  const { op, a, b } = tag;
  const tier = tierOf(a,b);
  const bucket = state.combos[op];
  const key = comboKey(a,b);
  if(!bucket[key]) bucket[key] = { a, b, tier, times:[], slow:false, fastStreak:0 };
  const c = bucket[key];
  c.times.push(timeSec);
  if(c.times.length>5) c.times.shift();

  const limit = (THRESH[op]||4) * (TIER_MULT[tier]||1);
  if(timeSec > limit){
    c.slow = true;
    c.fastStreak = 0;
  } else if(c.slow){
    c.fastStreak++;
    if(c.fastStreak >= 3){
      delete bucket[key]; // graduated — hata do
    }
  }

  // Leaderboard subsystem — record every calculation's best time, grouped by digit tier (1/2/3)
  const rbucket = state.records[op];
  if(rbucket){
    const r = rbucket[key];
    if(!r){
      rbucket[key] = { a, b, tier, best: timeSec, attempts: 1, lastTime: timeSec };
    } else {
      r.attempts++;
      r.lastTime = timeSec;
      if(timeSec < r.best) r.best = timeSec;
    }
  }
}

function getWeakList(){
  const list = [];
  ['add','sub','mul','div'].forEach(op=>{
    Object.values(state.combos[op]).forEach(c=>{
      if(c.slow) list.push({op, a:c.a, b:c.b, tier:c.tier, avg: c.times.reduce((x,y)=>x+y,0)/c.times.length});
    });
  });
  return list;
}

/* ================= PRACTICE FLOW ================= */
function startPractice(fromMaster, opFilter){
  state.masterMode = !!fromMaster;
  let questions = [];
  if(fromMaster){
    let weak = getWeakList();
    if(opFilter && opFilter!=='all') weak = weak.filter(w=>w.op===opFilter);
    if(weak.length===0){ render(); return; }
    questions = weak.map(w => ({ ...questionFromCombo(w.op,w.a,w.b) }));
    // shuffle
    for(let i=questions.length-1;i>0;i--){ const j=randInt(0,i); [questions[i],questions[j]]=[questions[j],questions[i]]; }
  } else {
    for(let i=0;i<state.settings.qCount;i++){
      let q, tries = 0;
      do{
        q = generateQuestion();
        tries++;
      } while(
        questions.length>0 &&
        q.answer === questions[questions.length-1].answer &&
        tries < 25
      ); // avoid back-to-back questions with the same answer (e.g. 7+7=14 then 8+6=14)
      questions.push(q);
    }
  }
  state.session = { questions, index:0, results:[], qStart: performance.now(), firstKeyAt: null, countdown:3, liveCorrect:0, liveWrong:0, typedValue:'' };
  state.tab = 'practice';
  state.navMenuOpen = false;
  if(sessionSkipsCountdown(questions)){
    state.session.countdown = 0;
    beginQuestion(state.session);
  } else {
    render();
  }
}

function statsOf(times){
  const n = times.length;
  const sorted = [...times].sort((a,b)=>a-b);
  const mean = times.reduce((s,t)=>s+t,0)/n;
  const median = n%2 ? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2;
  const variance = times.reduce((s,t)=>s+(t-mean)*(t-mean),0)/n;
  const stdDev = Math.sqrt(variance);
  return { min: sorted[0], max: sorted[n-1], median, stdDev, mean };
}

function quitPractice(){
  const sess = state.session;
  if(sess && sess.index > 0){
    const ok = confirm('Kya aap practice beech me chhodna chahte hain? Yeh session record nahi hoga.');
    if(!ok) return;
  }
  if(practiceTickHandle){ clearInterval(practiceTickHandle); practiceTickHandle = null; }
  if(countdownTickHandle){ clearInterval(countdownTickHandle); countdownTickHandle = null; }
  if(blinkTickHandle){ clearTimeout(blinkTickHandle); blinkTickHandle = null; }
  if(practiceKeydownHandler){ document.removeEventListener('keydown', practiceKeydownHandler); practiceKeydownHandler = null; }
  state.session = null;
  state.courseLevel = null;
  state.activeLevelRun = null;
  state.masterMode = false;
  state.tab = 'setup';
  state.navMenuOpen = false;
  render();
}

// Starts a question: either the normal instant-display flow, or — for multi-number
// addition rows with Blinking Mode on — flashes each number for ~1s one at a time
// before the real stopwatch/input appear, so the learner has to hold them in memory.
function beginQuestion(sess){
  const q = sess.questions[sess.index];
  sess.typedValue = '';
  sess.firstKeyAt = null;
  sess.mistakes = 0;
  if(blinkTickHandle){ clearTimeout(blinkTickHandle); blinkTickHandle = null; }
  if(state.settings.blinkMode && q.nums && q.nums.length > 1){
    startBlinkSequence(sess);
  } else {
    sess.blinking = false;
    sess.qStart = performance.now();
    render();
  }
}

function startBlinkSequence(sess){
  sess.blinking = true;
  sess.blinkIndex = -1;
  sess.blinkShow = false;
  advanceBlink(sess);
}

function advanceBlink(sess){
  if(state.session !== sess) return; // session was quit/replaced mid-sequence
  sess.blinkIndex++;
  const q = sess.questions[sess.index];
  if(sess.blinkIndex >= q.nums.length){
    // all numbers shown — hand off to the real timer + input
    sess.blinking = false;
    sess.qStart = performance.now();
    sess.firstKeyAt = null;
    sess.typedValue = '';
    render();
    return;
  }
  sess.blinkShow = true;
  render();
  blinkTickHandle = setTimeout(()=>{
    if(state.session !== sess) return;
    sess.blinkShow = false; // brief blank gap so back-to-back same digits still register as separate flashes
    render();
    blinkTickHandle = setTimeout(()=> advanceBlink(sess), 220);
  }, 780); // ~1s per number including the gap below
}

function submitAnswer(userVal){
  const sess = state.session;
  const q = sess.questions[sess.index];
  const correct = Number(userVal) === q.answer;

  if(!correct){
    sess.mistakes = (sess.mistakes||0) + 1;
    sess.liveWrong = (sess.liveWrong||0) + 1; // accuracy meter dips on a wrong answer
    return false; // caller shows red, question stays, timer keeps running
  }

  const now = performance.now();
  const timeSec = (now - sess.qStart)/1000;
  const reactionSec = sess.firstKeyAt!=null ? (sess.firstKeyAt - sess.qStart)/1000 : timeSec;
  const firstTry = (sess.mistakes||0)===0; // no wrong attempts before landing on the right answer
  sess.results.push({ text:q.text, answer:q.answer, userVal, time:timeSec, reaction:reactionSec, correct:true, firstTry, mistakes: sess.mistakes||0 });
  if(q.tag) recordCombo(q.tag, timeSec);
  sess.liveCorrect = (sess.liveCorrect||0) + 1; // accuracy meter rises on a correct answer
  sess.mistakes = 0;
  sess.firstKeyAt = null;

  const fastLimit = THRESH[state.settings.op] || 5;
  const wasFast = timeSec <= fastLimit && (sess.results[sess.results.length-1].mistakes===0);
  sess.streak = wasFast ? (sess.streak||0)+1 : 0;
  sess.bestStreak = Math.max(sess.bestStreak||0, sess.streak);

  sess.index++;
  if(sess.index >= sess.questions.length){
    state.lastResults = sess.results;
    const total = sess.results.length;
    const correctCt = sess.results.filter(r=>r.firstTry).length; // wrong attempts on a question knock it out of accuracy, even though it was eventually solved
    const totalTime = sess.results.reduce((s,r)=>s+r.time,0);
    const avgTime = totalTime/total;
    const accuracy = (correctCt/total)*100;
    const timeStats = statsOf(sess.results.map(r=>r.time));
    const avgReaction = sess.results.reduce((s,r)=>s+(r.reaction||r.time),0)/total;
    const op = state.settings.op;
    const s = state.settings;
    const digitTier = Math.min(4, Math.max(s.digitA||1, s.digitB||1));
    const rank = computeRank(op, avgTime, accuracy, digitTier);
    const digitInfo = (op==='add'||op==='sub') && s.rowCount>2
      ? `${s.rowCount} numbers × ${s.digitA}-digit`
      : op==='square' ? `${s.digitA}-digit number`
      : op==='percent' ? `Percent tier ${s.digitA} · base ${s.digitB}-digit`
      : op==='table' ? `${s.tableNum} ka Table · ${s.mode==='mix'?'Mix':'Normal'}`
      : op==='subtable' ? (s.n==='all' ? `Mix All Systems (−1 se −9 tak) · ${s.mode==='mix'?'Mix':'Normal'}` : `−${s.n} System (20 se 11 tak) · ${s.mode==='mix'?'Mix':'Normal'}`)
      : op==='cbrt' ? `Cube Roots (1³–${s.range||12}³) · ${s.mode==='mix'?'Mix':'Normal'}`
      : op==='sqdrill' ? `Squares (1²–${s.range||12}²) · ${s.mode==='mix'?'Mix':'Normal'}`
      : `${s.digitA}-digit ${op==='div'?'(jawaab)':''} & ${s.digitB}-digit ${op==='div'?'(divisor)':''}`;
    state.history.push({
      id: state.history.length+1,
      ts: Date.now(),
      time: new Date().toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'}),
      op, opLabel: OP_LABEL[op],
      master: state.masterMode,
      total, correctCt, accuracy, avgTime, totalTime,
      rank, digitInfo, bestStreak: sess.bestStreak||0,
      timeStats, avgReaction,
      digitA: s.digitA||null, digitB: s.digitB||null, digitTier,
      rowCount: (op==='add'||op==='sub') ? (s.rowCount||2) : null,
      details: sess.results.map(r=>({ text:r.text, time:r.time, reaction:r.reaction, correct:r.correct, firstTry:r.firstTry, mistakes:r.mistakes||0 })),
    });
    if(!state.bestRank[op] || rank.score > state.bestRank[op].score){
      state.bestRank[op] = { tier:rank.tier, emoji:rank.emoji, score:rank.score, sub:rank.sub };
    }
    if(state.courseLevel){
      const lvl = levelById(state.courseLevel);
      const pass = lvl ? (accuracy >= lvl.minAccuracy && avgTime <= lvl.maxAvgTime) : false;
      if(pass){
        state.course.completed[lvl.id] = { avgTime, accuracy };
        if(state.course.unlocked <= lvl.id && lvl.id < COURSE_LEVELS.length){
          state.course.unlocked = lvl.id + 1;
        }
      }
      state.lastCourseResult = { levelId: state.courseLevel, pass, avgTime, accuracy, lvl };
    } else {
      state.lastCourseResult = null;
    }
    if(state.activeLevelRun){
      const { op: lop, id: lid } = state.activeLevelRun;
      const track = LEVEL_TRACKS[lop];
      const lvl = track && track.find(l=>l.id===lid);
      const prog = state.levelProgress[lop];
      const pass = lvl ? (accuracy >= lvl.minAccuracy && avgTime <= lvl.maxAvgTime) : false;
      if(lvl && prog){
        if(pass){
          prog.completed[lid] = { avgTime, accuracy };
          if(prog.unlocked <= lid && lid < track.length){
            prog.unlocked = lid + 1;
          }
        }
        state.lastLevelResult = { op: lop, id: lid, pass, avgTime, accuracy, lvl, track };
      }
      state.activeLevelRun = null;
    } else {
      state.lastLevelResult = null;
    }
    state.session = null;
    state.tab = 'results';
    vibe([40,60,40,60,160]); // session complete
    setTimeout(onlineAfterSession, 0); // push score to Live Ranking (only if joined)
    render();
  } else {
    beginQuestion(sess);
  }
  return true;
}

// Shrinks the equation text so it always stays on a single line,
// no matter how many numbers (2 upto 5+) are in the question.
function fitQtext(){
  const el = document.querySelector('.qtext') || document.querySelector('.qtext-vertical');
  if(!el) return;
  const container = el.parentElement;
  if(!container) return;
  const isVertical = el.classList.contains('qtext-vertical');
  const inFull = !!el.closest('.pf-mid');
  const maxSize = inFull ? (isVertical ? 1.75 : 2.2) : (isVertical ? 2.2 : 2.6); // rem; bigger in full-screen keypad layout
  const minSize = 1.0; // rem, smallest it will shrink to
  let size = maxSize;
  el.style.fontSize = size + 'rem';
  // step down until it fits within the container width, or we hit the floor
  let guard = 0;
  while(el.scrollWidth > container.clientWidth && size > minSize && guard < 40){
    size -= 0.1;
    el.style.fontSize = size.toFixed(2) + 'rem';
    guard++;
  }
}
window.addEventListener('resize', fitQtext);

    ${menuOpen ? `
    <div class="nav-menu-backdrop" id="navMenuBackdrop"></div>
    <div class="nav-menu">
      ${TABS.map(t=>`<button data-tab="${t.id}" class="nav-menu-item ${state.tab===t.id?'active':''}">${t.label}</button>`).join('')}
      <div class="nav-menu-divider"></div>
      <button id="navCustomizeBtn" class="nav-menu-item ${state.tab==='customize'?'active':''}">🎛️ Practice Customize</button>
      <button id="navMasterBtn" class="nav-menu-item">🎯 Master Practice</button>
      <button id="navResetBtn" class="nav-menu-item nav-menu-danger">🗑️ Data Reset</button>
      ${state.security.password ? `<button id="navChangePassBtn" class="nav-menu-item">🔑 Password Badlein</button>` : ''}
    </div>` : ''}
  `;

  document.getElementById('kebabBtn').onclick = ()=>{ state.navMenuOpen = !state.navMenuOpen; renderNav(); };
  const mediumBtn = document.getElementById('mediumToggleBtn');
  if(mediumBtn) mediumBtn.onclick = ()=>{
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    state.speakingActive = false; state.speakingRow = null;
    state.speakSettings.medium = state.speakSettings.medium==='en' ? 'hi' : 'en';
    render();
  };

  if(menuOpen){
    const backdrop = document.getElementById('navMenuBackdrop');
    if(backdrop) backdrop.onclick = ()=>{ state.navMenuOpen = false; renderNav(); };
    nav.querySelectorAll('.nav-menu-item[data-tab]').forEach(b=>{
      b.onclick = ()=>{ state.tab = b.dataset.tab; state.navMenuOpen = false; render(); };
    });
    const navCustomize = document.getElementById('navCustomizeBtn');
    if(navCustomize) navCustomize.onclick = ()=>{ state.tab = 'customize'; state.navMenuOpen = false; render(); };
    const navMaster = document.getElementById('navMasterBtn');
    if(navMaster) navMaster.onclick = ()=>{
      state.navMenuOpen = false;
      if(getWeakList().length===0){
        renderNav();
        alert('Abhi koi kamzor combination record me nahi hai — pehle kuch practice karein.');
        return;
      }
      state.courseLevel = null; state.activeLevelRun = null;
      startPractice(true);
    };
    const navReset = document.getElementById('navResetBtn');
    if(navReset) navReset.onclick = ()=>{ state.navMenuOpen = false; openResetPasswordFlow(); };
    const navChangePass = document.getElementById('navChangePassBtn');
    if(navChangePass) navChangePass.onclick = ()=>{ state.navMenuOpen = false; openChangePasswordFlow(); };
  }
}

function viewSetup(){

  const opts = Object.keys(OP_LABEL).map(k=>`<option value="${k}" ${s.op===k?'selected':''}>${OP_LABEL[k]}</option>`).join('');

    } else {

        <div><label>Dusre number ka digit length</label><select id="digitB">${digitOptsB}</select></div>

function viewCourse(){
  const totalDone = Object.keys(state.course.completed).length;
  const pct = Math.round((totalDone/COURSE_LEVELS.length)*100);

  const cards = COURSE_LEVELS.map(lvl=>{
    const done = state.course.completed[lvl.id];
    const locked = lvl.id > state.course.unlocked && !done;
    const status = done ? `✅ Poora — avg ${done.avgTime.toFixed(1)}s · ${done.accuracy.toFixed(0)}%`
                 : locked ? '🔒 Pichla level poora karo'
                 : '▶️ Ready';
    const target = lvl.master
      ? 'Target: apni kamzor combinations par 80%+ accuracy'
      : `Target: avg ≤ ${lvl.maxAvgTime}s · accuracy ≥ ${lvl.minAccuracy}%`;
    return `
    <div class="rank-op-card">
      <div class="rank-op-head">
        <span class="rank-op-name">Level ${lvl.id} · ${lvl.title}</span>
        <span>${status}</span>
      </div>
      <p class="hint">${lvl.note}</p>
      <p class="hint">${target}</p>
      <button class="btn ${locked?'secondary':''}" data-level="${lvl.id}" ${locked?'disabled':''}>${done ? 'Phir Se Karein' : 'Level Shuru Karein'}</button>
    </div>`;
  }).join('');

  return `
  <div class="card">
    <h2>Speed Course — Step by Step</h2>
    <p class="hint">Har level ek naya kaushal jodta hai. Agla level tabhi khulta hai jab pichle level ka speed aur accuracy target poora ho.</p>
    <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%"></div></div>
    <p class="hint">${totalDone}/${COURSE_LEVELS.length} level poora — ${pct}%</p>
  </div>
  <div class="card">${cards}</div>
  `;
}

function viewLevels(){
  const ops = ['add','sub','mul','div'];
  const activeOp = ops.includes(state.levelsOp) ? state.levelsOp : 'add';
  state.levelsOp = activeOp;

  const opBtns = ops.map(o=>{
    const prog = state.levelProgress[o];
    const done = Object.keys(prog.completed).length;
    const total = LEVEL_TRACKS[o].length;
    return `<button data-levelsop="${o}" class="chip-btn ${activeOp===o?'active':''}">${OP_LABEL[o].split(' ')[0]} (${done}/${total})</button>`;
  }).join('');

  const track = LEVEL_TRACKS[activeOp];
  const prog = state.levelProgress[activeOp];
  const doneCt = Object.keys(prog.completed).length;
  const pct = Math.round((doneCt/track.length)*100);

  const cards = track.map(lvl=>{
    const done = prog.completed[lvl.id];
    const locked = lvl.id > prog.unlocked && !done;
    const status = done ? `✅ Poora — avg ${done.avgTime.toFixed(2)}s · ${done.accuracy.toFixed(0)}%`
                 : locked ? '🔒 Pichla stage poora karo'
                 : '▶️ Ready';
    const target = `Target: avg ≤ ${lvl.maxAvgTime}s · accuracy ≥ ${lvl.minAccuracy}%`;
    return `
    <div class="rank-op-card">
      <div class="rank-op-head">
        <span class="rank-op-name">${STAGE_EMOJI[lvl.stage]} ${lvl.stage} · ${lvl.title}</span>
        <span>${status}</span>
      </div>
      <p class="hint">${lvl.note}</p>
      <p class="hint">${target}</p>
      <button class="btn ${locked?'secondary':''}" data-levelsop="${activeOp}" data-levelid="${lvl.id}" ${locked?'disabled':''}>${done ? 'Phir Se Karein' : 'Stage Shuru Karein'}</button>
    </div>`;
  }).join('');

  return `
  <div class="card">
    <h2>Beginner → Advanced</h2>
    <p class="hint">Har operation ka apna alag Beginner → Intermediate → Advanced track hai. Jod ka Beginner stage 1 se 10 tak ke poore range se sawaal deta hai (jaise 8+7, 5+6, 4+8) taaki sirf doubles na aayein.</p>
    <div class="chip-row">${opBtns}</div>
    <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%"></div></div>
    <p class="hint">${OP_LABEL[activeOp]} — ${doneCt}/${track.length} stage poora — ${pct}%</p>
  </div>
  <div class="card">${cards}</div>
  `;
}

function startGkQuiz(subject, topicIdx){
  const bank = GK_QUIZ[subject] && GK_QUIZ[subject][topicIdx];
  if(!bank) return;
  const questions = shuffleArr(bank.questions.map(q=>({
    ...q,
    // shuffle the option order per question, tracking the new correct index
    _order: shuffleArr(q.options.map((_,i)=>i)),
  })));
  state.gkQuiz = { subject, topicIdx, topic:bank.topic, merged:null, questions, index:0, correctCt:0, wrongCt:0, answered:null };
  render();
}
function startGkMergedQuiz(subject, topicTitles, label){
  const bank = GK_QUIZ[subject] || [];
  const merged = topicTitles.flatMap(title=>{
    const found = bank.find(b=>b.topic===title);
    return found ? found.questions : [];
  });
  if(!merged.length) return;
  const questions = shuffleArr(merged.map(q=>({
    ...q,
    _order: shuffleArr(q.options.map((_,i)=>i)),
  })));
  state.gkQuiz = { subject, topicIdx:null, topic:label, merged:topicTitles, questions, index:0, correctCt:0, wrongCt:0, answered:null };
  render();
}
function groupMergableGkTopics(quizBank){
  // groups topics sharing a common "Prefix – Rest" naming pattern, so they can be combined into one Mahaquiz
  const groups = {};
  quizBank.forEach(t=>{
    const idx = t.topic.indexOf(' – ');
    if(idx>-1){
      const prefix = t.topic.slice(0, idx);
      (groups[prefix] = groups[prefix]||[]).push(t.topic);
    }
  });
  return Object.entries(groups).filter(([,titles])=>titles.length>1);
}
function answerGkQuiz(selectedOrigIdx){
  const quiz = state.gkQuiz;
  if(!quiz || quiz.answered!=null) return;
  const q = quiz.questions[quiz.index];
  const correct = selectedOrigIdx === q.answer;
  quiz.answered = selectedOrigIdx;
  if(correct) quiz.correctCt++; else quiz.wrongCt++; // accuracy meter: up on sahi, down on galat
  render();
}
function nextGkQuizQuestion(){
  const quiz = state.gkQuiz;
  if(!quiz) return;
  quiz.index++;
  quiz.answered = null;
  render();
}
function quitGkQuiz(){
  state.gkQuiz = null;
  render();
}

function viewGkQuizSession(){
  const quiz = state.gkQuiz;
  const total = quiz.questions.length;
  if(quiz.index >= total){
    const acc = total>0 ? Math.round((quiz.correctCt/total)*100) : 0;
    const msg = acc>=90 ? 'Zabardast! 🏆' : acc>=70 ? 'Badhiya kaam! 👍' : 'Aur practice karo — ho jayega! 💪';
    return `
    <div class="card practice-box">
      <h2>Quiz Poora — ${quiz.subject ? GK_DATA[quiz.subject].label : ''} · ${quiz.topic}</h2>
      <div class="stats-grid">
        <div class="stat"><div class="stat-num">${quiz.correctCt}/${total}</div><div class="stat-label">Sahi</div></div>
        <div class="stat"><div class="stat-num">${acc}%</div><div class="stat-label">Accuracy</div></div>
      </div>
      <p class="hint">${msg}</p>
      <button class="btn teal" id="retryGkQuizBtn">🔁 Yeh Quiz Phir Se Karein</button>
      <button class="btn secondary" id="quitGkQuizBtn">📚 Topics Par Wapas Jayein</button>
    </div>`;
  }
  const q = quiz.questions[quiz.index];
  const liveTotal = quiz.correctCt + quiz.wrongCt;
  const liveAcc = liveTotal>0 ? Math.round((quiz.correctCt/liveTotal)*100) : 100;
  const liveAccColor = liveAcc>=90 ? 'var(--green)' : liveAcc>=70 ? 'var(--amber)' : 'var(--red)';
  const liveAccHtml = liveTotal>0 ? `<div class="timer" style="color:${liveAccColor};">🎯 Live Accuracy: ${liveAcc}% (${quiz.correctCt} sahi / ${quiz.wrongCt} galat)</div>` : '';
  const optsHtml = q._order.map(origIdx=>{
    let cls = 'quiz-opt';
    if(quiz.answered!=null){
      if(origIdx===q.answer) cls += ' correct';
      else if(origIdx===quiz.answered) cls += ' wrong';
    }
    return `<button class="${cls}" data-gkopt="${origIdx}" ${quiz.answered!=null?'disabled':''}>${q.options[origIdx]}</button>`;
  }).join('');
  return `
  <div class="card practice-box">
    <div class="progress">Sawaal ${quiz.index+1} / ${total} · ${quiz.topic}</div>
    <div class="qtext" style="font-size:1.1rem;">${q.q}</div>
    <div class="quiz-opts">${optsHtml}</div>
    ${liveAccHtml}
    ${quiz.answered!=null ? `<button class="btn teal" id="nextGkQuizBtn">${quiz.index+1>=total ? 'Result Dekhein →' : 'Agla Sawaal →'}</button>` : ''}
    <button class="btn secondary" id="quitGkQuizBtn">✋ Quiz Band Karein</button>
  </div>`;
}

// Turns "60 + 12 + 37" into a stacked column layout (like paper column-addition):
//   60
// + 12
// + 37
// -----
//   ?
// Falls back to the normal horizontal line if the question has no space-separated
// operator (e.g. squares/cubes like "23²" or "∛125") since those can't be stacked.
function buildVerticalQtext(text, bare){
  const tokens = text.split(' ').filter(t=>t.length);
  if(tokens.length < 3){
    return `<div class="qtext num">${text}${bare?'':' = ?'}</div>`;
  }
  // operator sits on the left, numbers line up on the right (paper-style column)
  const lines = [`<div class="vline"><span class="vop"></span><span>${tokens[0]}</span></div>`];
  for(let i=1;i<tokens.length;i+=2){
    const op = tokens[i], num = tokens[i+1];
    if(num===undefined) break;
    lines.push(`<div class="vline"><span class="vop">${op}</span><span>${num}</span></div>`);
  }
  if(!bare) lines.push(`<div class="vline vline-rule"><span class="vop"></span><span>?</span></div>`);
  return `<div class="qtext-vertical num">${lines.join('')}</div>`;
}

    return `<div class="card"><p class="empty-msg">Abhi tak koi result nahi. Ek practice session poora karein.</p></div>`;
  }
  const sorted = [...res].sort((a,b)=> b.time - a.time); // slowest first (top), fastest last
  const maxTime = Math.max(...res.map(r=>r.time));
  const correctCount = res.filter(r=>r.firstTry).length;
  const totalTime = res.reduce((s,r)=>s+r.time,0);
  const avgTime = totalTime/res.length;
  const ts = statsOf(res.map(r=>r.time));
  const avgReaction = res.reduce((s,r)=>s+(r.reaction!=null?r.reaction:r.time),0)/res.length;

  const rows = sorted.map(r=>{
    const pct = Math.max(8, (r.time/maxTime)*100);
    const color = r.time===maxTime ? 'var(--red)' : (r.time===Math.min(...res.map(x=>x.time)) ? 'var(--green)' : 'var(--amber)');
    return `
    <div class="ladder-row">
      <div class="ladder-q num">${r.text} ${r.firstTry ? '✅' : `❌ (${r.mistakes} galat try)`}</div>
      <div class="ladder-bar-wrap"><div class="ladder-bar" style="width:${pct}%; background:${color};"></div></div>
      <div class="ladder-time num">${r.time.toFixed(3)}s</div>
    </div>`;
  }).join('');

  const rank = state.history.length ? state.history[state.history.length-1].rank : null;

  let courseBlock = '';
  const cr = state.lastCourseResult;
  if(cr && cr.lvl){
    const nextLvl = levelById(cr.levelId+1);
    courseBlock = `
    <div class="card">
      <h2>${cr.pass ? '🎉 Level Poora!' : '🔁 Target Abhi Nahi Mila'}</h2>
      <p class="hint">Level ${cr.levelId} · ${cr.lvl.title} — ${cr.lvl.master ? 'Master Practice target' : `target avg ≤ ${cr.lvl.maxAvgTime}s · accuracy ≥ ${cr.lvl.minAccuracy}%`}</p>
      <p class="hint">Aapka result: avg ${cr.avgTime.toFixed(3)}s · accuracy ${cr.accuracy.toFixed(0)}%</p>
      ${cr.pass && nextLvl ? `<button class="btn teal" id="nextLevelBtn" data-level="${nextLvl.id}">Agla Level: ${nextLvl.title} →</button>` : ''}
      ${cr.pass && !nextLvl ? `<p class="hint">Poora course complete ho gaya — badhiya! 🏆</p>` : ''}
      ${!cr.pass ? `<button class="btn teal" id="retryLevelBtn" data-level="${cr.levelId}">Yeh Level Phir Se Karein</button>` : ''}
      <button class="btn secondary" id="backCourseBtn">Course Par Wapas Jayein</button>
    </div>`;
  }

  let levelBlock = '';
  const lr = state.lastLevelResult;
  if(lr && lr.lvl){
    const nextLvl = lr.track.find(l=>l.id===lr.id+1);
    levelBlock = `
    <div class="card">
      <h2>${lr.pass ? '🎉 Stage Poora!' : '🔁 Target Abhi Nahi Mila'}</h2>
      <p class="hint">${OP_LABEL[lr.op]} · ${STAGE_EMOJI[lr.lvl.stage]} ${lr.lvl.stage} — ${lr.lvl.title} — target avg ≤ ${lr.lvl.maxAvgTime}s · accuracy ≥ ${lr.lvl.minAccuracy}%</p>
      <p class="hint">Aapka result: avg ${lr.avgTime.toFixed(3)}s · accuracy ${lr.accuracy.toFixed(0)}%</p>
      ${lr.pass && nextLvl ? `<button class="btn teal" id="nextLevelTrackBtn" data-op="${lr.op}" data-level="${nextLvl.id}">Agla Stage: ${STAGE_EMOJI[nextLvl.stage]} ${nextLvl.title} →</button>` : ''}
      ${lr.pass && !nextLvl ? `<p class="hint">${OP_LABEL[lr.op]} ka poora track complete — Advanced tak pahunch gaye! 🏆</p>` : ''}
      ${!lr.pass ? `<button class="btn teal" id="retryLevelTrackBtn" data-op="${lr.op}" data-level="${lr.id}">Yeh Stage Phir Se Karein</button>` : ''}
      <button class="btn secondary" id="backLevelsBtn">Beginner→Advanced Par Wapas Jayein</button>
    </div>`;
  }

  const lastStreak = state.history.length ? state.history[state.history.length-1].bestStreak : 0;
  const consistencyLabel = ts.stdDev<0.5 ? 'Bahut Stable 🎯' : ts.stdDev<1.2 ? 'Stable' : 'Utaar-Chadhaav';

  return `
  ${courseBlock}
  ${levelBlock}
  <div class="card">
    <h2>Result — Sabse dheema upar, sabse tez neeche</h2>
    <div class="stats-grid">
      <div class="stat"><div class="stat-num">${correctCount}/${res.length}</div><div class="stat-label">Sahi</div></div>
      <div class="stat"><div class="stat-num">${avgTime.toFixed(3)}s</div><div class="stat-label">Average time</div></div>
      <div class="stat"><div class="stat-num">${totalTime.toFixed(3)}s</div><div class="stat-label">Total time</div></div>
      ${rank ? `<div class="stat"><div class="stat-num">${rank.emoji} ${rank.tier} ${rank.sub}</div><div class="stat-label">Rank · Score ${rank.score}/100</div></div>` : ''}
      ${lastStreak>=2 ? `<div class="stat"><div class="stat-num">🔥 ${lastStreak}</div><div class="stat-label">Best Speed Streak</div></div>` : ''}
    </div>
    <p class="hint">🎯 Accuracy sirf pehle try me sahi jawaab ka % hai — ek baar bhi red (galat) hua to woh sawaal "sahi" nahi ginta, chahe baad me sahi jawaab de diya ho.</p>
    ${rows}
    <button class="btn secondary" id="homeBtn">🏠 Home — Naya Setup Karein</button>
  </div>
  <div class="card">
    <h2>⏱️ Timing Analytics</h2>
    <div class="stats-grid">
      <div class="stat"><div class="stat-num">${ts.min.toFixed(3)}s</div><div class="stat-label">Fastest</div></div>
      <div class="stat"><div class="stat-num">${ts.max.toFixed(3)}s</div><div class="stat-label">Slowest</div></div>
      <div class="stat"><div class="stat-num">${ts.median.toFixed(3)}s</div><div class="stat-label">Median</div></div>
      <div class="stat"><div class="stat-num">${avgReaction.toFixed(3)}s</div><div class="stat-label">Avg Reaction Time</div></div>
    </div>
    <p class="hint">Consistency (std. dev): <b class="num">±${ts.stdDev.toFixed(3)}s</b> — ${consistencyLabel}</p>
    <p class="hint">Reaction Time = pehli key press tak ka waqt · Solve Time = jawaab jama karne tak ka poora waqt. Reaction time kam karo to overall speed apne aap badhegi.</p>
  </div>`;
}

    ${rows}
    <button class="btn secondary" id="homeBtn2">🏠 Home — Naya Setup Karein</button>
  </div>`;
