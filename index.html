function viewRank(){
  if(state.history.length===0){
    return `<div class="card"><p class="empty-msg">Rank dekhne ke liye pehle ek practice session poora karein.</p></div>`;
  }
  const ops = ['add','sub','mul','div','mix','lcm','square','percent'].filter(op => state.history.some(h=>h.op===op));
  const scores = state.history.map(h=>h.rank.score);
  const avgScore = Math.round(scores.reduce((s,x)=>s+x,0)/scores.length);
  const overall = tierFromScore(avgScore);
  const overallProgress = overall.next ? Math.round(((avgScore-overall.min)/(overall.max-overall.min))*100) : 100;
  const scoreStd = Math.sqrt(scores.reduce((s,x)=>s+(x-avgScore)*(x-avgScore),0)/scores.length);
  const recentScores = scores.slice(-5);
  const recentAvg = recentScores.reduce((s,x)=>s+x,0)/recentScores.length;
  const overallTrend = scores.length>=2
    ? (recentAvg > avgScore+1 ? '📈 Recent sessions overall se behtar' : recentAvg < avgScore-1 ? '📉 Recent sessions overall se kamzor' : '➡️ Stable performance')
    : '';

  const perOp = ops.map(op=>{
    const entries = state.history.filter(h=>h.op===op);
    const latest = entries[entries.length-1];
    const prev = entries.length>1 ? entries[entries.length-2] : null;
    const best = state.bestRank[op];
    const nextText = latest.rank.next ? `agla: ${latest.rank.next.emoji} ${latest.rank.next.tier}` : 'top rank!';
    const trendArrow = prev
      ? (latest.rank.score > prev.rank.score ? '↑' : latest.rank.score < prev.rank.score ? '↓' : '→')
      : '';
    const trendColor = trendArrow==='↑' ? 'var(--green)' : trendArrow==='↓' ? 'var(--red)' : 'rgba(241,236,221,0.6)';
    return `
    <div class="rank-op-card">
      <div class="rank-op-head">
        <span class="rank-op-name">${OP_LABEL[op]}</span>
        <span>${latest.rank.emoji} ${latest.rank.tier} ${latest.rank.sub} ${trendArrow?`<span style="color:${trendColor}">${trendArrow}</span>`:''}</span>
      </div>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${latest.rank.progressPct}%"></div></div>
      <div class="hist-stats">
        <span>Score ${latest.rank.score}/100</span>
        <span>${nextText}</span>
        ${best ? `<span>Best: ${best.emoji} ${best.tier} ${best.sub||''}</span>` : ''}
        <span>Sessions: ${entries.length}</span>
      </div>
    </div>`;
  }).join('');

  // Milestone badges
  const badges = [];
  if(scoreStd < 8 && scores.length>=3) badges.push({emoji:'🎯', label:'Consistent Performer', note:`Score variation sirf ±${scoreStd.toFixed(0)}`});
  const bestStreakEver = state.history.reduce((m,h)=>Math.max(m,h.bestStreak||0),0);
  if(bestStreakEver>=5) badges.push({emoji:'🔥', label:'Speed Streaker', note:`${bestStreakEver} sawaal lagatar tez solve kiye`});
  ops.forEach(op=>{
    if(state.bestRank[op] && state.bestRank[op].score>=93) badges.push({emoji:'👑', label:`${OP_LABEL[op]} Grandmaster`, note:`Best score ${state.bestRank[op].score}/100`});
  });
  const totalQ = state.history.reduce((s,h)=>s+h.total,0);
  if(totalQ>=100) badges.push({emoji:'💯', label:'Century Club', note:`${totalQ} sawaal ab tak solve kiye`});
  const badgesHtml = badges.length
    ? `<div class="chip-row">${badges.map(b=>`<span class="combo-chip" style="background:var(--teal);" title="${b.note}">${b.emoji} ${b.label}</span>`).join('')}</div>`
    : `<p class="hint">Aur practice karo — badges yahan unlock honge.</p>`;

  return `
  <div class="card">
    <h2>Overall Rank</h2>
    <div class="stats-grid">
      <div class="stat"><div class="stat-num" style="font-size:2rem;">${overall.emoji}</div><div class="stat-label">${overall.tier} ${overall.sub} · Score ${avgScore}/100</div></div>
      <div class="stat"><div class="stat-num">±${scoreStd.toFixed(0)}</div><div class="stat-label">Consistency</div></div>
    </div>
    <div class="rank-bar-wrap"><div class="rank-bar" style="width:${overallProgress}%"></div></div>
    <p class="hint">${overall.next ? `Agli rank ${overall.next.emoji} ${overall.next.tier} tak ${overall.max - avgScore} score aur chahiye.` : 'Aap sabse top rank par ho!'}</p>
    ${overallTrend ? `<p class="hint">${overallTrend}</p>` : ''}
  </div>
  <div class="card">
    <h2>Badges</h2>
    ${badgesHtml}
  </div>
  <div class="card">
    <h2>Operation-wise Rank</h2>
    ${perOp}
    <p class="hint">Score speed (limit time ke muqable average time) aur accuracy dono se banta hai — 50% weight har ek ko. Har tier ke andar 1→2→3→4 sub-levels hote hain, jitna high number utna agli tier ke paas (jaise Silver 4 ke baad Gold 1 aata hai).</p>
  </div>`;
}

function viewAnalysis(){
  if(state.history.length===0){
    return `<div class="card"><p class="empty-msg">Analysis dekhne ke liye pehle kuch practice sessions poore karein.</p></div>`;
  }
  const PILLAR_OPS = ['add','sub','mul','div','mix'].filter(op => state.history.some(h=>h.op===op));

  // Per-operation summary: average score/accuracy/time across all sessions of that op.
  const opStats = PILLAR_OPS.map(op=>{
    const entries = state.history.filter(h=>h.op===op);
    const avgScore = entries.reduce((s,e)=>s+e.rank.score,0)/entries.length;
    const avgAcc = entries.reduce((s,e)=>s+e.accuracy,0)/entries.length;
    const avgTime = entries.reduce((s,e)=>s+e.avgTime,0)/entries.length;
    return { op, sessions: entries.length, avgScore, avgAcc, avgTime };
  }).sort((a,b)=> b.avgScore - a.avgScore);

  const strengths = opStats.slice(0,2);
  const weaknesses = [...opStats].reverse().slice(0,2);

  const strengthChips = strengths.map(o=>
    `<span class="combo-chip" style="background:var(--green);">${OP_LABEL[o.op]} · avg score ${o.avgScore.toFixed(0)}/100</span>`
  ).join('');
  const weaknessChips = weaknesses.map(o=>
    `<span class="combo-chip" style="background:var(--red);">${OP_LABEL[o.op]} · avg score ${o.avgScore.toFixed(0)}/100</span>`
  ).join('');

  // Consistency — how much scores swing session to session.
  const scores = state.history.map(h=>h.rank.score);
  const meanScore = scores.reduce((s,x)=>s+x,0)/scores.length;
  const scoreStd = Math.sqrt(scores.reduce((s,x)=>s+(x-meanScore)*(x-meanScore),0)/scores.length);
  const consistencyLabel = scoreStd<6 ? 'Bahut Consistent 🎯' : scoreStd<14 ? 'Thodi Ups-Downs' : 'Inconsistent — practice ka pattern set karo';

  // Digit-tier weak spots across the four pillars, using each history entry's digitTier.
  const tierCounts = {1:0,2:0,3:0};
  state.history.filter(h=>['add','sub','mul','div','mix'].includes(h.op)).forEach(h=>{
    if(h.digitTier) tierCounts[h.digitTier] = (tierCounts[h.digitTier]||0) + 1;
  });
  const leastPracticedTier = Object.entries(tierCounts).sort((a,b)=>a[1]-b[1])[0];

  const weakList = getWeakList();
  const weakByTier = {1:0,2:0,3:0};
  weakList.forEach(w=>{ weakByTier[w.tier] = (weakByTier[w.tier]||0)+1; });

  // Recommendations — plain-language next steps built from the numbers above.
  const recs = [];
  if(weaknesses[0]) recs.push(`${OP_LABEL[weaknesses[0].op]} me sabse kam score aa raha hai (${weaknesses[0].avgScore.toFixed(0)}/100) — isi par Master Practice ya Levels track try karein.`);
  if(weakList.length>0) recs.push(`Abhi ${weakList.length} kamzor combinations record me hain — sabse zyada ${TIER_LABEL[Object.entries(weakByTier).sort((a,b)=>b[1]-a[1])[0][0]]} me hain.`);
  if(leastPracticedTier && Number(leastPracticedTier[1])===0) recs.push(`${TIER_LABEL[leastPracticedTier[0]]} numbers ki practice abhi tak nahi hui — Setup se ek round try karein.`);
  if(scoreStd>=14) recs.push('Score session-to-session bahut upar-neeche ho raha hai — roz thoda thoda practice karo, ek hi din bahut zyada mat karo.');
  if(recs.length===0) recs.push('Sab operations me balanced progress hai — is tarah practice jaari rakho!');

  const opRows = opStats.map(o=>`
    <div class="hist-row">
      <div class="hist-main">
        <span class="hist-op">${OP_LABEL[o.op]}</span>
        <span class="num">${o.avgScore.toFixed(0)}/100</span>
      </div>
      <div class="hist-stats">
        <span>Sessions: ${o.sessions}</span>
        <span>Avg accuracy: ${o.avgAcc.toFixed(0)}%</span>
        <span>Avg time: ${o.avgTime.toFixed(2)}s</span>
      </div>
    </div>`).join('');

  return `
  <div class="card">
    <h2>🔎 Strengths & Weaknesses</h2>
    <p class="hint">Best</p>
    <div class="chip-row">${strengthChips || '<span class="empty-msg">Data kam hai</span>'}</div>
    <p class="hint" style="margin-top:10px;">Needs Work</p>
    <div class="chip-row">${weaknessChips || '<span class="empty-msg">Data kam hai</span>'}</div>
  </div>
  <div class="card">
    <h2>Operation-wise Summary</h2>
    ${opRows}
  </div>
  <div class="card">
    <h2>Consistency</h2>
    <div class="stats-grid">
      <div class="stat"><div class="stat-num">±${scoreStd.toFixed(0)}</div><div class="stat-label">Score Variation</div></div>
      <div class="stat"><div class="stat-num" style="font-size:1.1rem;">${consistencyLabel}</div><div class="stat-label">Overall Pattern</div></div>
    </div>
  </div>
  <div class="card">
    <h2>💡 Recommendations</h2>
    <ul class="tip-list">${recs.map(r=>`<li>${r}</li>`).join('')}</ul>
  </div>`;
}

  const overallAccuracy = (totalCorrect/totalQuestions)*100;
  const bestStreakEver = state.history.reduce((m,h)=>Math.max(m,h.bestStreak||0),0);
  const totalMins = totalTimeSpent/60;

  const overviewCard = `

    </div>

  </div>`;

  const ops = ['add','sub','mul','div','mix','lcm','square','percent','table','sqdrill','cbrt','subtable'].filter(op => state.history.some(h=>h.op===op));
  const FOUR_PILLARS = ['add','sub','mul','div'];
  const digitFilter = state.progressDigitFilter || 'all';
  const filterChips = `
  <div class="card">
    <h2>📊 Progress Check — Apne Hisab Se</h2>
    <p class="hint">Digit ya Row chuno, sirf wahi subsection dikhega.</p>
    <div class="chip-row">
      <button data-progfilter="all" class="chip-btn ${digitFilter==='all'?'active':''}">Sabhi</button>
      <button data-progfilter="1" class="chip-btn ${digitFilter==='1'?'active':''}">1-Digit</button>
      <button data-progfilter="2" class="chip-btn ${digitFilter==='2'?'active':''}">2-Digit</button>
      <button data-progfilter="3" class="chip-btn ${digitFilter==='3'?'active':''}">3-Digit</button>
      <button data-progfilter="4" class="chip-btn ${digitFilter==='4'?'active':''}">4-Digit</button>
      <button data-progfilter="row" class="chip-btn ${digitFilter==='row'?'active':''}">Row</button>
    </div>
  </div>`;
  const blocks = ops.map(op=>{
    const entries = state.history.filter(h=>h.op===op);
    const maxTime = Math.max(...entries.map(e=>e.avgTime));
    const bars = entries.map(e=>{
      const pct = Math.max(6,(e.avgTime/maxTime)*100);
      return `<div class="prog-bar-wrap" title="${e.avgTime.toFixed(2)}s · ${e.accuracy.toFixed(0)}% accuracy"><div class="prog-bar" style="height:${pct}%"></div></div>`;
    }).join('');
    const accBars = entries.map(e=>{
      const pct = Math.max(6, e.accuracy);
      const color = e.accuracy>=90 ? 'var(--green)' : e.accuracy>=70 ? 'var(--amber)' : 'var(--red)';
      return `<div class="prog-bar-wrap" title="${e.accuracy.toFixed(0)}% accuracy"><div class="prog-bar" style="height:${pct}%; background:${color};"></div></div>`;
    }).join('');
    const first = entries[0].avgTime, last = entries[entries.length-1].avgTime;
    const diffPct = ((first-last)/first*100).toFixed(0);
    const trendMsg = entries.length>1
      ? (last<first ? `${diffPct}% tez ho gaye ho pehle session se 🎉` : `Abhi pehle session se ${Math.abs(diffPct)}% dheema ho — practice jaari rakho`)
      : `Sirf ek session hua hai, aur practice karo trend dekhne ke liye`;
    const bestTime = Math.min(...entries.map(e=>e.avgTime));
    const bestAcc = Math.max(...entries.map(e=>e.accuracy));
    const opQuestions = entries.reduce((s,e)=>s+e.total,0);
    const opAccuracy = (entries.reduce((s,e)=>s+e.correctCt,0)/opQuestions)*100;

    // Progress Check — subsection under subsection: 1-digit / 2-digit / 3-digit / 4-digit, with the exact
    // digit-combos practiced inside each tier (e.g. "1×2 digit"), only for the four pillars.
    // Filterable via state.progressDigitFilter so the user can look at just the tier/row they want.
    let tierCheckHtml = '';
    if(FOUR_PILLARS.includes(op)){
      const tierNums = digitFilter==='all' ? [1,2,3,4] : (digitFilter==='row' ? [] : [Number(digitFilter)]);
      const tierBlocks = tierNums.map(tier=>{
        const tEntries = entries.filter(e=>e.digitTier===tier);
        if(tEntries.length===0) return '';
        const combos = {};
        tEntries.forEach(e=>{
          const k = `${e.digitA||'?'} × ${e.digitB||'?'} digit`;
          combos[k] = (combos[k]||0) + 1;
        });
        const comboChips = Object.entries(combos)
          .map(([k,c])=>`<span class="combo-chip">${k} · ${c} session${c>1?'s':''} practiced</span>`)
          .join('');
        const tQ = tEntries.reduce((s,e)=>s+e.total,0);
        const tAcc = (tEntries.reduce((s,e)=>s+e.correctCt,0)/tQ)*100;
        const tAvg = tEntries.reduce((s,e)=>s+e.avgTime,0)/tEntries.length;
        return `
        <div class="tier-sub">
          <h4>${TIER_LABEL[tier]}</h4>
          <p class="hint">${tEntries.length} session${tEntries.length>1?'s':''} · ${tQ} sawaal · avg <b class="num">${tAvg.toFixed(2)}s</b> · <b class="num">${tAcc.toFixed(0)}%</b> accuracy</p>
          <div>${comboChips}</div>
        </div>`;
      }).join('');
      const tierEmpty = tierNums.length>0 && tierBlocks.trim()==='' ? `<p class="empty-msg">Is digit-tier ki abhi tak koi practice nahi hai.</p>` : '';

      let rowCheckHtml = '';
      if(op==='add' && (digitFilter==='all' || digitFilter==='row')){
        const rowGroups = {};
        entries.forEach(e=>{
          const rc = e.rowCount || 2;
          if(!rowGroups[rc]) rowGroups[rc] = [];
          rowGroups[rc].push(e);
        });
        const rowKeys = Object.keys(rowGroups).map(Number).sort((a,b)=>a-b);
        if(rowKeys.length>1 || rowKeys[0]>2 || digitFilter==='row'){
          const rowChips = rowKeys.map(rc=>{
            const g = rowGroups[rc];
            return `<span class="combo-chip">${rc} numbers/row · ${g.length} session${g.length>1?'s':''}</span>`;
          }).join('');
          rowCheckHtml = `<div class="tier-sub"><h4>Row Practice</h4><div>${rowChips || '<p class="empty-msg">Abhi tak koi row practice nahi hai.</p>'}</div></div>`;
        } else if(digitFilter==='row'){
          rowCheckHtml = `<p class="empty-msg">Abhi tak koi row practice nahi hai.</p>`;
        }
      }

      tierCheckHtml = `
      <div class="tier-sub-wrap">
        <h4 style="margin-bottom:2px;">📊 Progress Check</h4>
        <p class="hint">Kaunse digit-tier aur combination practice ki hai — subsection wise.</p>
        ${tierBlocks}${tierEmpty}
        ${rowCheckHtml}
      </div>`;
    }

    return `
    <div class="tip-group">
      <h3>${OP_LABEL[op]} <span class="hint">(${entries.length} session${entries.length>1?'s':''} · ${opQuestions} sawaal)</span></h3>
      <p class="hint">Average time trend (neeche = tez)</p>
      <div class="prog-chart">${bars}</div>
      <p class="hint">Accuracy trend (upar = behtar)</p>
      <div class="prog-chart">${accBars}</div>
      <div class="hist-stats" style="margin-top:8px;">
        <span>Best avg: <b class="num">${bestTime.toFixed(2)}s</b></span>
        <span>Best accuracy: <b class="num">${bestAcc.toFixed(0)}%</b></span>
        <span>Overall accuracy: <b class="num">${opAccuracy.toFixed(0)}%</b></span>
      </div>
      <p class="hint">${trendMsg}</p>
      ${tierCheckHtml}
    </div>`;
  }).join('');
  return `${overviewCard}${filterChips}<div class="card"><h2>Progress — Per Operation Detail</h2>${blocks}</div>`;
}

function viewLeaderboard(){
  const opsWithRecords = ['add','sub','mul','div'].filter(op => Object.keys(state.records[op]).length>0);

    return `<div class="card"><p class="empty-msg">Abhi tak koi calculation record nahi hai — pehle practice karein, har sawaal yahan record hoga.</p></div>`;
  }
  const op = opsWithRecords.includes(state.leaderOpFilter) ? state.leaderOpFilter : opsWithRecords[0];
  state.leaderOpFilter = op;

  const opBtns = opsWithRecords.map(o=>
    `<button data-leaderop="${o}" class="chip-btn ${op===o?'active':''}">${OP_LABEL[o].split(' ')[0]}</button>`
  ).join('');
  const tierFilter = state.leaderTierFilter;
  const tierBtns = ['all','1','2','3'].map(t=>{
    const label = t==='all' ? 'Sab' : `${t}-Digit`;
    return `<button data-leadertier="${t}" class="chip-btn ${tierFilter===t?'active':''}">${label}</button>`;
  }).join('');

  const entries = Object.values(state.records[op])
    .filter(r => tierFilter==='all' || String(r.tier)===tierFilter);

  const tiersToShow = tierFilter==='all' ? [1,2,3] : [Number(tierFilter)];
  const blocks = tiersToShow.map(tier=>{
    const items = entries.filter(e=>e.tier===tier).sort((a,b)=>a.best-b.best);
    if(items.length===0) return '';
    const rows = items.map((e,i)=>{
      const text = op==='div' ? `${e.a*e.b} ÷ ${e.a}` : `${e.a} ${OP_SYMBOL[op]} ${e.b}`;
      const medal = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : `#${i+1}`;
      return `
      <div class="hist-row">
        <div class="hist-main">
          <span class="hist-op num">${medal} ${text}</span>
          <span class="hist-time-tag num">${formatPulse(e.best)}</span>
        </div>

          <span>Best: ${e.best.toFixed(3)}s</span>
          <span>Attempts: ${e.attempts}</span>
          <span>Last: ${e.lastTime.toFixed(3)}s</span>
        </div>
      </div>`;
    }).join('');
    return `<div class="tip-group"><h3>${TIER_LABEL[tier]} <span class="hint">(${items.length} calculations)</span></h3>${rows}</div>`;
  }).join('');

  return `
  <div class="card">
    <h2>📊 Calculation Leaderboard</h2>
    <p class="hint">Har sawaal jo aapne solve kiya uska sabse tez (best) time yahan record hota hai — 1-digit, 2-digit aur 3-digit alag track hote hain.</p>

}

function openResetPasswordFlow(){
  state.passwordModal = state.security.password
    ? { mode:'verify', purpose:'reset', pass1:'', pass2:'', old:'', error:'' }
    : { mode:'create', purpose:'reset', pass1:'', pass2:'', old:'', error:'' };
  render();
}

function openChangePasswordFlow(){
  state.passwordModal = state.security.password
    ? { mode:'change-verify', purpose:'change', pass1:'', pass2:'', old:'', error:'' }
    : { mode:'create', purpose:'change', pass1:'', pass2:'', old:'', error:'' };
  render();
}

function closePasswordModal(){
  state.passwordModal = null;
  render();
}

async function submitPasswordModal(){
  const m = state.passwordModal;
  if(!m) return;

  if(m.mode === 'create'){
    const p1 = (m.pass1||'').trim();
    const p2 = (m.pass2||'').trim();
    if(p1.length < 4){ m.error = 'Password kam se kam 4 characters ka hona chahiye.'; renderPasswordModal(); return; }
    if(p1 !== p2){ m.error = 'Dono password match nahi kar rahe.'; renderPasswordModal(); return; }
    state.security.password = p1;
    if(m.purpose === 'reset'){
      await resetDataCore();
    } else {
      state.passwordModal = null;
      render();
    }
    return;
  }

  if(m.mode === 'verify'){
    if((m.pass1||'') !== state.security.password){
      m.error = 'Galat password. Dobara try karein.';
      m.pass1 = '';
      renderPasswordModal();
      return;
    }
    await resetDataCore();
    return;
  }

  if(m.mode === 'change-verify'){
    if((m.old||'') !== state.security.password){
      m.error = 'Purana password galat hai.';
      m.old = '';
      renderPasswordModal();
      return;
    }
    state.passwordModal = { mode:'create', purpose:'change', pass1:'', pass2:'', old:'', error:'' };
    render();
    return;
  }
}

function renderPasswordModal(){
  const root = document.getElementById('pwModalRoot');
  if(!root) return;
  const m = state.passwordModal;
  if(!m){ root.innerHTML = ''; return; }

  let title = '', body = '', submitLabel = 'Confirm';
  if(m.mode === 'create'){
    title = m.purpose==='reset' ? '🔒 Reset Password Banayein' : '🔒 Naya Password Banayein';
    body = `
      <p class="hint">Yeh password aapke Data Reset ko protect karega — isse yaad rakhein.</p>
      <label>Naya Password (kam se kam 4 characters)</label>
      <input type="password" id="pwInput1" value="${m.pass1 ? m.pass1.replace(/"/g,'&quot;') : ''}" autocomplete="off">
      <label>Password Confirm Karein</label>
      <input type="password" id="pwInput2" value="${m.pass2 ? m.pass2.replace(/"/g,'&quot;') : ''}" autocomplete="off">
    `;
    submitLabel = m.purpose==='reset' ? 'Set Karein aur Reset Karein' : 'Save Karein';
  } else if(m.mode === 'verify'){
    title = '🔒 Data Reset — Password Daalein';
    body = `
      <p class="hint">Sara practice data (history, records, rank, tips) permanently delete ho jaayega. Continue karne ke liye password daalein.</p>
      <label>Password</label>
      <input type="password" id="pwInput1" value="${m.pass1 ? m.pass1.replace(/"/g,'&quot;') : ''}" autocomplete="off">
    `;
    submitLabel = 'Data Reset Karein';
  } else if(m.mode === 'change-verify'){
    title = '🔑 Password Badlein';
    body = `
      <p class="hint">Pehle apna current password daalein.</p>
      <label>Current Password</label>
      <input type="password" id="pwOld" value="${m.old ? m.old.replace(/"/g,'&quot;') : ''}" autocomplete="off">
    `;
    submitLabel = 'Aage Badhein';
  }

  root.innerHTML = `
    <div class="pw-modal-backdrop" id="pwBackdrop"></div>
    <div class="pw-modal card">
      <h2>${title}</h2>
      ${body}
      ${m.error ? `<p class="pw-error">⚠️ ${m.error}</p>` : ''}
      <div class="pw-modal-actions">
        <button class="btn secondary" id="pwCancelBtn">Cancel</button>
        <button class="btn" id="pwSubmitBtn">${submitLabel}</button>
      </div>
    </div>
  `;

  const backdrop = document.getElementById('pwBackdrop');
  if(backdrop) backdrop.onclick = closePasswordModal;
  const cancelBtn = document.getElementById('pwCancelBtn');
  if(cancelBtn) cancelBtn.onclick = closePasswordModal;
  const submitBtn = document.getElementById('pwSubmitBtn');
  if(submitBtn) submitBtn.onclick = submitPasswordModal;

  const i1 = document.getElementById('pwInput1');
  if(i1){
    i1.focus();
    i1.oninput = e=>{ m.pass1 = e.target.value; };
    i1.onkeydown = e=>{
      if(e.key!=='Enter') return;
      const i2 = document.getElementById('pwInput2');
      if(i2) i2.focus(); else submitPasswordModal();
    };
  }
  const i2 = document.getElementById('pwInput2');
  if(i2){
    i2.oninput = e=>{ m.pass2 = e.target.value; };
    i2.onkeydown = e=>{ if(e.key==='Enter') submitPasswordModal(); };
  }
  const iOld = document.getElementById('pwOld');
  if(iOld){
    iOld.focus();
    iOld.oninput = e=>{ m.old = e.target.value; };
    iOld.onkeydown = e=>{ if(e.key==='Enter') submitPasswordModal(); };
  }
}

async function resetDataCore(){
  try{
    if(window.storage) await window.storage.delete(STORAGE_KEY, false);
  }catch(e){ /* nothing saved yet — fine */ }
  try{
    if(typeof localStorage !== 'undefined') localStorage.removeItem(STORAGE_KEY);
  }catch(e){ /* nothing saved yet — fine */ }
  state.combos = { add:{}, sub:{}, mul:{}, div:{} };
  state.records = { add:{}, sub:{}, mul:{}, div:{} };
  state.tips = JSON.parse(JSON.stringify(DEFAULT_TIPS));
  state.history = [];
  state.bestRank = {};
  state.weakFilter = 'all';
  state.course = { unlocked:1, completed:{} };
  state.levelProgress = {
    add: { unlocked:1, completed:{} },
    sub: { unlocked:1, completed:{} },
    mul: { unlocked:1, completed:{} },
    div: { unlocked:1, completed:{} },
  };
  state.expandedHistory = null;
  state.tab = 'setup';
  state.passwordModal = null;
  render();
}

const DEFAULT_PROFILE = { name:'', fatherName:'', city:'', state:'', country:'India', institute:'', photo:'' };
const TIER_COLOR = { Bronze:'#cd7f32', Silver:'#b8bcc4', Gold:'#e3a93b', Diamond:'#5fc8e8', Heroic:'#d9564c', Grandmaster:'#8e44ad' };
const RC_COL = { g:'#2f8a4f', a:'#c98a1b', r:'#b8372d' };

function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cleanLabel(s){
  return String(s||'').replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F\u200D]/gu,'').replace(/\s+/g,' ').trim();
}
function fmtDateLong(ts){
  const d = ts ? new Date(ts) : new Date();
  return d.toLocaleDateString('en-GB',{ day:'2-digit', month:'long', year:'numeric' });
}
function fmtDateShort(h){
  return h && h.ts ? new Date(h.ts).toLocaleDateString('en-IN',{ day:'2-digit', month:'short', year:'numeric' }) : 'Date not saved';
}
function currentReportEntry(){
  if(!state.history.length) return null;
  if(state.reportSel!=null){
    const f = state.history.find(x=>x.id===state.reportSel);
    if(f) return f;
  }
  return state.history[state.history.length-1];
}
function gradeOf(score){
  if(score>=90) return { g:'A+', word:'Outstanding' };
  if(score>=80) return { g:'A',  word:'Excellent' };
  if(score>=70) return { g:'B+', word:'Very Good' };
  if(score>=60) return { g:'B',  word:'Good' };
  if(score>=50) return { g:'C',  word:'Average' };
  if(score>=35) return { g:'D',  word:'Needs Practice' };
  return { g:'E', word:'Keep Going' };
}

function buildReport(h){
  const d = h.details || [];
  const times = d.map(x=>x.time);
  const ts = h.timeStats || (times.length ? statsOf(times) : null);
  const mult = TIER_MULT[Math.min(4, h.digitTier||1)] || 1;
  const target = (THRESH[h.op]||5) * mult;
  const qpm = h.totalTime>0 ? (h.total/h.totalTime)*60 : 0;
  const totalMistakes = d.reduce((s,x)=>s+(x.mistakes||0),0);
  let firstHalf = null, secondHalf = null;
  if(d.length>=4){
    const half = Math.floor(d.length/2);
    firstHalf = d.slice(0,half).reduce((s,x)=>s+x.time,0)/half;
    secondHalf = d.slice(half).reduce((s,x)=>s+x.time,0)/(d.length-half);
  }
  const fastest = d.length ? d.reduce((a,b)=>b.time<a.time?b:a) : null;
  const slowest = d.length ? d.reduce((a,b)=>b.time>a.time?b:a) : null;
  const slowList = d.filter(x=>x.time>target || (x.mistakes||0)>0).sort((a,b)=>b.time-a.time).slice(0,5);
  const underTarget = d.filter(x=>x.time<=target).length;
  const idx = state.history.findIndex(x=>x.id===h.id);
  let prev = null;
  for(let i=idx-1;i>=0;i--){ if(state.history[i].op===h.op){ prev = state.history[i]; break; } }
  const speedScore = Math.round(Math.max(0, 1 - Math.min(h.avgTime/target,2)/2)*100);
  return { d, ts, target, qpm, totalMistakes, firstHalf, secondHalf, fastest, slowest, slowList, underTarget, prev, speedScore, grade: gradeOf(h.rank.score) };
}

function lifetimeStats(){
  const H = state.history;
  const sessions = H.length;
  const totalQ = H.reduce((s,x)=>s+x.total,0);
  const avgAcc = sessions ? H.reduce((s,x)=>s+x.accuracy,0)/sessions : 0;
  const avgTime = sessions ? H.reduce((s,x)=>s+x.avgTime,0)/sessions : 0;
  const bests = Object.keys(state.bestRank||{}).map(op=>{
    const b = state.bestRank[op];
    return `${cleanLabel(OP_LABEL[op]||op)}: ${b.tier} ${b.sub} (${b.score})`;
  });
  return { sessions, totalQ, avgAcc, avgTime, bests };
}

function reportMetrics(h, r){
  const f = (x,n)=> (x==null||isNaN(x)) ? '—' : Number(x).toFixed(n==null?3:n);
  const ts = r.ts;
  const rows = [];
  rows.push({ k:'Accuracy (pehle try me sahi)', v:`${h.accuracy.toFixed(0)}%`, sub:`${h.correctCt} / ${h.total} sawaal bina galti ke`, pct:h.accuracy, c: h.accuracy>=90?'g':h.accuracy>=70?'a':'r' });
  rows.push({ k:'Average Speed', v:`${f(h.avgTime)}s`, sub:`Target ≤ ${r.target.toFixed(1)}s per sawaal · Speed score ${r.speedScore}/100`, pct:r.speedScore, c: h.avgTime<=r.target?'g':(h.avgTime<=r.target*1.5?'a':'r') });
  rows.push({ k:'Calculation Speed', v:`${r.qpm.toFixed(1)} / min`, sub:'Ek minute me kitne sawaal hal ho sakte hain' });
  rows.push({ k:'Total Time', v:`${f(h.totalTime,1)}s`, sub:`${h.total} sawaal` });
  if(ts){
    rows.push({ k:'Sabse Tez Sawaal', v:`${f(ts.min)}s`, sub: r.fastest ? r.fastest.text : '' });
    rows.push({ k:'Sabse Dheema Sawaal', v:`${f(ts.max)}s`, sub: r.slowest ? r.slowest.text : '' });
    rows.push({ k:'Median Time', v:`${f(ts.median)}s` });
    const cons = ts.stdDev<0.5 ? 'Bahut Stable' : ts.stdDev<1.2 ? 'Stable' : 'Utaar-Chadhaav';
    rows.push({ k:'Consistency', v:`±${f(ts.stdDev)}s`, sub:cons, c: ts.stdDev<0.5?'g':ts.stdDev<1.2?'a':'r' });
  }
  if(h.avgReaction!=null) rows.push({ k:'Avg Reaction Time', v:`${f(h.avgReaction)}s`, sub:'Pehli key dabane tak ka waqt' });
  rows.push({ k:'Best Speed Streak', v:`${h.bestStreak||0}`, sub:'Lagatar tez + sahi jawaab' });
  rows.push({ k:'Galat Try', v:`${r.totalMistakes}`, sub: r.totalMistakes===0 ? 'Ek bhi galti nahi!' : 'Kul galat attempts', c: r.totalMistakes===0?'g':(r.totalMistakes<=2?'a':'r') });
  rows.push({ k:'Target Time Ke Andar', v:`${r.underTarget} / ${h.total}`, sub:`≤ ${r.target.toFixed(1)}s me hal hue`, pct: h.total? (r.underTarget/h.total)*100 : 0, c: (r.underTarget/h.total)>=0.8?'g':(r.underTarget/h.total)>=0.5?'a':'r' });
  if(r.firstHalf!=null){
    const faster = r.secondHalf <= r.firstHalf;
    rows.push({ k:'Pace (Pehla vs Doosra Half)', v:`${f(r.firstHalf)}s → ${f(r.secondHalf)}s`, sub: faster ? '▲ Aakhir me speed badhi' : '▼ Aakhir me thakaan se speed ghati', c: faster?'g':'a' });
  }
  if(r.prev){
    const dT = h.avgTime - r.prev.avgTime, dA = h.accuracy - r.prev.accuracy;
    rows.push({ k:'Pichle Session Se Tulna', v: `${dT<=0?'▲':'▼'} ${Math.abs(dT).toFixed(3)}s`, sub:`Speed ${dT<=0?'tez':'dheemi'} · Accuracy ${dA>=0?'+':''}${dA.toFixed(0)}%`, c: dT<=0?'g':'r' });
  }
  return rows;
}

function remarkFor(h, r){
  const acc = h.accuracy, sp = r.speedScore;
  if(acc>=95 && sp>=70) return 'Shandaar! Speed aur accuracy dono top par hain — ab agle digit-level ya harder stage par jayein.';
  if(acc>=90 && sp<50)  return 'Accuracy bahut achhi hai, bas speed badhane par kaam karein — formulas aur tables dohraayein.';
  if(acc<70 && sp>=60)  return 'Speed tez hai par galtiyan zyada hain — thoda ruk kar sahi jawaab par dhyan dein.';
  if(acc<70)            return 'Pehle accuracy pakki karein, speed apne aap badhegi. Roz thodi practice karein.';
  return 'Achha prayas! Roz ki practice se score aur badhega.';
}

/* ---------- canvas helpers ---------- */
function loadImg(src){
  return new Promise(res=>{
    if(!src) return res(null);
    const im = new Image();
    im.onload = ()=>res(im); im.onerror = ()=>res(null); im.src = src;
  });
}
async function ensureFonts(){
  try{
    if(document.fonts && document.fonts.load){
      await Promise.race([
        Promise.all([
          document.fonts.load('700 40px "Fraunces"'), document.fonts.load('italic 600 40px "Fraunces"'),
          document.fonts.load('700 40px "Montserrat"'), document.fonts.load('500 40px "Montserrat"'),
          document.fonts.load('600 40px "Caveat"')
        ]),
        new Promise(r=>setTimeout(r,1500))
      ]);
    }
  }catch(e){}
}
function drawCover(ctx, img, x, y, w, h){
  const ir = img.width/img.height, r = w/h;
  let sx=0, sy=0, sw=img.width, sh=img.height;
  if(ir>r){ sw = img.height*r; sx = (img.width-sw)/2; } else { sh = img.width/r; sy = (img.height-sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(ctx, text, x, y, maxW, lh, maxLines){
  const words = String(text).split(/\s+/);
  let line = '', n = 0;
  for(let i=0;i<words.length;i++){
    const test = line ? line+' '+words[i] : words[i];
    if(ctx.measureText(test).width > maxW && line){
      n++;
      if(maxLines && n>=maxLines){ ctx.fillText(line+'…', x, y); return y+lh; }
      ctx.fillText(line, x, y); y += lh; line = words[i];
    } else { line = test; }
  }
  if(line){ ctx.fillText(line, x, y); y += lh; }
  return y;
}
function fitFont(ctx, text, fontTpl, startPx, minPx, maxW){
  let px = startPx;
  ctx.font = fontTpl.replace('{px}', px);
  while(ctx.measureText(text).width > maxW && px > minPx){ px -= 2; ctx.font = fontTpl.replace('{px}', px); }
  return px;
}
function drawSeal(ctx, cx, cy, r, color, tier, sub){
  ctx.save(); ctx.translate(cx, cy);
  const pts = 28;
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const ang = (Math.PI*i)/pts, rr = (i%2) ? r*0.88 : r;
    ctx.lineTo(Math.cos(ang)*rr, Math.sin(ang)*rr);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,r*0.74,0,Math.PI*2); ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle = '#1d2433'; ctx.textAlign = 'center';
  ctx.font = '700 22px Montserrat, sans-serif'; ctx.fillText('★', 0, -20);
  const t = String(tier).toUpperCase();
  fitFont(ctx, t, '800 {px}px Montserrat, sans-serif', 20, 11, r*1.3);
  ctx.fillText(t, 0, 8);
  ctx.font = '600 15px Montserrat, sans-serif'; ctx.fillText('LEVEL '+sub, 0, 30);
  ctx.restore();
}

    ctx.textAlign='right'; ctx.fillStyle = x.c ? RC_COL[x.c] : INK; ctx.font='800 28px Montserrat, sans-serif'; ctx.fillText(x.v, W-PAD, y);
    let cur = y + 4;
    if(x.pct!=null){
      const barTop = cur + 8;
      ctx.fillStyle='#e8e1cd'; roundRectPath(ctx,PAD,barTop,W-2*PAD,10,5); ctx.fill();
      ctx.fillStyle = RC_COL[x.c] || '#1f7a74'; roundRectPath(ctx,PAD,barTop,Math.max(12,(W-2*PAD)*Math.min(100,x.pct)/100),10,5); ctx.fill();
      cur = barTop + 14;
    }
    if(x.sub){
      cur += 26;
      ctx.textAlign='left'; ctx.fillStyle=MUTED; ctx.font='500 20px Montserrat, sans-serif';
      ctx.fillText(x.sub, PAD, cur, W-2*PAD);
      cur += 6;
    }
    ctx.strokeStyle='#eee6cf'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(PAD,cur+14); ctx.lineTo(W-PAD,cur+14); ctx.stroke();
    y = cur + 14 + 40;
  });
  y += 10;

  heading('Question-wise Report');
  ctx.fillStyle='#f4ecd6'; ctx.fillRect(PAD,y-30,W-2*PAD,44);
  ctx.fillStyle=INK; ctx.font='700 21px Montserrat, sans-serif';
  ctx.textAlign='left'; ctx.fillText('#', PAD+14, y); ctx.fillText('QUESTION', PAD+80, y);
  ctx.textAlign='right'; ctx.fillText('TIME', W-PAD-150, y); ctx.fillText('TRY', W-PAD-14, y);
  y += 44;
  const shown = r.d.slice(0, 60);
  shown.forEach((x,i)=>{
    if(x.mistakes){ ctx.fillStyle='#fbe9e6'; ctx.fillRect(PAD,y-30,W-2*PAD,42); }
    else if(i%2){ ctx.fillStyle='#faf5e6'; ctx.fillRect(PAD,y-30,W-2*PAD,42); }
    ctx.fillStyle=INK; ctx.font='500 24px Consolas, "Courier New", monospace';
    ctx.textAlign='left'; ctx.fillText(String(i+1), PAD+14, y); ctx.fillText(x.text, PAD+80, y, W-2*PAD-330);
    ctx.textAlign='right'; ctx.fillText(x.time.toFixed(2)+'s', W-PAD-150, y);
    ctx.fillStyle = x.mistakes ? RC_COL.r : RC_COL.g; ctx.fillText(x.mistakes ? ('✗ '+x.mistakes) : '✓', W-PAD-14, y);
    y += 42;
  });
  if(r.d.length > shown.length){
    ctx.textAlign='left'; ctx.fillStyle=MUTED; ctx.font='500 21px Montserrat, sans-serif';
    ctx.fillText(`… aur ${r.d.length-shown.length} sawaal`, PAD+14, y); y += 36;
  }
  y += 24;

  if(r.slowList.length){
    heading('Focus Areas');
    ctx.textAlign='left'; ctx.fillStyle=INK; ctx.font='500 25px Montserrat, sans-serif';
    r.slowList.forEach(x=>{
      ctx.fillText(`•  ${x.text}  —  ${x.time.toFixed(2)}s${x.mistakes?`  ·  ${x.mistakes} galat try`:''}`, PAD+10, y, W-2*PAD-20);
      y += 40;
    });
    y += 20;
  }

  heading('Overall (Ab Tak)');
  ctx.textAlign='left'; ctx.fillStyle=INK; ctx.font='500 25px Montserrat, sans-serif';
  y = wrapText(ctx, `${life.sessions} session${life.sessions===1?'':'s'} · ${life.totalQ} questions · avg accuracy ${life.avgAcc.toFixed(0)}% · avg speed ${life.avgTime.toFixed(2)}s`, PAD, y, W-2*PAD, 36, 2);
  if(life.bests.length){
    ctx.fillStyle=MUTED; ctx.font='500 22px Montserrat, sans-serif';
    y = wrapText(ctx, 'Best Rank — '+life.bests.join(' | '), PAD, y+4, W-2*PAD, 32, 4);
  }
  y += 24;

  // remark
  ctx.font = 'italic 500 26px Montserrat, sans-serif';
  const remark = remarkFor(h, r);
  ctx.fillStyle = '#eef6f1';
  const remStart = y;
  // measure height
  const tmp = document.createElement('canvas').getContext('2d'); tmp.font = ctx.font;
  let lines = 1, line = '';
  remark.split(/\s+/).forEach(w=>{ const t=line?line+' '+w:w; if(tmp.measureText(t).width > W-2*PAD-50 && line){ lines++; line=w; } else line=t; });
  const remH = lines*38 + 36;
  roundRectPath(ctx, PAD, remStart, W-2*PAD, remH, 10); ctx.fill();
  ctx.fillStyle = '#2f8a4f'; ctx.fillRect(PAD, remStart, 8, remH);
  ctx.fillStyle = INK; ctx.textAlign='left';
  wrapText(ctx, remark, PAD+28, remStart+46, W-2*PAD-50, 38);
  y += remH + 50;

  // footer
  ctx.textAlign='left'; ctx.fillStyle=MUTED; ctx.font='500 21px Montserrat, sans-serif';
  ctx.fillText('Date: '+(h.ts?fmtDateLong(h.ts):fmtDateLong()), PAD, y+30);
  ctx.fillText('Report No: GA-'+String(h.id).padStart(3,'0'), PAD, y+60);
  ctx.textAlign='center'; ctx.fillStyle=INK; ctx.font='600 56px Caveat, cursive'; ctx.fillText('Ganit Abhyaas', W-PAD-175, y+40);
  ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(W-PAD-300,y+54); ctx.lineTo(W-PAD,y+54); ctx.stroke();
  ctx.fillStyle=MUTED; ctx.font='600 16px Montserrat, sans-serif'; ctx.fillText('AUTHORISED', W-PAD-150, y+78);
  y += 120;

  const out = document.createElement('canvas'); out.width = W; out.height = y;
  const o = out.getContext('2d'); o.drawImage(c,0,0,W,y,0,0,W,y);
  o.strokeStyle = GOLD; o.lineWidth = 8; o.strokeRect(4,4,W-8,y-8);
  return out;
}

/* ---------- download / share / print ---------- */
function downloadCanvas(canvas, filename){
  canvas.toBlob(blob=>{
    if(!blob){ alert('Image banane me dikkat aayi.'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}
function shareCanvas(canvas, filename, title){
  canvas.toBlob(async blob=>{
    if(!blob) return;
    try{
      const file = new File([blob], filename, { type:'image/png' });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title });
        return;
      }
    }catch(e){ if(e && e.name==='AbortError') return; }
    downloadCanvas(canvas, filename); // share not supported → plain download
  }, 'image/png');
}
function printFragment(html){
  let root = document.getElementById('printRoot');
  if(!root){ root = document.createElement('div'); root.id = 'printRoot'; document.body.appendChild(root); }
  root.innerHTML = html;
  document.body.classList.add('printing');
  const done = ()=>{ document.body.classList.remove('printing'); root.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(()=>{ try{ window.print(); }catch(e){ done(); alert('Is device par Print available nahi hai — PNG download use karein.'); } }, 80);
}
function readProfilePhoto(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const im = new Image();
      im.onload = ()=>{
        const W = 360, H = 450; // 4:5 portrait, small enough to keep in local storage
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
        drawCover(ctx, im, 0, 0, W, H);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      im.onerror = reject; im.src = fr.result;
    };
    fr.onerror = reject; fr.readAsDataURL(file);
  });
}

function onlineConfigured(){ return !!(ONLINE_CONFIG.url && ONLINE_CONFIG.anonKey); }

function liveHeaders(extra){
  return Object.assign({ 'apikey':ONLINE_CONFIG.anonKey, 'Authorization':'Bearer '+ONLINE_CONFIG.anonKey, 'Content-Type':'application/json' }, extra||{});

function fetchTimeout(url, opts, ms){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), ms||12000);
  return fetch(url, Object.assign({ signal:ctl.signal }, opts)).finally(()=>clearTimeout(t));
}
async function liveRpc(fn, body){
  const res = await fetchTimeout(`${liveBase()}/rest/v1/rpc/${fn}`, { method:'POST', headers:liveHeaders(), body:JSON.stringify(body) });
  if(!res.ok) throw new Error('Server error '+res.status);
  const txt = await res.text();
  return txt ? JSON.parse(txt) : [];
}
function liveErrText(e){
  if(e && e.name==='AbortError') return 'Server jawaab nahi de raha (timeout). Thodi der baad dobara try karein.';
  if(e instanceof TypeError) return 'Internet nahi hai ya server tak nahi pahunch paaye.';
  return (e && e.message) ? e.message : 'Kuch gadbad hui.';
}
function ensureOnlineUid(){
  const o = state.online;
  if(!o.uid){
    o.uid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);
  }
  return o.uid;
}
function liveRowFromHistory(h){
  const p = state.profile;
  const city = [p.city, p.state].filter(x=>x&&x.trim()).map(x=>x.trim()).join(', ');
  return {
    user_id: state.online.uid,

    name: (p.name||'').trim().slice(0,40),
    city: city.slice(0,40),

    score: Math.max(0, Math.min(100, Math.round(h.rank.score))),
    accuracy: Math.round(h.accuracy*10)/10,
    avg_time: Math.round(h.avgTime*1000)/1000,

}
function liveRowValid(r){
  return !!(r.user_id && r.client_ts && r.name && r.total>=3 && r.total<=100 && r.avg_time>=0.15 && r.accuracy>=0 && r.accuracy<=100);
}
function queueLiveRow(h){
  const o = state.online;
  if(!h || !h.ts || !o.uid) return;
  if(o.pending.some(r=>r.client_ts===h.ts)) return;
  const row = liveRowFromHistory(h);
  if(liveRowValid(row)) o.pending.push(row);
}
async function syncOnline(){
  const o = state.online;
  if(!onlineConfigured() || !o.joined || liveSyncing || !o.pending.length) return;
  liveSyncing = true;
  try{
    while(o.pending.length){
      const batch = o.pending.slice(0,50);
      const res = await fetchTimeout(`${liveBase()}/rest/v1/rpc/ga_submit`, {
        method:'POST',
        headers: liveHeaders(),
        body: JSON.stringify({ p_rows: batch }),
      });
      if(res.ok){ o.pending = o.pending.slice(batch.length); o.lastError = ''; }
      else if(res.status===400 || res.status===409 || res.status===422){
        o.pending = o.pending.slice(batch.length); // invalid rows would block the queue forever — drop them
        o.lastError = 'Kuch sessions server ne reject kiye ('+res.status+').';
      } else { o.lastError = 'Server error '+res.status; break; }
    }
  }catch(e){ o.lastError = liveErrText(e); }
  liveSyncing = false;
  saveStateNow();
}
function onlineAfterSession(){
  if(!onlineConfigured() || !state.online.joined) return;
  queueLiveRow(state.history[state.history.length-1]);
  syncOnline();
}
function liveThumb(src){
  return new Promise(res=>{
    if(!src) return res('');
    const im = new Image();
    im.onload = ()=>{ try{
      const c = document.createElement('canvas'); c.width = c.height = 72;
      const sq = Math.min(im.width, im.height);
      c.getContext('2d').drawImage(im, (im.width-sq)/2, (im.height-sq)/2, sq, sq, 0, 0, 72, 72);
      res(c.toDataURL('image/jpeg', 0.7));
    }catch(e){ res(null); } };
    im.onerror = ()=>res(null);
    im.src = src;
  });
}
async function syncPhoto(){
  const o = state.online;

  const t = await liveThumb(state.profile.photo);
  if(t===null || t===(o.photoSent||'')) return;
  try{ await liveRpc('ga_set_photo', { p_user:o.uid, p_photo:t }); o.photoSent = t; saveStateNow(); }catch(e){}
}
async function loadLive(force){
  if(!onlineConfigured() || state.liveLoading) return;
  const period = state.liveSettings.period, metric = state.liveSettings.metric, key = period+'_'+metric;
  if(!force && Date.now() - (state.liveFetched[key]||0) < 60000) return;
  state.liveLoading = true; state.liveError = ''; state.liveFetched[key] = Date.now();
  if(state.tab==='live' && !state.session) render();
  try{
    await syncOnline();
    await syncPhoto();
    const o = state.online;
    const [top, me] = await Promise.all([
      liveRpc('ga_leaderboard', { p_period:period, p_limit:50, p_user:o.uid||null, p_metric:metric }),
      (o.joined && o.uid) ? liveRpc('ga_my_rank', { p_period:period, p_user:o.uid, p_metric:metric }) : Promise.resolve([]),
    ]);
    state.liveData[key] = { top:top||[], me:(me&&me[0])||null, at:Date.now() };
  }catch(e){ state.liveError = liveErrText(e); }
  state.liveLoading = false;
  if(state.tab==='live' && !state.session) render();
}

  const vlab = metric==='score' ? 'avg' : 'pts';
  const d = state.liveData[period+'_'+metric];
  const medal = r => r===1?'🥇':r===2?'🥈':r===3?'🥉':('#'+r);
  const rowHtml = r => `
    <div class="lb-row ${r.is_me?'me':''}">
      <div class="lb-rank">${medal(Number(r.rank))}</div>
      <div class="lb-av">${r.photo?`<img src="${escHtml(r.photo)}" alt="">`:escHtml((r.name||'?').charAt(0).toUpperCase())}</div>
      <div class="lb-main">
        <div class="lb-name">${escHtml(r.name)}${r.is_me?' <span class="lb-you">(Aap)</span>':''}</div>
        <div class="lb-sub">${r.city?escHtml(r.city)+' · ':''}${Number(r.sessions)} session${Number(r.sessions)===1?'':'s'} · ${Number(r.avg_accuracy).toFixed(0)}% accuracy</div>
      </div>
      <div class="lb-pts num">${val(r)}<span>${vlab}</span></div>
    </div>`;
  let listHtml;
  if(state.liveLoading && !d) listHtml = `<p class="empty-msg">Ranking load ho rahi hai…</p>`;
  else if(d && d.top.length) listHtml = d.top.map(rowHtml).join('');
  else if(d) listHtml = `<p class="empty-msg">Is period me abhi kisi ne practice nahi ki — pehle aap bano! 💪</p>`;
  else listHtml = '';
  const meOutside = d && d.me && !d.top.some(r=>r.is_me);
  const meCard = (o.joined && d && d.me)
    ? `<div class="lb-mecard">Aapka Rank: <b>#${Number(d.me.rank)}</b> · <b>${val(d.me)}</b> ${vlab} · ${Number(d.me.sessions)} sessions</div>`
    : (o.joined && d ? `<div class="lb-mecard">Is period me aapka abhi koi score nahi — ek practice karein!</div>` : '');

  const joinCard = o.joined ? `
    <div class="card">
      <h2>✅ Aap Ranking Me Hain</h2>
      <p class="hint">Naam: <b>${escHtml((state.profile.name||'').trim())}</b>${state.profile.city?` · ${escHtml(state.profile.city)}`:''}. Har practice session ke baad score apne aap judta hai.${o.pending.length?` <b>${o.pending.length}</b> session internet aate hi bheje jaayenge.`:''}</p>
      ${o.lastError?`<p class="pw-error">${escHtml(o.lastError)}</p>`:''}
      <button class="btn secondary" id="liveLeaveBtn">Ranking Se Bahar Niklein (data delete)</button>
    </div>` : `
    <div class="card">
      <h2>🚀 Ranking Me Judein</h2>
      ${(state.profile.name||'').trim() ? '' : `<p class="pw-error">Pehle profile me apna naam bharein.</p><button class="btn teal" id="liveGoProfileBtn">🪪 Profile Bharein</button>`}
      <label class="check-row"><input type="checkbox" id="liveConsent"> Main manta/manti hoon ki ranking me mera <b>naam, city aur profile photo</b> sabko dikhegi. Meri report card aur baaki jaankari online nahi jaayegi.</label>
      <button class="btn" id="liveJoinBtn" ${(state.profile.name||'').trim()?'':'disabled'}>Ranking Join Karein</button>
      <p class="hint">Kabhi bhi bahar nikal sakte hain — tab server se aapka saara score delete ho jaata hai.</p>
    </div>`;

  return `
  <div class="card">
    <h2>🏆 Live Ranking <button class="btn secondary" id="liveRefreshBtn" style="margin:0;padding:6px 12px;font-size:0.8rem;">🔄 Refresh</button></h2>
    <div class="chip-row" style="margin-top:6px;">${chips}</div>
    <div class="chip-row" style="margin-top:4px;">${mchips}</div>
    <p class="hint" style="margin-top:0;">${P.note}.</p>
    ${state.liveError?`<p class="pw-error">${escHtml(state.liveError)}</p>`:''}
    ${meCard}
    ${listHtml}
    ${meOutside?`<div class="lb-dots">⋮</div>${rowHtml(Object.assign({is_me:true}, d.me))}`:''}
    <p class="hint">📈 Progress = is period ka average score (kam se kam 3 sessions chahiye) — tez aur sahi practice wale upar.</p>
    <p class="hint">⭐ Points = Score × sawaal (max 20) ÷ 10 × difficulty (1-digit ×1 · 2-digit ×1.7 · 3-digit ×2.4 · 4-digit ×3.2). Zyada practice + tez + sahi = zyada points.</p>
  </div>
  ${joinCard}`;
}

function bindLiveEvents(){
  document.querySelectorAll('[data-liveperiod]').forEach(b=>{
    b.onclick = ()=>{ state.liveSettings.period = b.dataset.liveperiod; render(); };
  });
  document.querySelectorAll('[data-livemetric]').forEach(b=>{
    b.onclick = ()=>{ state.liveSettings.metric = b.dataset.livemetric; render(); };
  });
  const rf = document.getElementById('liveRefreshBtn');
  if(rf) rf.onclick = ()=> loadLive(true);
  const gp = document.getElementById('liveGoProfileBtn');
  if(gp) gp.onclick = ()=>{ state.tab = 'certificate'; render(); window.scrollTo(0,0); };
  const jb = document.getElementById('liveJoinBtn');
  if(jb) jb.onclick = ()=>{
    const chk = document.getElementById('liveConsent');
    if(!chk || !chk.checked){ alert('Pehle sahmati wale box par tick karein.'); return; }
    if(!(state.profile.name||'').trim()) return;
    const o = state.online;
    ensureOnlineUid(); o.joined = true; o.lastError = '';
    state.history.forEach(h=> queueLiveRow(h)); // purani (date-wali) history bhi lifetime me judegi
    saveStateNow();
    syncOnline().then(()=> loadLive(true));
    render();
  };
  const lb = document.getElementById('liveLeaveBtn');
  if(lb) lb.onclick = async ()=>{
    if(!confirm('Ranking se bahar niklein? Server se aapka saara online score delete ho jaayega.')) return;
    const o = state.online;
    try{ await liveRpc('ga_delete_me', { p_user:o.uid }); }
    catch(e){ alert('Server se data delete nahi ho paaya ('+liveErrText(e)+'). Dobara try karein.'); return; }
    o.joined = false; o.pending = []; o.uid = ''; o.photoSent = ''; o.lastError = '';
    state.liveData = {}; state.liveFetched = {};
    saveStateNow(); render();
  };
  loadLive(false);
}

    const q = sess.questions[sess.index];

      };
      const checkValue = ()=>{
        const val = (sess.typedValue||'').trim();
        const el = document.getElementById('answerDisplay');
        if(sess.firstKeyAt==null && val!==''){ sess.firstKeyAt = performance.now(); }
        if(val===''){ if(el) el.classList.remove('wrong'); renderAnswerDisplay(); return; }
        if(Number(val) === q.answer){
          if(el) el.classList.remove('wrong');
          submitAnswer(val); // correct -> auto moves to next question
          return;
        }
        const typedDigits = val.replace('-','').length;
        if(typedDigits >= ansDigits){
          if(el) el.classList.add('wrong');

          const liveEl = document.getElementById('liveAccMeter');
          if(liveEl){
            const c = sess.liveCorrect||0, w = sess.liveWrong||0, t = c+w;
            const acc = t>0 ? (c/t)*100 : 100;
            liveEl.style.color = acc>=90 ? 'var(--green)' : acc>=70 ? 'var(--amber)' : 'var(--red)';
            liveEl.style.display = '';
            liveEl.textContent = `🎯 Live Accuracy: ${acc.toFixed(0)}% (${c} sahi / ${w} galat)`;
          }
          renderAnswerDisplay();
          setTimeout(()=>{
            if(state.session === sess){
              sess.typedValue = '';
              const el2 = document.getElementById('answerDisplay');
              if(el2) el2.classList.remove('wrong');
              renderAnswerDisplay();
            }
          }, 400);
        } else {
          if(el) el.classList.remove('wrong');
          renderAnswerDisplay();
        }
      };
      const keypadPress = (key)=>{
        vibe(12); // light tap feel (only if Vibration is ON)
        if(key==='back'){ sess.typedValue = (sess.typedValue||'').slice(0,-1); }
        else if(key==='clear'){ sess.typedValue = ''; }
        else if(key==='enter'){ checkValue(); return; }
        else if(key==='.'){ if((sess.typedValue||'').includes('.')) return; sess.typedValue = (sess.typedValue||'') + '.'; }
        else { sess.typedValue = (sess.typedValue||'') + key; }
        checkValue();
      };
      document.querySelectorAll('#keypad .keypad-btn').forEach(btn=>{
        btn.addEventListener('pointerdown', e=>{ e.preventDefault(); keypadPress(btn.dataset.key); });
        btn.onclick = e=> e.preventDefault(); // click already handled on pointerdown
      });
      const enterBtn = document.getElementById('keypadEnter');
      if(enterBtn){ enterBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); keypadPress('enter'); }); enterBtn.onclick = e=> e.preventDefault(); }

      // Physical keyboard also works in keypad mode, without ever focusing a real text input
      const keydownHandler = e=>{
        if(!state.session || state.session!==sess){ document.removeEventListener('keydown', keydownHandler); return; }
        if(e.key>='0' && e.key<='9') keypadPress(e.key);
        else if(e.key==='.') keypadPress('.');
        else if(e.key==='Backspace') keypadPress('back');
        else if(e.key==='Enter') keypadPress('enter');
        else return;
        e.preventDefault();
      };
      if(practiceKeydownHandler) document.removeEventListener('keydown', practiceKeydownHandler);
      practiceKeydownHandler = keydownHandler;
      document.addEventListener('keydown', practiceKeydownHandler);
    } else {
      if(practiceKeydownHandler){ document.removeEventListener('keydown', practiceKeydownHandler); practiceKeydownHandler = null; }
      const input = document.getElementById('answerInput');
      if(input){
        input.focus();
        const checkValue = ()=>{
          const val = input.value.trim();
          if(sess.firstKeyAt==null && val!==''){ sess.firstKeyAt = performance.now(); }
          if(val===''){ input.classList.remove('wrong'); return; }
          if(Number(val) === q.answer){
            input.classList.remove('wrong');
            submitAnswer(val); // correct -> auto moves to next question
            return;
          }
          const typedDigits = val.replace('-','').length;
          if(typedDigits >= ansDigits){
            input.classList.add('wrong');
            sess.liveWrong = (sess.liveWrong||0) + 1; vibe([70,45,70]); // accuracy meter dips right away on a wrong answer
            sess.mistakes = (sess.mistakes||0) + 1; // real fix: this question can no longer count as firstTry, so session/history/overview accuracy actually drops too
            const liveEl = document.getElementById('liveAccMeter');
            if(liveEl){
              const c = sess.liveCorrect||0, w = sess.liveWrong||0, t = c+w;
              const acc = t>0 ? (c/t)*100 : 100;
              liveEl.style.color = acc>=90 ? 'var(--green)' : acc>=70 ? 'var(--amber)' : 'var(--red)';
              liveEl.style.display = '';
              liveEl.textContent = `🎯 Live Accuracy: ${acc.toFixed(0)}% (${c} sahi / ${w} galat)`;
            }
            setTimeout(()=>{
              if(document.body.contains(input)){
                input.value = '';
                input.classList.remove('wrong');
                input.focus();
              }
            }, 400);
          } else {
            input.classList.remove('wrong');
          }
        };
        input.oninput = checkValue;
        input.onkeydown = e=>{ if(e.key==='Enter') checkValue(); };
      }
    }

    if(practiceTickHandle) clearInterval(practiceTickHandle);
    const swEl = document.getElementById('stopwatch');
    if(swEl){
      const fastLimit = THRESH[state.settings.op] || 5;
      practiceTickHandle = setInterval(()=>{
        if(!state.session || !document.body.contains(swEl)){ clearInterval(practiceTickHandle); return; }
        const elapsed = (performance.now() - state.session.qStart)/1000;
        const pfTxt = document.getElementById('pfTimeText');
        if(pfTxt){
          const tsec = Math.floor(elapsed);
          const txt = String(Math.floor(tsec/60)).padStart(2,'0') + ':' + String(tsec%60).padStart(2,'0');
          if(pfTxt.textContent !== txt) pfTxt.textContent = txt; // only touch the DOM when the shown second changes
        } else {
          swEl.textContent = formatPulse(elapsed);
        }
        const isSlow = elapsed > fastLimit;
        if(swEl.classList.contains('slow') !== isSlow) swEl.classList.toggle('slow', isSlow);
      }, swEl.querySelector('#pfTimeText') ? 100 : 10); // display tick only; real solve time is taken from performance.now()
    }

    const quitBtn = document.getElementById('quitPracticeBtn');
    if(quitBtn) quitBtn.onclick = quitPractice;
  }
  if(state.tab==='tips'){
    document.getElementById('addTipBtn').onclick = ()=>{
      const op = document.getElementById('tipOp').value;
      const text = document.getElementById('tipText').value.trim();
      if(text){ state.tips[op].push(text); render(); }
    };
    document.querySelectorAll('.delTip').forEach(btn=>{
      btn.onclick = ()=>{
        const op = btn.dataset.op, idx = Number(btn.dataset.idx);
        state.tips[op].splice(idx,1);
        render();
      };
    });
  }
  if(state.tab==='history'){
    document.querySelectorAll('.hist-toggle').forEach(btn=>{
      btn.onclick = ()=>{
        const id = Number(btn.dataset.id);
        state.expandedHistory = state.expandedHistory === id ? null : id;
        render();
      };
    });
  }
  if(state.tab==='weak'){
    const gm = document.getElementById('goMasterBtn');
    if(gm) gm.onclick = ()=>{ state.courseLevel = null; state.activeLevelRun = null; startPractice(true, state.weakFilter); };
    document.querySelectorAll('.chip-btn').forEach(btn=>{
      btn.onclick = ()=>{ state.weakFilter = btn.dataset.filter; render(); };
    });
  }
  if(state.tab==='progress'){
    document.querySelectorAll('[data-progfilter]').forEach(btn=>{
      btn.onclick = ()=>{ state.progressDigitFilter = btn.dataset.progfilter; render(); };
    });
  }
  if(state.tab==='leaderboard'){
    document.querySelectorAll('[data-leaderop]').forEach(btn=>{
      btn.onclick = ()=>{ state.leaderOpFilter = btn.dataset.leaderop; render(); };
    });
    document.querySelectorAll('[data-leadertier]').forEach(btn=>{
      btn.onclick = ()=>{ state.leaderTierFilter = btn.dataset.leadertier; render(); };
    });
  }
  const goCert = document.getElementById('goCertBtn');
  if(goCert) goCert.onclick = ()=>{ state.reportSel = null; state.tab = 'certificate'; render(); window.scrollTo(0,0); };
  document.querySelectorAll('.hist-report-btn').forEach(btn=>{
    btn.onclick = ()=>{ state.reportSel = Number(btn.dataset.id); state.tab = 'certificate'; render(); window.scrollTo(0,0); };
  });
  const home1 = document.getElementById('homeBtn');
  if(home1) home1.onclick = ()=>{ state.tab='setup'; render(); };
  const home2 = document.getElementById('homeBtn2');
  if(home2) home2.onclick = ()=>{ state.tab='setup'; render(); };
  const nextLevelBtn = document.getElementById('nextLevelBtn');
  if(nextLevelBtn) nextLevelBtn.onclick = ()=> startCourseLevel(Number(nextLevelBtn.dataset.level));
  const retryLevelBtn = document.getElementById('retryLevelBtn');
  if(retryLevelBtn) retryLevelBtn.onclick = ()=> startCourseLevel(Number(retryLevelBtn.dataset.level));
  const backCourseBtn = document.getElementById('backCourseBtn');
  if(backCourseBtn) backCourseBtn.onclick = ()=>{ state.tab='course'; render(); };
  const nextLevelTrackBtn = document.getElementById('nextLevelTrackBtn');
  if(nextLevelTrackBtn) nextLevelTrackBtn.onclick = ()=> startLevelTrack(nextLevelTrackBtn.dataset.op, Number(nextLevelTrackBtn.dataset.level));
  const retryLevelTrackBtn = document.getElementById('retryLevelTrackBtn');
  if(retryLevelTrackBtn) retryLevelTrackBtn.onclick = ()=> startLevelTrack(retryLevelTrackBtn.dataset.op, Number(retryLevelTrackBtn.dataset.level));
  const backLevelsBtn = document.getElementById('backLevelsBtn');
  if(backLevelsBtn) backLevelsBtn.onclick = ()=>{ state.tab='levels'; render(); };
}

function bindThemeSwitcher(){
  const dots = document.querySelectorAll('.theme-dot');
  const apply = ()=>{
    document.body.dataset.theme = state.theme;
    dots.forEach(d=> d.classList.toggle('active', d.dataset.theme===state.theme));
  };
  dots.forEach(d=>{
    d.onclick = ()=>{ state.theme = d.dataset.theme; apply(); };
  });
  apply();
}

function bindSplash(){
  const splash = document.getElementById('splashScreen');
  const toggle = document.getElementById('splashToggle');
  if(!splash || !toggle) return;
  document.body.style.overflow = 'hidden';
  toggle.onclick = ()=>{
    if(toggle.classList.contains('on')) return;
    toggle.classList.add('on');
    toggle.setAttribute('aria-checked','true');
    setTimeout(()=>{
      splash.classList.add('closing');
      document.body.style.overflow = '';
      setTimeout(()=> splash.remove(), 450);
    }, 320);
  };
}

(async function boot(){
  await loadState();
  render();
  bindThemeSwitcher();
  bindSplash();
  syncOnline(); // flush any scores waiting from an offline session
})();

// Voices ki list kai browsers me thodi der baad async load hoti hai — jab load ho jaaye
// aur user Customize screen par ho, to voice dropdown ko taaza values se dobara render karein.
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=>{
    if(state.tab==='customize') render();
  };
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
