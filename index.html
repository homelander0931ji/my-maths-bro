function viewWeak(){
  const allWeak = getWeakList();
  const filter = state.weakFilter;
  const opsToShow = filter==='all' ? ['add','sub','mul','div'] : [filter];

  const filterBtns = ['all','add','sub','mul','div'].map(f=>{
    const label = f==='all' ? 'Sab' : OP_LABEL[f].split(' ')[0];
    return `<button data-filter="${f}" class="chip-btn ${filter===f?'active':''}">${label}</button>`;
  }).join('');

  const groups = opsToShow.map(op=>{
    const items = allWeak.filter(w=>w.op===op);
    if(items.length===0){
      return filter==='all' ? '' : `<div class="tip-group"><h3>${OP_LABEL[op]}</h3><p class="empty-msg">Is operation me abhi koi kamzor combination nahi hai.</p></div>`;
    }
    const tierBlocks = [1,2,3].map(tier=>{
      const tierItems = items.filter(w=>w.tier===tier);
      if(tierItems.length===0) return '';
      const chips = tierItems
        .sort((a,b)=>b.avg-a.avg)
        .map(w=>{
          const text = op==='div' ? `${w.a*w.b}÷${w.a}` : `${w.a}${OP_SYMBOL[op]}${w.b}`;
          return `<span class="combo-chip">${text} · avg ${w.avg.toFixed(1)}s</span>`;
        }).join('');
      return `<div class="tier-sub"><h4>${TIER_LABEL[tier]}</h4><div>${chips}</div></div>`;
    }).join('');
    return `<div class="tip-group"><h3>${OP_LABEL[op]} <span class="hint">(${items.length})</span></h3>${tierBlocks}</div>`;
  }).join('');

  const filteredCount = filter==='all' ? allWeak.length : allWeak.filter(w=>w.op===filter).length;

  return `
  <div class="card">
    <h2>Kamzor Combinations</h2>
    <p class="hint">Jo combination limit time se zyada le, wo yahan record hoti hai — 1, 2 aur 3-digit alag dikhte hain. Lagatar 3 baar tez solve karne par combination apne aap hat jaati hai.</p>
    <div class="chip-row">${filterBtns}</div>
    ${filteredCount ? groups : '<p class="empty-msg">Is filter me abhi koi kamzor combination record nahi hai — badhiya!</p>'}
    <button class="btn teal" id="goMasterBtn" ${allWeak.length===0?'disabled':''}>Master Practice Shuru Karein${filter!=='all' && filteredCount ? ' ('+OP_LABEL[filter]+')' : ''}</button>
  </div>`;
}

function viewLeaderboard(){
  const opsWithRecords = ['add','sub','mul','div'].filter(op => Object.keys(state.records[op]).length>0);
  if(opsWithRecords.length===0){
    return `<div class="card"><p class="empty-msg">Abhi tak koi calculation record nahi hai — pehle practice karein, har sawaal yahan record hoga.</p></div>`;
  }
  const op = opsWithRecords.includes(state.leaderOpFilter) ? state.leaderOpFilter : opsWithRecords[0];
  state.leaderOpFilter = op;

  const opBtns = opsWithRecords.map(o=>
    `<button data-leaderop="${o}" class="chip-btn ${op===o?'active':''}">${OP_LABEL[o].split(' ')[0]}</button>`
  ).join('');
  const tierFilter = state.leaderTierFilter;
  const tierBtns = ['all','1','2','3'].map(t=>{
    const label = t==='all' ? 'Sab' : `${t}-Digit`;
    return `<button data-leadertier="${t}" class="chip-btn ${tierFilter===t?'active':''}">${label}</button>`;
  }).join('');

  const entries = Object.values(state.records[op])
    .filter(r => tierFilter==='all' || String(r.tier)===tierFilter);

  const tiersToShow = tierFilter==='all' ? [1,2,3] : [Number(tierFilter)];
  const blocks = tiersToShow.map(tier=>{
    const items = entries.filter(e=>e.tier===tier).sort((a,b)=>a.best-b.best);
    if(items.length===0) return '';
    const rows = items.map((e,i)=>{
      const text = op==='div' ? `${e.a*e.b} ÷ ${e.a}` : `${e.a} ${OP_SYMBOL[op]} ${e.b}`;
      const medal = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : `#${i+1}`;
      return `
      <div class="hist-row">
        <div class="hist-main">
          <span class="hist-op num">${medal} ${text}</span>
          <span class="hist-time-tag num">${formatPulse(e.best)}</span>
        </div>
        <div class="hist-stats">
          <span>Best: ${e.best.toFixed(3)}s</span>
          <span>Attempts: ${e.attempts}</span>
          <span>Last: ${e.lastTime.toFixed(3)}s</span>
        </div>
      </div>`;
    }).join('');
    return `<div class="tip-group"><h3>${TIER_LABEL[tier]} <span class="hint">(${items.length} calculations)</span></h3>${rows}</div>`;
  }).join('');

  return `
  <div class="card">
    <h2>📊 Calculation Leaderboard</h2>
    <p class="hint">Har sawaal jo aapne solve kiya uska sabse tez (best) time yahan record hota hai — 1-digit, 2-digit aur 3-digit alag track hote hain.</p>
    <div class="chip-row">${opBtns}</div>
    <div class="chip-row">${tierBtns}</div>
    ${blocks || '<p class="empty-msg">Is filter me abhi koi record nahi hai.</p>'}
  </div>`;
}

/* ================= PASSWORD-PROTECTED DATA RESET ================= */
function openResetPasswordFlow(){
  state.passwordModal = state.security.password
    ? { mode:'verify', purpose:'reset', pass1:'', pass2:'', old:'', error:'' }
    : { mode:'create', purpose:'reset', pass1:'', pass2:'', old:'', error:'' };
  render();
}

function openChangePasswordFlow(){
  state.passwordModal = state.security.password
    ? { mode:'change-verify', purpose:'change', pass1:'', pass2:'', old:'', error:'' }
    : { mode:'create', purpose:'change', pass1:'', pass2:'', old:'', error:'' };
  render();
}

function closePasswordModal(){
  state.passwordModal = null;
  render();
}

async function submitPasswordModal(){
  const m = state.passwordModal;
  if(!m) return;

  if(m.mode === 'create'){
    const p1 = (m.pass1||'').trim();
    const p2 = (m.pass2||'').trim();
    if(p1.length < 4){ m.error = 'Password kam se kam 4 characters ka hona chahiye.'; renderPasswordModal(); return; }
    if(p1 !== p2){ m.error = 'Dono password match nahi kar rahe.'; renderPasswordModal(); return; }
    state.security.password = p1;
    if(m.purpose === 'reset'){
      await resetDataCore();
    } else {
      state.passwordModal = null;
      render();
    }
    return;
  }

  if(m.mode === 'verify'){
    if((m.pass1||'') !== state.security.password){
      m.error = 'Galat password. Dobara try karein.';
      m.pass1 = '';
      renderPasswordModal();
      return;
    }
    await resetDataCore();
    return;
  }

  if(m.mode === 'change-verify'){
    if((m.old||'') !== state.security.password){
      m.error = 'Purana password galat hai.';
      m.old = '';
      renderPasswordModal();
      return;
    }
    state.passwordModal = { mode:'create', purpose:'change', pass1:'', pass2:'', old:'', error:'' };
    render();
    return;
  }
}

function renderPasswordModal(){
  const root = document.getElementById('pwModalRoot');
  if(!root) return;
  const m = state.passwordModal;
  if(!m){ root.innerHTML = ''; return; }

  let title = '', body = '', submitLabel = 'Confirm';
  if(m.mode === 'create'){
    title = m.purpose==='reset' ? '🔒 Reset Password Banayein' : '🔒 Naya Password Banayein';
    body = `
      <p class="hint">Yeh password aapke Data Reset ko protect karega — isse yaad rakhein.</p>
      <label>Naya Password (kam se kam 4 characters)</label>
      <input type="password" id="pwInput1" value="${m.pass1 ? m.pass1.replace(/"/g,'&quot;') : ''}" autocomplete="off">
      <label>Password Confirm Karein</label>
      <input type="password" id="pwInput2" value="${m.pass2 ? m.pass2.replace(/"/g,'&quot;') : ''}" autocomplete="off">
    `;
    submitLabel = m.purpose==='reset' ? 'Set Karein aur Reset Karein' : 'Save Karein';
  } else if(m.mode === 'verify'){
    title = '🔒 Data Reset — Password Daalein';
    body = `
      <p class="hint">Sara practice data (history, records, rank, tips) permanently delete ho jaayega. Continue karne ke liye password daalein.</p>
      <label>Password</label>
      <input type="password" id="pwInput1" value="${m.pass1 ? m.pass1.replace(/"/g,'&quot;') : ''}" autocomplete="off">
    `;
    submitLabel = 'Data Reset Karein';
  } else if(m.mode === 'change-verify'){
    title = '🔑 Password Badlein';
    body = `
      <p class="hint">Pehle apna current password daalein.</p>
      <label>Current Password</label>
      <input type="password" id="pwOld" value="${m.old ? m.old.replace(/"/g,'&quot;') : ''}" autocomplete="off">
    `;
    submitLabel = 'Aage Badhein';
  }

  root.innerHTML = `
    <div class="pw-modal-backdrop" id="pwBackdrop"></div>
    <div class="pw-modal card">
      <h2>${title}</h2>
      ${body}
      ${m.error ? `<p class="pw-error">⚠️ ${m.error}</p>` : ''}
      <div class="pw-modal-actions">
        <button class="btn secondary" id="pwCancelBtn">Cancel</button>
        <button class="btn" id="pwSubmitBtn">${submitLabel}</button>
      </div>
    </div>
  `;

  const backdrop = document.getElementById('pwBackdrop');
  if(backdrop) backdrop.onclick = closePasswordModal;
  const cancelBtn = document.getElementById('pwCancelBtn');
  if(cancelBtn) cancelBtn.onclick = closePasswordModal;
  const submitBtn = document.getElementById('pwSubmitBtn');
  if(submitBtn) submitBtn.onclick = submitPasswordModal;

  const i1 = document.getElementById('pwInput1');
  if(i1){
    i1.focus();
    i1.oninput = e=>{ m.pass1 = e.target.value; };
    i1.onkeydown = e=>{
      if(e.key!=='Enter') return;
      const i2 = document.getElementById('pwInput2');
      if(i2) i2.focus(); else submitPasswordModal();
    };
  }
  const i2 = document.getElementById('pwInput2');
  if(i2){
    i2.oninput = e=>{ m.pass2 = e.target.value; };
    i2.onkeydown = e=>{ if(e.key==='Enter') submitPasswordModal(); };
  }
  const iOld = document.getElementById('pwOld');
  if(iOld){
    iOld.focus();
    iOld.oninput = e=>{ m.old = e.target.value; };
    iOld.onkeydown = e=>{ if(e.key==='Enter') submitPasswordModal(); };
  }
}

async function resetDataCore(){
  try{
    if(window.storage) await window.storage.delete(STORAGE_KEY, false);
  }catch(e){ /* nothing saved yet — fine */ }
  try{
    if(typeof localStorage !== 'undefined') localStorage.removeItem(STORAGE_KEY);
  }catch(e){ /* nothing saved yet — fine */ }
  state.combos = { add:{}, sub:{}, mul:{}, div:{} };
  state.records = { add:{}, sub:{}, mul:{}, div:{} };
  state.tips = JSON.parse(JSON.stringify(DEFAULT_TIPS));
  state.history = [];
  state.bestRank = {};
  state.weakFilter = 'all';
  state.course = { unlocked:1, completed:{} };
  state.levelProgress = {
    add: { unlocked:1, completed:{} },
    sub: { unlocked:1, completed:{} },
    mul: { unlocked:1, completed:{} },
    div: { unlocked:1, completed:{} },
  };
  state.expandedHistory = null;
  state.tab = 'setup';
  state.passwordModal = null;
  render();
}

      };

        const val = (sess.typedValue||'').trim();
        const el = document.getElementById('answerDisplay');
        if(sess.firstKeyAt==null && val!==''){ sess.firstKeyAt = performance.now(); }
        if(val===''){ if(el) el.classList.remove('wrong'); renderAnswerDisplay(); return; }
        if(Number(val) === q.answer){
          if(el) el.classList.remove('wrong');
          submitAnswer(val); // correct -> auto moves to next question
          return;
        }
        const typedDigits = val.replace('-','').length;
        if(typedDigits >= ansDigits){
          if(el) el.classList.add('wrong');
          sess.liveWrong = (sess.liveWrong||0) + 1; // accuracy meter dips right away on a wrong answer
          sess.mistakes = (sess.mistakes||0) + 1; // real fix: this question can no longer count as firstTry, so session/history/overview accuracy actually drops too
          const liveEl = document.getElementById('liveAccMeter');
          if(liveEl){
            const c = sess.liveCorrect||0, w = sess.liveWrong||0, t = c+w;
            const acc = t>0 ? (c/t)*100 : 100;
            liveEl.style.color = acc>=90 ? 'var(--green)' : acc>=70 ? 'var(--amber)' : 'var(--red)';
            liveEl.style.display = '';
            liveEl.textContent = `🎯 Live Accuracy: ${acc.toFixed(0)}% (${c} sahi / ${w} galat)`;
          }
          renderAnswerDisplay();
          setTimeout(()=>{
            if(state.session === sess){
              sess.typedValue = '';
              const el2 = document.getElementById('answerDisplay');
              if(el2) el2.classList.remove('wrong');
              renderAnswerDisplay();
            }
          }, 400);
        } else {
          if(el) el.classList.remove('wrong');
          renderAnswerDisplay();
        }
      };
      const keypadPress = (key)=>{
        if(key==='back'){ sess.typedValue = (sess.typedValue||'').slice(0,-1); }
        else if(key==='clear'){ sess.typedValue = ''; }
        else if(key==='enter'){ checkValue(); return; }
        else { sess.typedValue = (sess.typedValue||'') + key; }
        checkValue();
      };
      document.querySelectorAll('#keypad .keypad-btn').forEach(btn=>{
        btn.onclick = ()=> keypadPress(btn.dataset.key);
      });
      const enterBtn = document.getElementById('keypadEnter');
      if(enterBtn) enterBtn.onclick = ()=> keypadPress('enter');

      // Physical keyboard also works in keypad mode, without ever focusing a real text input
      const keydownHandler = e=>{
        if(!state.session || state.session!==sess){ document.removeEventListener('keydown', keydownHandler); return; }
        if(e.key>='0' && e.key<='9') keypadPress(e.key);
        else if(e.key==='Backspace') keypadPress('back');
        else if(e.key==='Enter') keypadPress('enter');
        else return;
        e.preventDefault();
      };
      if(practiceKeydownHandler) document.removeEventListener('keydown', practiceKeydownHandler);
      practiceKeydownHandler = keydownHandler;
      document.addEventListener('keydown', practiceKeydownHandler);
    } else {
      if(practiceKeydownHandler){ document.removeEventListener('keydown', practiceKeydownHandler); practiceKeydownHandler = null; }
      const input = document.getElementById('answerInput');
      if(input){
        input.focus();
        const checkValue = ()=>{
          const val = input.value.trim();
          if(sess.firstKeyAt==null && val!==''){ sess.firstKeyAt = performance.now(); }
          if(val===''){ input.classList.remove('wrong'); return; }
          if(Number(val) === q.answer){
            input.classList.remove('wrong');
            submitAnswer(val); // correct -> auto moves to next question
            return;
          }
          const typedDigits = val.replace('-','').length;
          if(typedDigits >= ansDigits){
            input.classList.add('wrong');
            sess.liveWrong = (sess.liveWrong||0) + 1; // accuracy meter dips right away on a wrong answer
            sess.mistakes = (sess.mistakes||0) + 1; // real fix: this question can no longer count as firstTry, so session/history/overview accuracy actually drops too
            const liveEl = document.getElementById('liveAccMeter');
            if(liveEl){
              const c = sess.liveCorrect||0, w = sess.liveWrong||0, t = c+w;
              const acc = t>0 ? (c/t)*100 : 100;
              liveEl.style.color = acc>=90 ? 'var(--green)' : acc>=70 ? 'var(--amber)' : 'var(--red)';
              liveEl.style.display = '';
              liveEl.textContent = `🎯 Live Accuracy: ${acc.toFixed(0)}% (${c} sahi / ${w} galat)`;
            }
            setTimeout(()=>{
              if(document.body.contains(input)){
                input.value = '';
                input.classList.remove('wrong');
                input.focus();
              }
            }, 400);
          } else {
            input.classList.remove('wrong');
          }
        };
        input.oninput = checkValue;
        input.onkeydown = e=>{ if(e.key==='Enter') checkValue(); };
      }
    }

    if(practiceTickHandle) clearInterval(practiceTickHandle);
    const swEl = document.getElementById('stopwatch');
    if(swEl){
      const fastLimit = THRESH[state.settings.op] || 5;
      practiceTickHandle = setInterval(()=>{
        if(!state.session || !document.body.contains(swEl)){ clearInterval(practiceTickHandle); return; }
        const elapsed = (performance.now() - state.session.qStart)/1000;
        swEl.textContent = formatPulse(elapsed);
        swEl.classList.toggle('slow', elapsed > fastLimit);
      }, 10); // 10ms tick — millisecond-level "God mode" precision
    }

    const quitBtn = document.getElementById('quitPracticeBtn');
    if(quitBtn) quitBtn.onclick = quitPractice;
  }
  if(state.tab==='tips'){
    document.getElementById('addTipBtn').onclick = ()=>{
      const op = document.getElementById('tipOp').value;
      const text = document.getElementById('tipText').value.trim();
      if(text){ state.tips[op].push(text); render(); }
    };
    document.querySelectorAll('.delTip').forEach(btn=>{
      btn.onclick = ()=>{
        const op = btn.dataset.op, idx = Number(btn.dataset.idx);
        state.tips[op].splice(idx,1);
        render();
      };
    });
  }
  if(state.tab==='history'){
    document.querySelectorAll('.hist-toggle').forEach(btn=>{
      btn.onclick = ()=>{
        const id = Number(btn.dataset.id);
        state.expandedHistory = state.expandedHistory === id ? null : id;
        render();
      };
    });
  }
  if(state.tab==='weak'){
    const gm = document.getElementById('goMasterBtn');
    if(gm) gm.onclick = ()=>{ state.courseLevel = null; state.activeLevelRun = null; startPractice(true, state.weakFilter); };
    document.querySelectorAll('.chip-btn').forEach(btn=>{
      btn.onclick = ()=>{ state.weakFilter = btn.dataset.filter; render(); };
    });
  }
  if(state.tab==='progress'){
    document.querySelectorAll('[data-progfilter]').forEach(btn=>{
      btn.onclick = ()=>{ state.progressDigitFilter = btn.dataset.progfilter; render(); };
    });
  }
  if(state.tab==='leaderboard'){
    document.querySelectorAll('[data-leaderop]').forEach(btn=>{
      btn.onclick = ()=>{ state.leaderOpFilter = btn.dataset.leaderop; render(); };
    });
    document.querySelectorAll('[data-leadertier]').forEach(btn=>{
      btn.onclick = ()=>{ state.leaderTierFilter = btn.dataset.leadertier; render(); };
    });
  }
  const home1 = document.getElementById('homeBtn');
  if(home1) home1.onclick = ()=>{ state.tab='setup'; render(); };
  const home2 = document.getElementById('homeBtn2');
  if(home2) home2.onclick = ()=>{ state.tab='setup'; render(); };
  const nextLevelBtn = document.getElementById('nextLevelBtn');
  if(nextLevelBtn) nextLevelBtn.onclick = ()=> startCourseLevel(Number(nextLevelBtn.dataset.level));
  const retryLevelBtn = document.getElementById('retryLevelBtn');
  if(retryLevelBtn) retryLevelBtn.onclick = ()=> startCourseLevel(Number(retryLevelBtn.dataset.level));
  const backCourseBtn = document.getElementById('backCourseBtn');
  if(backCourseBtn) backCourseBtn.onclick = ()=>{ state.tab='course'; render(); };
  const nextLevelTrackBtn = document.getElementById('nextLevelTrackBtn');
  if(nextLevelTrackBtn) nextLevelTrackBtn.onclick = ()=> startLevelTrack(nextLevelTrackBtn.dataset.op, Number(nextLevelTrackBtn.dataset.level));
  const retryLevelTrackBtn = document.getElementById('retryLevelTrackBtn');
  if(retryLevelTrackBtn) retryLevelTrackBtn.onclick = ()=> startLevelTrack(retryLevelTrackBtn.dataset.op, Number(retryLevelTrackBtn.dataset.level));
  const backLevelsBtn = document.getElementById('backLevelsBtn');
  if(backLevelsBtn) backLevelsBtn.onclick = ()=>{ state.tab='levels'; render(); };
}

function bindThemeSwitcher(){
  const dots = document.querySelectorAll('.theme-dot');
  const apply = ()=>{
    document.body.dataset.theme = state.theme;
    dots.forEach(d=> d.classList.toggle('active', d.dataset.theme===state.theme));
  };
  dots.forEach(d=>{
    d.onclick = ()=>{ state.theme = d.dataset.theme; apply(); };
  });
  apply();
}

function bindSplash(){
  const splash = document.getElementById('splashScreen');
  const toggle = document.getElementById('splashToggle');
  if(!splash || !toggle) return;
  document.body.style.overflow = 'hidden';
  toggle.onclick = ()=>{
    if(toggle.classList.contains('on')) return;
    toggle.classList.add('on');
    toggle.setAttribute('aria-checked','true');
    setTimeout(()=>{
      splash.classList.add('closing');
      document.body.style.overflow = '';
      setTimeout(()=> splash.remove(), 450);
    }, 320);
  };
}

(async function boot(){
  await loadState();
  render();
  bindThemeSwitcher();
  bindSplash();
})();

// Voices ki list kai browsers me thodi der baad async load hoti hai — jab load ho jaaye
// aur user Customize screen par ho, to voice dropdown ko taaza values se dobara render karein.
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=>{
    if(state.tab==='customize') render();
  };
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
