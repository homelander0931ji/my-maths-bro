<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganit Abhyaas — Speed Math Trainer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101B2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ganit Abhyaas">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101B2E;
    --navy2:#16233B;
    --chalk:#F1ECDD;
    --amber:#E3A93B;
    --teal:#37918C;
    --red:#D9564C;
    --green:#4FA872;
    --line: rgba(241,236,221,0.08);
  }
  body[data-theme="paper"]{
    --navy:#EFE9D8;
    --navy2:#E3DBC4;
    --chalk:#2B2418;
    --amber:#B5651D;
    --teal:#2E7D6B;
    --red:#C0392B;
    --green:#3C8C4A;
    --line: rgba(43,36,24,0.10);
  }
  body[data-theme="forest"]{
    --navy:#10241C;
    --navy2:#163A2B;
    --chalk:#EAF3EA;
    --amber:#D9A441;
    --teal:#4FB08C;
    --red:#E0645A;
    --green:#7BC97E;
    --line: rgba(234,243,234,0.08);
  }
  body[data-theme="sunset"]{
    --navy:#221A2E;
    --navy2:#332444;
    --chalk:#FBEFE3;
    --amber:#F2A65A;
    --teal:#C4587A;
    --red:#E4574C;
    --green:#6FBF8B;
    --line: rgba(251,239,227,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 27px, var(--line) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--line) 27px, var(--line) 28px),
      var(--navy);
    color:var(--chalk);
    transition: background-color .2s ease, color .2s ease;
    font-family: Georgia, 'Noto Sans Devanagari', 'Segoe UI', sans-serif;
    min-height:100vh;
  }
  .num, .timer, .stat-num{
    font-family: 'Consolas', 'Courier New', monospace;
    font-variant-numeric: tabular-nums;
  }
  header{
    padding: 30px 20px 16px;
    text-align:center;
    background: linear-gradient(180deg, rgba(0,0,0,0.12), transparent);
  }
  header h1{
    margin:0;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 2.1rem;
    letter-spacing:0.5px;
    color: var(--amber);
    font-weight:700;
    text-shadow: 0 2px 18px rgba(227,169,59,0.25);
  }
  header p{
    margin:6px 0 0;
    color: rgba(241,236,221,0.65);
    font-size:0.95rem;
  }
  .theme-row{ display:flex; justify-content:center; gap:10px; margin-top:14px; }
  .theme-dot{
    width:26px; height:26px; border-radius:50%;
    border:2px solid rgba(241,236,221,0.3);
    cursor:pointer;
    padding:0;
  }
  .theme-dot.active{ border-color:var(--amber); box-shadow:0 0 0 2px var(--amber); }
  nav{
    position:sticky; top:0;
    background:var(--navy);
    border-bottom:1px solid var(--line);
    padding:12px 18px;
    z-index:20;
  }
  .nav-bar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .nav-current{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-size:1.05rem;
    color:var(--amber);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .kebab-btn{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius:50%;
    background:transparent;
    border:1px solid rgba(241,236,221,0.28);
    color:var(--chalk);
    font-size:1.3rem;
    line-height:1;
    letter-spacing:1px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: all .15s ease;
  }
  .kebab-btn:hover, .kebab-btn.open{ border-color:var(--amber); color:var(--amber); background:rgba(227,169,59,0.08); }
  .nav-menu-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.4);
    z-index:19;
    animation: splashFade .15s ease both;
  }
  .nav-menu{
    position:absolute;
    right:18px; top:60px;
    background:var(--navy2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px;
    min-width:230px;
    max-height:calc(100vh - 90px);
    overflow-y:auto;
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    z-index:21;
    display:flex;
    flex-direction:column;
    gap:3px;
    animation: cardIn .18s cubic-bezier(.2,.8,.3,1) both;
  }
  .nav-menu-item{
    background:transparent;
    border:none;
    text-align:left;
    color:var(--chalk);
    padding:11px 14px;
    border-radius:9px;
    cursor:pointer;
    font-size:0.92rem;
    font-weight:600;
    transition: background .12s ease, color .12s ease;
  }
  .nav-menu-item:hover{ background:rgba(227,169,59,0.1); }
  .nav-menu-item.active{ background:var(--amber); color:var(--navy); }
  .nav-menu-divider{ height:1px; background:var(--line); margin:6px 6px; flex-shrink:0; }
  .nav-menu-danger{ color:var(--red); }
  .nav-menu-danger:hover{ background:rgba(217,86,76,0.12); }
  .pw-modal-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    z-index:30;
    animation: splashFade .15s ease both;
  }
  .pw-modal.card{
    position:fixed;
    left:50%; top:50%;
    z-index:31;
    width:min(340px, 88vw);
    max-height:85vh;
    overflow-y:auto;
    margin:0;
    animation: pwModalIn .18s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes pwModalIn{
    from{ opacity:0; transform:translate(-50%,-50%) translateY(8px); }
    to{ opacity:1; transform:translate(-50%,-50%) translateY(0); }
  }
  .pw-modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .pw-modal-actions .btn{ flex:1; text-align:center; margin:0; }
  .pw-error{
    color:var(--red);
    font-size:0.85rem;
    margin:10px 0 0;
  }
  main{
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 18px 60px;
  }
  .card{
    background: var(--navy2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 20px;
    margin-bottom:18px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.22), inset 0 1px 0 rgba(241,236,221,0.04);
    animation: cardIn .35s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card h2{
    margin-top:0;
    font-family: 'Fraunces', Georgia, serif;
    color:var(--amber);
    font-size:1.2rem;
    font-weight:600;
    border-bottom:1px dashed rgba(241,236,221,0.2);
    padding-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  label{
    display:block;
    font-size:0.85rem;
    color: rgba(241,236,221,0.7);
    margin: 12px 0 5px;
  }
  select, input[type=number], input[type=text], input[type=password]{
    width:100%;
    padding:9px 11px;
    background: var(--navy);
    border:1px solid rgba(241,236,221,0.25);
    color:var(--chalk);
    border-radius:8px;
    font-size:1rem;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  select:focus, input[type=number]:focus, input[type=text]:focus, input[type=password]:focus{
    outline:none;
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(227,169,59,0.18);
  }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .row > div{ flex:1; min-width:130px; }
  .btn{
    display:inline-block;
    background: linear-gradient(180deg, var(--amber), color-mix(in srgb, var(--amber) 82%, black));
    color: var(--navy);
    border:none;
    padding:11px 22px;
    border-radius:9px;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    margin-top:16px;
    box-shadow: 0 3px 10px rgba(227,169,59,0.28);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(227,169,59,0.36); filter:brightness(1.04); }
  .btn:active{ transform:translateY(0); box-shadow:0 2px 6px rgba(227,169,59,0.3); }
  .btn.secondary{
    background:transparent;
    color: var(--amber);
    border:1px solid var(--amber);
    box-shadow:none;
  }
  .btn.secondary:hover{ background:rgba(227,169,59,0.08); }
  .btn.teal{ background: linear-gradient(180deg, var(--teal), color-mix(in srgb, var(--teal) 82%, black)); color:var(--chalk); box-shadow:0 3px 10px rgba(55,145,140,0.3); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; filter:none; box-shadow:none; }

  /* Practice screen */
  .practice-box{ text-align:center; }
  .qtext{
    font-size:2.6rem;
    margin: 18px 0;
    letter-spacing:1px;
  }
  .practice-box input[type=text]{
    text-align:center;
    font-size:1.6rem;
    max-width:220px;
    margin:0 auto;
    display:block;
    transition: border-color .1s ease, color .1s ease;
  }
  .practice-box input[type=text].wrong{
    border-color: var(--red);
    color: var(--red);
    background: rgba(217,86,76,0.12);
  }
  .answer-display{
    text-align:center;
    font-size:1.6rem;
    min-width:140px;
    max-width:220px;
    min-height:1.3em;
    margin:0 auto;
    padding:8px 16px;
    border-radius:10px;
    border:1px solid rgba(241,236,221,0.28);
    background:rgba(241,236,221,0.04);
    color:var(--chalk);
    transition: border-color .1s ease, color .1s ease, background .1s ease;
  }
  .answer-display.placeholder{ color: rgba(241,236,221,0.4); font-size:1rem; }
  .answer-display.wrong{
    border-color: var(--red);
    color: var(--red);
    background: rgba(217,86,76,0.12);
  }
  .answer-cursor{
    display:inline-block;
    margin-left:2px;
    animation: cursorBlink 1s step-end infinite;
  }
  @keyframes cursorBlink{ 0%,50%{opacity:1;} 50.01%,100%{opacity:0;} }
  .keypad{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:8px;
    max-width:340px;
    margin:14px auto 0;
  }
  .keypad-btn{
    padding:14px 0;
    font-size:1.3rem;
    font-family:'Consolas','Courier New',monospace;
    border:none;
    border-radius:14px;
    background:var(--navy2);
    color:var(--chalk);
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    transition: transform .08s ease, filter .08s ease;
  }
  .keypad-btn:active{ transform:scale(0.94); filter:brightness(1.15); }
  .keypad-btn.special{
    background: color-mix(in srgb, var(--teal) 35%, var(--navy2));
    display:flex; align-items:center; justify-content:center;
  }
  .keypad-btn.enter{ background: var(--teal); color:var(--navy); }
  .keypad-enter{ max-width:340px; margin:10px auto 0 !important; }
  .progress{
    font-size:0.85rem;
    color: rgba(241,236,221,0.6);
    margin-bottom:6px;
  }
  .timer{
    font-size:1.1rem;
    color: var(--teal);
    margin-top:10px;
  }
  .stopwatch{
    font-size:2rem;
    color:var(--teal);
    font-weight:700;
    margin-top:12px;
    letter-spacing:0.5px;
  }
  .stopwatch.slow{ color:var(--red); }
  .countdown-num{
    font-size:5rem;
    font-weight:700;
    color:var(--amber);
    margin:26px 0;
    animation: countdownPulse .7s ease both;
  }
  .countdown-num.countdown-word{
    font-size:2.6rem;
    font-family: Georgia, 'Noto Sans Devanagari', 'Segoe UI', sans-serif;
    letter-spacing:1px;
  }
  @keyframes countdownPulse{
    from{ opacity:0; transform:scale(0.6); }
    to{ opacity:1; transform:scale(1); }
  }
  .blink-progress{
    font-size:0.85rem;
    color: rgba(241,236,221,0.55);
    margin-top:8px;
    letter-spacing:0.5px;
  }
  .blink-num{
    font-size:4.4rem;
    font-weight:700;
    color:var(--amber);
    min-height:1.6em;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:10px 0 6px;
  }
  .blink-num.show{ animation: blinkFlash .12s ease both; }
  @keyframes blinkFlash{
    from{ opacity:0; transform:scale(0.85); }
    to{ opacity:1; transform:scale(1); }
  }
  .split-row{ display:flex; justify-content:center; gap:16px; margin-top:6px; font-size:0.78rem; color:rgba(241,236,221,0.55); }
  .split-row span b{ color:rgba(241,236,221,0.85); font-family:'Consolas',monospace; }
  .feedback{
    min-height:26px;
    font-weight:700;
    margin-top:10px;
  }
  .feedback.ok{ color:var(--green); }
  .feedback.no{ color:var(--red); }

  /* Results - speed ladder */
  .ladder-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
    font-size:0.9rem;
  }
  .ladder-q{ width:150px; flex-shrink:0; }
  .ladder-bar-wrap{ flex:1; background:var(--navy); border-radius:6px; overflow:hidden; height:22px; }
  .ladder-bar{ height:100%; border-radius:6px; display:flex; align-items:center; padding-left:6px; font-size:0.78rem; color:var(--navy); font-weight:700; white-space:nowrap; }
  .ladder-time{ width:56px; text-align:right; flex-shrink:0; }
  .stats-grid{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .stat{ flex:1; min-width:120px; background:var(--navy); border-radius:10px; padding:12px; text-align:center; }
  .stat .stat-num{ font-size:1.4rem; color:var(--amber); font-weight:700; }
  .stat .stat-label{ font-size:0.75rem; color:rgba(241,236,221,0.6); }

  /* Tips */
  .tip-group h3{ color:var(--teal); margin-bottom:6px; font-size:1rem; }
  .tip-list{ list-style:none; padding:0; margin:0 0 14px; }
  .tip-list li{
    background:var(--navy);
    padding:8px 10px;
    border-radius:8px;
    margin-bottom:6px;
    font-size:0.92rem;
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .tip-list li button{
    background:none; border:none; color:var(--red); cursor:pointer; font-size:0.85rem;
  }
  .tip-add{ display:flex; gap:8px; margin-top:8px; }
  .tip-add select{ max-width:110px; }

  /* Weak combos */
  .combo-chip{
    display:inline-block;
    background:var(--red);
    color:var(--chalk);
    padding:6px 12px;
    border-radius:8px;
    margin:4px;
    font-family:'Consolas',monospace;
    font-size:0.95rem;
  }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 18px; }
  .chip-btn{
    background:transparent;
    border:1px solid rgba(241,236,221,0.25);
    color:var(--chalk);
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    font-size:0.85rem;
  }
  .chip-btn.active{ background:var(--teal); border-color:var(--teal); color:var(--chalk); font-weight:700; }
  .quiz-opts{ display:flex; flex-direction:column; gap:10px; margin:16px 0; }
  .quiz-opt{
    text-align:left;
    background:var(--navy);
    border:1px solid rgba(241,236,221,0.25);
    color:var(--chalk);
    padding:12px 14px;
    border-radius:10px;
    cursor:pointer;
    font-size:0.95rem;
    transition: all .15s ease;
  }
  .quiz-opt:hover:not(:disabled){ border-color:var(--amber); background:rgba(227,169,59,0.08); }
  .quiz-opt.correct{ border-color:var(--green); background:rgba(79,168,114,0.18); font-weight:700; }
  .quiz-opt.wrong{ border-color:var(--red); background:rgba(217,86,76,0.18); }
  .quiz-opt:disabled{ cursor:default; opacity:0.85; }
  .tier-sub{ margin: 6px 0 12px; }
  .tier-sub h4{ margin:0 0 4px; font-size:0.8rem; color: rgba(241,236,221,0.55); text-transform:uppercase; letter-spacing:0.5px; }
  .tier-sub-wrap{ margin-top:14px; padding-top:12px; border-top:1px dashed rgba(241,236,221,0.2); }
  .tier-sub-wrap > h4{ margin:0 0 2px; font-size:0.9rem; color:var(--amber); }
  .learn-list{
    margin-top:10px;
    max-height:400px;
    overflow-y:auto;
    border-radius:10px;
  }
  .learn-row{
    display:flex;
    justify-content:space-between;
    padding:9px 6px;
    font-size:1.05rem;
    border-bottom:1px dashed var(--line);
  }
  .learn-row:last-child{ border-bottom:none; }
  .learn-row.speaking-row{
    background: rgba(227,169,59,0.16);
    border-radius:8px;
    color: var(--amber);
    font-weight:700;
  }
  .learn-grid{
    margin-top:10px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(88px,1fr));
    gap:7px;
    max-height:420px;
    overflow-y:auto;
    padding:2px;
  }
  .learn-cell{
    background:var(--navy);
    border:1px solid var(--line);
    border-radius:9px;
    padding:7px 5px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    text-align:center;
    word-break:break-all;
  }
  .learn-cell-top{ color:var(--amber); font-weight:700; font-size:0.85rem; }
  .learn-cell-bot{ font-size:0.78rem; color:rgba(241,236,221,0.8); }
  .empty-msg{ color:rgba(241,236,221,0.5); font-style:italic; }
  .hint{ font-size:0.82rem; color:rgba(241,236,221,0.55); margin-top:4px; }
  .check-row{
    display:flex; align-items:center; gap:9px;
    background: rgba(227,169,59,0.07);
    border:1px solid rgba(227,169,59,0.25);
    border-radius:10px;
    padding:10px 12px;
    margin-top:10px;
    font-size:0.9rem;
    cursor:pointer;
  }
  .check-row input[type="checkbox"]{
    width:18px; height:18px;
    accent-color: var(--amber);
    flex-shrink:0;
    cursor:pointer;
  }
  .hist-row{
    background:var(--navy);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .hist-main{ display:flex; justify-content:space-between; font-weight:700; margin-bottom:4px; }
  .hist-op{ color:var(--amber); }
  .hist-time-tag{ color:rgba(241,236,221,0.5); font-size:0.82rem; font-weight:400; }
  .hist-stats{ display:flex; gap:14px; font-size:0.85rem; color:rgba(241,236,221,0.8); flex-wrap:wrap; }
  .hist-toggle{ margin-top:8px; padding:5px 12px; font-size:0.78rem; }
  .hist-detail{ margin-top:10px; padding-top:10px; border-top:1px dashed rgba(241,236,221,0.15); }
  .prog-chart{
    display:flex;
    align-items:flex-end;
    gap:5px;
    height:80px;
    background:var(--navy);
    border-radius:8px;
    padding:8px;
  }
  .prog-bar-wrap{ flex:1; height:100%; display:flex; align-items:flex-end; }
  .prog-bar{ width:100%; background:var(--teal); border-radius:4px 4px 0 0; min-height:4px; }
  .rank-op-card{ background:var(--navy); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .rank-op-head{ display:flex; justify-content:space-between; font-weight:700; margin-bottom:6px; }
  .rank-op-name{ color:var(--amber); }
  .rank-bar-wrap{ background:var(--navy); border-radius:999px; height:10px; overflow:hidden; margin:6px 0; }
  .rank-bar{ height:100%; background: linear-gradient(90deg, var(--teal), var(--amber)); border-radius:999px; }
  footer{ text-align:center; padding:20px; color:rgba(241,236,221,0.4); font-size:0.8rem; }

  /* Splash screen with signature chalk toggle */
  .splash{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(227,169,59,0.10), transparent 60%),
      var(--navy);
    padding:20px;
    animation: splashFade .4s ease both;
  }

const STORAGE_KEY = 'ganit-abhyaas-progress';
const PERSIST_KEYS = ['combos','records','tips','history','bestRank','weakFilter','theme','course','levelProgress','tablesSettings','learnSettings','gkSettings','progressDigitFilter','security','practiceCustomize','speakSettings'];
let saveInFlight = false, savePending = false;

function getPersistedSlice(){
  const slice = {};
  PERSIST_KEYS.forEach(k => { slice[k] = state[k]; });
  return slice;
}

async function saveState(){
  const payload = JSON.stringify(getPersistedSlice());

  // localStorage is what keeps progress once this app is packaged into a standalone APK/WebView —
  // window.storage only exists inside the Claude artifact preview, so this is the path that matters on-device.
  try{
    if(typeof localStorage !== 'undefined') localStorage.setItem(STORAGE_KEY, payload);
  }catch(e){
    console.error('Ganit Abhyaas: localStorage save failed', e);
  }

  // Mirror to window.storage too when available (Claude artifact preview) — best-effort, never blocks the localStorage save above.
  if(typeof window !== 'undefined' && window.storage){
    if(saveInFlight){ savePending = true; return; }
    saveInFlight = true;
    try{
      await window.storage.set(STORAGE_KEY, payload, false);
    }catch(e){
      console.error('Ganit Abhyaas: window.storage save failed', e);
    }finally{
      saveInFlight = false;
      if(savePending){ savePending = false; saveState(); }
    }
  }
}

async function loadState(){
  let saved = null;

  // Prefer window.storage when running inside Claude's artifact preview.
  if(typeof window !== 'undefined' && window.storage){
    try{
      const result = await window.storage.get(STORAGE_KEY, false);
      if(result && result.value) saved = JSON.parse(result.value);
    }catch(e){ /* nothing saved there yet */ }
  }

  // Fall back to localStorage — this is the path used once packaged as a standalone APK.
  if(!saved && typeof localStorage !== 'undefined'){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) saved = JSON.parse(raw);
    }catch(e){ /* nothing saved there yet either — first ever visit, keep defaults */ }
  }

  if(saved){
    PERSIST_KEYS.forEach(k => { if(saved[k]!==undefined) state[k] = saved[k]; });
  }
  // backfill any new tablesSettings fields (older saved data may pre-date them) without touching existing saved values

    { tableNum:11, mode:'normal', cubeMode:'normal', cubeRange:12, squareMode:'normal', squareRange:12 },

  );

    { medium:'hi', voiceURI:'', rate:0.9, pitch:1 },
    state.speakSettings
  );
  // recompute accuracy on older saved history — previously every session showed 100% accuracy
  // because a question only got recorded once it was answered correctly; now wrong attempts
  // (already tracked per-question as `mistakes`) count against accuracy too.
  if(Array.isArray(state.history)){
    state.history.forEach(h=>{
      if(h.details && h.details.length){
        const trueCorrect = h.details.filter(d=>(d.mistakes||0)===0).length;
        h.correctCt = trueCorrect;
        h.accuracy = (trueCorrect/h.total)*100;
        h.rank = computeRank(h.op, h.avgTime, h.accuracy, h.digitTier||1);
      }
    });
    const recomputedBest = {};
    state.history.forEach(h=>{
      if(!h.rank) return;
      if(!recomputedBest[h.op] || h.rank.score > recomputedBest[h.op].score){
        recomputedBest[h.op] = { tier:h.rank.tier, emoji:h.rank.emoji, score:h.rank.score, sub:h.rank.sub };
      }
    });
    state.bestRank = recomputedBest;
  }
  state.gkSettings = Object.assign(
    { subject:'history', mode:'read' },
    state.gkSettings
  );
  if(state.progressDigitFilter==null) state.progressDigitFilter = 'all';
}

function startLevelTrack(op, id){
  const track = LEVEL_TRACKS[op];
  const lvl = track && track.find(l=>l.id===id);
  if(!lvl) return;
  state.courseLevel = null;
  state.activeLevelRun = { op, id };
  state.settings = {
    op,
    rowCount: 2,
    digitA: lvl.digitA || 1,
    digitB: lvl.digitB || 1,
    qCount: lvl.qCount,
    range: lvl.range || null,
  };
  startPractice(false);
}

const RANK_TIERS = [
  { tier:'Bronze',      emoji:'🥉', min:0,  max:20 },
  { tier:'Silver',      emoji:'🥈', min:20, max:35 },
  { tier:'Gold',        emoji:'🥇', min:35, max:55 },
  { tier:'Diamond',     emoji:'💎', min:55, max:80 },
  { tier:'Heroic',      emoji:'⚔️', min:80, max:93 },
  { tier:'Grandmaster', emoji:'👑', min:93, max:100 },
];

function tierFromScore(score){
  for(let i=0;i<RANK_TIERS.length;i++){
    const t = RANK_TIERS[i];
    if(score>=t.min && score<t.max){
      const pos = (score - t.min) / (t.max - t.min); // 0..1 progress within this tier
      const sub = Math.min(4, Math.floor(pos*4) + 1); // 1 = just entered tier, 4 = right at the edge of promotion
      return { ...t, next: RANK_TIERS[i+1]||null, sub };
    }
  }
  const last = RANK_TIERS[RANK_TIERS.length-1];
  return { ...last, next:null, sub:4 };
}
function computeRank(op, avgTime, accuracy, digitTier){
  const mult = TIER_MULT[Math.min(4, digitTier||1)] || 1; // bigger numbers get fair extra time
  const thresh = (THRESH[op] || 5) * mult;
  const ratio = avgTime/thresh;
  const speedScore = Math.max(0, 1 - Math.min(ratio,2)/2) * 100; // 100 = instant, 0 = very slow
  const score = Math.round(accuracy*0.5 + speedScore*0.5);
  const t = tierFromScore(score);
  const progressPct = t.next ? Math.round(((score - t.min)/(t.max - t.min))*100) : 100;
  return { ...t, ratio, score, progressPct };
}

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randDigit(len){
  if(len<=1) return randInt(1,9);
  const min = Math.pow(10,len-1), max = Math.pow(10,len)-1;
  return randInt(min,max);
}
function gcd(a,b){ return b===0? a : gcd(b,a%b); }
function lcm(a,b){ return (a*b)/gcd(a,b); }

function formatPulse(sec){
  // "God level" precision display: whole seconds + millisecond "pulse", e.g. 1s 989ms
  const s = Math.floor(sec);
  const ms = Math.round((sec - s) * 1000);
  return `${s}s ${String(ms).padStart(3,'0')}ms`;
}
function comboKey(a,b){ return a+"_"+b; }
function tierOf(a,b){ return Math.min(4, Math.max(String(Math.abs(a)).length, String(Math.abs(b)).length)); }

const PERCENT_TIERS = {
  1: [10,20,25,50],
  2: [5,15,35,40,60,75],
  3: [12,18,24,32,45,65,85,90],
};
function randPercentQ(tier, baseDigits){
  const set = PERCENT_TIERS[Math.min(3, tier||1)] || PERCENT_TIERS[1];
  const p = set[randInt(0,set.length-1)];
  const mult = 100/gcd(100,p); // base must be a multiple of this for a whole-number answer
  const maxK = Math.max(1, Math.floor(Math.pow(10,baseDigits||1)/mult));
  const base = mult*randInt(1,maxK);
  return { p, base, answer:(p*base)/100 };
}

/* ================= QUESTION GENERATION ================= */
function generateQuestion(){
  const s = state.settings;
  if(s.op === 'mix'){
    const pick = ['add','sub','mul','div'][randInt(0,3)];
    if(pick==='add'){
      const a = randDigit(s.digitA), b = randDigit(s.digitB);
      return { text: `${a} + ${b}`, answer: a+b, tag: {op:'add', a, b} };
    }
    if(pick==='sub'){
      let a = randDigit(s.digitA), b = randDigit(s.digitB);
      if(a<b) [a,b]=[b,a];
      return { text: `${a} - ${b}`, answer: a-b, tag: {op:'sub', a, b} };
    }
    if(pick==='mul'){
      const a = randDigit(s.digitA), b = randDigit(s.digitB);
      return { text: `${a} × ${b}`, answer: a*b, tag: {op:'mul', a, b} };
    }
    const divisor = Math.max(1, randDigit(s.digitB));
    const quotient = randDigit(s.digitA);
    const dividend = divisor*quotient;
    return { text: `${dividend} ÷ ${divisor}`, answer: quotient, tag: {op:'div', a:divisor, b:quotient} };
  }
  if(s.op === 'add' && s.rowCount > 2){
    const nums = [];
    for(let i=0;i<s.rowCount;i++) nums.push(randDigit(s.digitA));
    const answer = nums.reduce((x,y)=>x+y,0);
    return { text: nums.join(' + '), answer, tag:null, nums };
  }
  if(s.op === 'add' && s.range){
    const [lo,hi] = s.range;
    const a = randInt(lo,hi), b = randInt(lo,hi);
    return { text: `${a} + ${b}`, answer: a+b, tag: {op:'add', a, b} };
  }
  if(s.op === 'add' && s.carryOnly && s.digitA===1 && s.digitB===1){
    const a = randInt(1,9);
    const b = randInt(Math.max(1,10-a), 9); // forces a+b >= 10, e.g. 9+1, 7+6, 6+5 — never 3+4, 8+1
    return { text: `${a} + ${b}`, answer: a+b, tag: {op:'add', a, b} };
  }
  if(s.op === 'add'){
    const a = randDigit(s.digitA), b = randDigit(s.digitB);
    const answer = a+b;
    return { text: `${a} + ${b}`, answer, tag: {op:'add', a, b} };
  }
  if(s.op === 'sub'){
    let a = randDigit(s.digitA), b = randDigit(s.digitB);
    if(a<b) [a,b]=[b,a];
    return { text: `${a} - ${b}`, answer: a-b, tag: {op:'sub', a, b} };
  }
  if(s.op === 'mul'){
    const a = randDigit(s.digitA), b = randDigit(s.digitB);
    return { text: `${a} × ${b}`, answer: a*b, tag: {op:'mul', a, b} };
  }
  if(s.op === 'div'){
    const divisor = Math.max(1, randDigit(s.digitB));
    const quotient = randDigit(s.digitA);
    const dividend = divisor*quotient;
    return { text: `${dividend} ÷ ${divisor}`, answer: quotient, tag: {op:'div', a:divisor, b:quotient} };
  }
  if(s.op === 'lcm'){
    const a = Math.max(1,randDigit(s.digitA)), b = Math.max(1,randDigit(s.digitB));
    return { text: `LCM(${a}, ${b})`, answer: lcm(a,b), tag:null };
  }
  if(s.op === 'square'){
    const n = randDigit(s.digitA);
    return { text: `${n}²`, answer: n*n, tag:null };
  }
  if(s.op === 'percent'){
    const { p, base, answer } = randPercentQ(s.digitA, s.digitB);
    return { text: `${p}% of ${base}`, answer, tag:null };
  }
}

function questionFromCombo(op,a,b){
  if(op==='add') return { text:`${a} + ${b}`, answer:a+b, tag:{op,a,b} };
  if(op==='sub') return { text:`${a} - ${b}`, answer:a-b, tag:{op,a,b} };
  if(op==='mul') return { text:`${a} × ${b}`, answer:a*b, tag:{op,a,b} };
  if(op==='div') return { text:`${a*b} ÷ ${a}`, answer:b, tag:{op,a,b} };
}

function shuffleArr(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=randInt(0,i); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ================= SPEAK TABLES — bolke pahada sunayein (Hindi ya English) ================= */
// 0 se 100 tak Hindi ginti — 100 se aage "<hundreds> sau <remainder>" jodkar banaya jaata hai
const HI_WORDS = ['शून्य','एक','दो','तीन','चार','पांच','छह','सात','आठ','नौ','दस',
'ग्यारह','बारह','तेरह','चौदह','पंद्रह','सोलह','सत्रह','अठारह','उन्नीस','बीस',
'इक्कीस','बाईस','तेईस','चौबीस','पच्चीस','छब्बीस','सत्ताईस','अट्ठाईस','उनतीस','तीस',
'इकतीस','बत्तीस','तैंतीस','चौंतीस','पैंतीस','छत्तीस','सैंतीस','अड़तीस','उनतालीस','चालीस',
'इकतालीस','बयालीस','तैंतालीस','चवालीस','पैंतालीस','छियालीस','सैंतालीस','अड़तालीस','उनचास','पचास',
'इक्यावन','बावन','तिरपन','चौवन','पचपन','छप्पन','सत्तावन','अट्ठावन','उनसठ','साठ',
'इकसठ','बासठ','तिरसठ','चौंसठ','पैंसठ','छियासठ','सरसठ','अड़सठ','उनहत्तर','सत्तर',
'इकहत्तर','बहत्तर','तिहत्तर','चौहत्तर','पचहत्तर','छिहत्तर','सतहत्तर','अठहत्तर','उनासी','अस्सी',
'इक्यासी','बयासी','तिरासी','चौरासी','पचासी','छियासी','सत्तासी','अट्ठासी','नवासी','नब्बे',
'इक्यानवे','बानवे','तिरानवे','चौरानवे','पचानवे','छियानवे','सत्तानवे','अट्ठानवे','निन्यानवे','सौ'];

function numberToWordsHI(n){
  if(n===0) return HI_WORDS[0];
  if(n<0) return 'ऋण ' + numberToWordsHI(-n);
  if(n<=100) return HI_WORDS[n];
  const h = Math.floor(n/100), r = n%100;
  return HI_WORDS[h] + ' सौ' + (r ? ' ' + HI_WORDS[r] : '');
}

// Traditional pahada recitation words for 1x-10x (jaise "ekam", "dooni", "tiya"); 11x-12x ke liye
// seedha number + "guna" (times) bola jaata hai kyunki unke koi alag traditional shabd nahi hote.
const HI_PAHADA_WORD = {1:'एकम',2:'दूनी',3:'तिया',4:'चौका',5:'पांच',6:'छक्के',7:'सत्ते',8:'आठे',9:'नवे',10:'दहाई'};

const EN_ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const EN_TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

function numberToWordsEN(n){
  if(n===0) return 'zero';
  if(n<0) return 'minus ' + numberToWordsEN(-n);
  if(n<20) return EN_ONES[n];
  if(n<100) return EN_TENS[Math.floor(n/10)] + (n%10 ? '-' + EN_ONES[n%10] : '');
  if(n<1000){
    const h = Math.floor(n/100), r = n%100;
    return EN_ONES[h] + ' hundred' + (r ? ' ' + numberToWordsEN(r) : '');
  }
  const th = Math.floor(n/1000), r = n%1000;
  return numberToWordsEN(th) + ' thousand' + (r ? ' ' + numberToWordsEN(r) : '');
}

// Classic English times-table recitation style: "Eleven ones are eleven, Eleven twos are twenty-two..."
const EN_MULT_PLURAL = {1:'ones',2:'twos',3:'threes',4:'fours',5:'fives',6:'sixes',7:'sevens',8:'eights',9:'nines',10:'tens',11:'elevens',12:'twelves'};

// One spoken line per multiplier (1x through 12x), in the chosen medium (Hindi pahada-style or English table-style)
function buildTableSpeechLines(tableNum, medium){
  const lines = [];
  for(let m=1; m<=12; m++){
    const product = tableNum * m;
    if(medium === 'en'){
      const label = numberToWordsEN(tableNum);
      const cap = label.charAt(0).toUpperCase() + label.slice(1);
      lines.push(`${cap} ${EN_MULT_PLURAL[m]} are ${numberToWordsEN(product)}.`);
    } else {
      const multWord = m <= 10 ? HI_PAHADA_WORD[m] : (numberToWordsHI(m) + ' गुणा');
      lines.push(`${numberToWordsHI(tableNum)} ${multWord} ${numberToWordsHI(product)}`);
    }
  }
  return lines;
}

function getAvailableVoices(){
  if(!('speechSynthesis' in window)) return [];
  return window.speechSynthesis.getVoices() || [];
}

function pickSpeechVoice(medium){
  const voices = getAvailableVoices();
  if(!voices.length) return null;
  if(state.speakSettings.voiceURI){
    const chosen = voices.find(v => v.voiceURI === state.speakSettings.voiceURI);
    if(chosen) return chosen;
  }
  const langPrefix = medium === 'en' ? 'en' : 'hi';
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix)) || voices[0];
}

// Naye voice model nahi bana sakte — yeh device par pehle se installed voices me se
// sabse behtar Indian male/female voice DHOONDTA hai (jaana-maana naam pattern + hi-IN/en-IN lang se).
const INDIAN_FEMALE_NAMES = ['heera','veena','lekha','kalpana','swara','divya','priya','neerja','ananya','kajal'];
const INDIAN_MALE_NAMES = ['ravi','prabhat','hemant','rishi','madhur','arjun','aditya','rohan'];

function findIndianVoice(gender){
  const voices = getAvailableVoices();
  if(!voices.length) return null;
  const indianVoices = voices.filter(v => v.lang && /^(hi-in|en-in)/i.test(v.lang));
  const nameList = gender === 'female' ? INDIAN_FEMALE_NAMES : INDIAN_MALE_NAMES;
  // pehle: Indian-lang voice jiska naam jaane-maane male/female pattern se milta ho
  let match = indianVoices.find(v => nameList.some(n => v.name.toLowerCase().includes(n)));
  if(match) return match;
  // agar naam se pehchaan na ho, to koi bhi Indian-lang voice de do (behtar se behtar available)
  if(indianVoices.length) return indianVoices[0];
  // Indian-lang voice bilkul na ho to naam pattern kisi bhi voice me dhoondo (kai fonts locale-agnostic hote hain)
  match = voices.find(v => nameList.some(n => v.name.toLowerCase().includes(n)));
  return match || null;
}

function useIndianVoice(gender){
  const found = findIndianVoice(gender);
  if(!found){
    alert('Aapke device par abhi koi Indian voice installed nahi hai.\n\nNeeche wale "📥 Awaaz Install Screen Kholein" button try karein — agar wo na chale to Settings → Text-to-speech output → voice data install karein, aur Hindi (India) ya English (India) voice download karein. Uske baad yeh button dobara use karein.');
    return;
  }
  state.speakSettings.voiceURI = found.voiceURI;
  render();
}

function stopSpeakingTable(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  state.speakingActive = false;
  state.speakingRow = null;
  render();
}

function speakTable(tableNum){
  if(!('speechSynthesis' in window)){
    alert('Is browser/device me Text-to-Speech (bolne ki) suvidha available nahi hai.');
    return;
  }
  window.speechSynthesis.cancel();
  const medium = state.speakSettings.medium;
  const lines = buildTableSpeechLines(tableNum, medium);
  const voice = pickSpeechVoice(medium);
  state.speakingActive = true;
  state.speakingRow = null;
  let i = 0;
  const speakNext = ()=>{
    if(!state.speakingActive || i >= lines.length){
      state.speakingActive = false;
      state.speakingRow = null;
      render();
      return;
    }
    const utt = new SpeechSynthesisUtterance(lines[i]);
    if(voice) utt.voice = voice;
    utt.lang = medium === 'en' ? 'en-US' : 'hi-IN';
    utt.rate = state.speakSettings.rate || 0.9;
    utt.pitch = state.speakSettings.pitch || 1;
    state.speakingRow = i + 1;
    render();
    utt.onend = ()=>{ i++; speakNext(); };
    utt.onerror = ()=>{ i++; speakNext(); };
    window.speechSynthesis.speak(utt);
  };
  speakNext();
}

  if(!('speechSynthesis' in window)){

  utt.pitch = state.speakSettings.pitch || 1;
  window.speechSynthesis.speak(utt);
}

/* ================= LEARN TABLES + CUBE ROOTS + SQUARES ================= */
function buildTableQuestions(tableNum, mode){
  let mults = Array.from({length:12},(_,i)=>i+1); // 1x through 12x — covers 11 & 12 ka table fully
  if(mode==='mix') mults = shuffleArr(mults);
  return mults.map(i => ({ text:`${tableNum} × ${i}`, answer: tableNum*i, tag:null }));
}

function buildCubeQuestions(range, mode){
  let nums = Array.from({length:range||12},(_,i)=>i+1); // 1³ through <range>³ (up to 100³)
  if(mode==='mix') nums = shuffleArr(nums);
  return nums.map(i => ({ text:`∛${i*i*i}`, answer:i, tag:null }));
}

function buildSquareQuestions(range, mode){
  let nums = Array.from({length:range||12},(_,i)=>i+1); // 1² through <range>² (up to 100²)
  if(mode==='mix') nums = shuffleArr(nums);
  return nums.map(i => ({ text:`${i}²`, answer:i*i, tag:null }));
}

// The 3-2-1 countdown is skipped entirely when Blinking Mode is active (flash cards should
// start flashing immediately) or when the person has turned the countdown off in Customize Practice.
function sessionSkipsCountdown(questions){
  if(!state.practiceCustomize.showCountdown) return true;
  if(state.settings.blinkMode && questions.length && questions[0].nums && questions[0].nums.length > 1) return true;
  return false;
}

function startTablesPractice(kind){
  let questions;
  if(kind==='table'){
    const tableNum = state.tablesSettings.tableNum;
    const mode = state.tablesSettings.mode;
    questions = buildTableQuestions(tableNum, mode);
    state.settings = { op:'table', tableNum, mode, qCount: questions.length };
  } else if(kind==='cbrt'){
    const mode = state.tablesSettings.cubeMode;
    const range = state.tablesSettings.cubeRange;
    questions = buildCubeQuestions(range, mode);
    state.settings = { op:'cbrt', mode, range, qCount: questions.length };
  } else {
    const mode = state.tablesSettings.squareMode;
    const range = state.tablesSettings.squareRange;
    questions = buildSquareQuestions(range, mode);
    state.settings = { op:'sqdrill', mode, range, qCount: questions.length };
  }
  state.masterMode = false;
  state.courseLevel = null;
  state.activeLevelRun = null;
  state.session = { questions, index:0, results:[], qStart: performance.now(), firstKeyAt:null, countdown:3, liveCorrect:0, liveWrong:0, typedValue:'' };
  state.tab = 'practice';
  state.navMenuOpen = false;
  if(sessionSkipsCountdown(questions)){
    state.session.countdown = 0;
    beginQuestion(state.session);
  } else {
    render();
  }
}

/* ================= COMBO TRACKING ================= */
const TIER_MULT = { 1:1, 2:1.7, 3:2.4, 4:3.2 }; // bigger numbers naturally take longer

function recordCombo(tag, timeSec){
  const { op, a, b } = tag;
  const tier = tierOf(a,b);
  const bucket = state.combos[op];
  const key = comboKey(a,b);
  if(!bucket[key]) bucket[key] = { a, b, tier, times:[], slow:false, fastStreak:0 };
  const c = bucket[key];
  c.times.push(timeSec);
  if(c.times.length>5) c.times.shift();

  const limit = (THRESH[op]||4) * (TIER_MULT[tier]||1);
  if(timeSec > limit){
    c.slow = true;
    c.fastStreak = 0;
  } else if(c.slow){
    c.fastStreak++;
    if(c.fastStreak >= 3){
      delete bucket[key]; // graduated — hata do
    }
  }

  // Leaderboard subsystem — record every calculation's best time, grouped by digit tier (1/2/3)
  const rbucket = state.records[op];
  if(rbucket){
    const r = rbucket[key];
    if(!r){
      rbucket[key] = { a, b, tier, best: timeSec, attempts: 1, lastTime: timeSec };
    } else {
      r.attempts++;
      r.lastTime = timeSec;
      if(timeSec < r.best) r.best = timeSec;
    }
  }
}

function getWeakList(){
  const list = [];
  ['add','sub','mul','div'].forEach(op=>{
    Object.values(state.combos[op]).forEach(c=>{
      if(c.slow) list.push({op, a:c.a, b:c.b, tier:c.tier, avg: c.times.reduce((x,y)=>x+y,0)/c.times.length});
    });
  });
  return list;
}

/* ================= PRACTICE FLOW ================= */
function startPractice(fromMaster, opFilter){
  state.masterMode = !!fromMaster;
  let questions = [];
  if(fromMaster){
    let weak = getWeakList();
    if(opFilter && opFilter!=='all') weak = weak.filter(w=>w.op===opFilter);
    if(weak.length===0){ render(); return; }
    questions = weak.map(w => ({ ...questionFromCombo(w.op,w.a,w.b) }));
    // shuffle
    for(let i=questions.length-1;i>0;i--){ const j=randInt(0,i); [questions[i],questions[j]]=[questions[j],questions[i]]; }
  } else {
    for(let i=0;i<state.settings.qCount;i++){
      let q, tries = 0;
      do{
        q = generateQuestion();
        tries++;
      } while(
        questions.length>0 &&
        q.answer === questions[questions.length-1].answer &&
        tries < 25
      ); // avoid back-to-back questions with the same answer (e.g. 7+7=14 then 8+6=14)
      questions.push(q);
    }
  }
  state.session = { questions, index:0, results:[], qStart: performance.now(), firstKeyAt: null, countdown:3, liveCorrect:0, liveWrong:0, typedValue:'' };
  state.tab = 'practice';
  state.navMenuOpen = false;
  if(sessionSkipsCountdown(questions)){
    state.session.countdown = 0;
    beginQuestion(state.session);
  } else {
    render();
  }
}

function statsOf(times){
  const n = times.length;
  const sorted = [...times].sort((a,b)=>a-b);
  const mean = times.reduce((s,t)=>s+t,0)/n;
  const median = n%2 ? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2;
  const variance = times.reduce((s,t)=>s+(t-mean)*(t-mean),0)/n;
  const stdDev = Math.sqrt(variance);
  return { min: sorted[0], max: sorted[n-1], median, stdDev, mean };
}

function quitPractice(){
  const sess = state.session;
  if(sess && sess.index > 0){
    const ok = confirm('Kya aap practice beech me chhodna chahte hain? Yeh session record nahi hoga.');
    if(!ok) return;
  }
  if(practiceTickHandle){ clearInterval(practiceTickHandle); practiceTickHandle = null; }
  if(countdownTickHandle){ clearInterval(countdownTickHandle); countdownTickHandle = null; }
  if(blinkTickHandle){ clearTimeout(blinkTickHandle); blinkTickHandle = null; }
  if(practiceKeydownHandler){ document.removeEventListener('keydown', practiceKeydownHandler); practiceKeydownHandler = null; }
  state.session = null;
  state.courseLevel = null;
  state.activeLevelRun = null;
  state.masterMode = false;
  state.tab = 'setup';
  state.navMenuOpen = false;
  render();
}

// Starts a question: either the normal instant-display flow, or — for multi-number
// addition rows with Blinking Mode on — flashes each number for ~1s one at a time
// before the real stopwatch/input appear, so the learner has to hold them in memory.
function beginQuestion(sess){
  const q = sess.questions[sess.index];
  sess.typedValue = '';
  sess.firstKeyAt = null;
  sess.mistakes = 0;
  if(blinkTickHandle){ clearTimeout(blinkTickHandle); blinkTickHandle = null; }
  if(state.settings.blinkMode && q.nums && q.nums.length > 1){
    startBlinkSequence(sess);
  } else {
    sess.blinking = false;
    sess.qStart = performance.now();
    render();
  }
}

function startBlinkSequence(sess){
  sess.blinking = true;
  sess.blinkIndex = -1;
  sess.blinkShow = false;
  advanceBlink(sess);
}

function advanceBlink(sess){
  if(state.session !== sess) return; // session was quit/replaced mid-sequence
  sess.blinkIndex++;
  const q = sess.questions[sess.index];
  if(sess.blinkIndex >= q.nums.length){
    // all numbers shown — hand off to the real timer + input
    sess.blinking = false;
    sess.qStart = performance.now();
    sess.firstKeyAt = null;
    sess.typedValue = '';
    render();
    return;
  }
  sess.blinkShow = true;
  render();
  blinkTickHandle = setTimeout(()=>{
    if(state.session !== sess) return;
    sess.blinkShow = false; // brief blank gap so back-to-back same digits still register as separate flashes
    render();
    blinkTickHandle = setTimeout(()=> advanceBlink(sess), 220);
  }, 780); // ~1s per number including the gap below
}

function submitAnswer(userVal){
  const sess = state.session;
  const q = sess.questions[sess.index];
  const correct = Number(userVal) === q.answer;

  if(!correct){
    sess.mistakes = (sess.mistakes||0) + 1;
    sess.liveWrong = (sess.liveWrong||0) + 1; // accuracy meter dips on a wrong answer
    return false; // caller shows red, question stays, timer keeps running
  }

  const now = performance.now();
  const timeSec = (now - sess.qStart)/1000;
  const reactionSec = sess.firstKeyAt!=null ? (sess.firstKeyAt - sess.qStart)/1000 : timeSec;
  const firstTry = (sess.mistakes||0)===0; // no wrong attempts before landing on the right answer
  sess.results.push({ text:q.text, answer:q.answer, userVal, time:timeSec, reaction:reactionSec, correct:true, firstTry, mistakes: sess.mistakes||0 });
  if(q.tag) recordCombo(q.tag, timeSec);
  sess.liveCorrect = (sess.liveCorrect||0) + 1; // accuracy meter rises on a correct answer
  sess.mistakes = 0;
  sess.firstKeyAt = null;

  const fastLimit = THRESH[state.settings.op] || 5;
  const wasFast = timeSec <= fastLimit && (sess.results[sess.results.length-1].mistakes===0);
  sess.streak = wasFast ? (sess.streak||0)+1 : 0;
  sess.bestStreak = Math.max(sess.bestStreak||0, sess.streak);

  sess.index++;
  if(sess.index >= sess.questions.length){
    state.lastResults = sess.results;
    const total = sess.results.length;
    const correctCt = sess.results.filter(r=>r.firstTry).length; // wrong attempts on a question knock it out of accuracy, even though it was eventually solved
    const totalTime = sess.results.reduce((s,r)=>s+r.time,0);
    const avgTime = totalTime/total;
    const accuracy = (correctCt/total)*100;
    const timeStats = statsOf(sess.results.map(r=>r.time));
    const avgReaction = sess.results.reduce((s,r)=>s+(r.reaction||r.time),0)/total;
    const op = state.settings.op;
    const s = state.settings;
    const digitTier = Math.min(4, Math.max(s.digitA||1, s.digitB||1));
    const rank = computeRank(op, avgTime, accuracy, digitTier);
    const digitInfo = op==='add' && s.rowCount>2
      ? `${s.rowCount} numbers × ${s.digitA}-digit`
      : op==='square' ? `${s.digitA}-digit number`
      : op==='percent' ? `Percent tier ${s.digitA} · base ${s.digitB}-digit`
      : op==='table' ? `${s.tableNum} ka Table · ${s.mode==='mix'?'Mix':'Normal'}`
      : op==='cbrt' ? `Cube Roots (1³–${s.range||12}³) · ${s.mode==='mix'?'Mix':'Normal'}`
      : op==='sqdrill' ? `Squares (1²–${s.range||12}²) · ${s.mode==='mix'?'Mix':'Normal'}`
      : `${s.digitA}-digit ${op==='div'?'(jawaab)':''} & ${s.digitB}-digit ${op==='div'?'(divisor)':''}`;
    state.history.push({
      id: state.history.length+1,
      time: new Date().toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'}),
      op, opLabel: OP_LABEL[op],
      master: state.masterMode,
      total, correctCt, accuracy, avgTime, totalTime,
      rank, digitInfo, bestStreak: sess.bestStreak||0,
      timeStats, avgReaction,
      digitA: s.digitA||null, digitB: s.digitB||null, digitTier,
      rowCount: (op==='add') ? (s.rowCount||2) : null,
      details: sess.results.map(r=>({ text:r.text, time:r.time, reaction:r.reaction, correct:r.correct, firstTry:r.firstTry, mistakes:r.mistakes||0 })),
    });
    if(!state.bestRank[op] || rank.score > state.bestRank[op].score){
      state.bestRank[op] = { tier:rank.tier, emoji:rank.emoji, score:rank.score, sub:rank.sub };
    }
    if(state.courseLevel){
      const lvl = levelById(state.courseLevel);
      const pass = lvl ? (accuracy >= lvl.minAccuracy && avgTime <= lvl.maxAvgTime) : false;
      if(pass){
        state.course.completed[lvl.id] = { avgTime, accuracy };
        if(state.course.unlocked <= lvl.id && lvl.id < COURSE_LEVELS.length){
          state.course.unlocked = lvl.id + 1;
        }
      }
      state.lastCourseResult = { levelId: state.courseLevel, pass, avgTime, accuracy, lvl };
    } else {
      state.lastCourseResult = null;
    }
    if(state.activeLevelRun){
      const { op: lop, id: lid } = state.activeLevelRun;
      const track = LEVEL_TRACKS[lop];
      const lvl = track && track.find(l=>l.id===lid);
      const prog = state.levelProgress[lop];
      const pass = lvl ? (accuracy >= lvl.minAccuracy && avgTime <= lvl.maxAvgTime) : false;
      if(lvl && prog){
        if(pass){
          prog.completed[lid] = { avgTime, accuracy };
          if(prog.unlocked <= lid && lid < track.length){
            prog.unlocked = lid + 1;
          }
        }
        state.lastLevelResult = { op: lop, id: lid, pass, avgTime, accuracy, lvl, track };
      }
      state.activeLevelRun = null;
    } else {
      state.lastLevelResult = null;
    }
    state.session = null;
    state.tab = 'results';
    render();
  } else {
    beginQuestion(sess);
  }
  return true;
}

function startGkQuiz(subject, topicIdx){
  const bank = GK_QUIZ[subject] && GK_QUIZ[subject][topicIdx];
  if(!bank) return;
  const questions = shuffleArr(bank.questions.map(q=>({
    ...q,
    // shuffle the option order per question, tracking the new correct index
    _order: shuffleArr(q.options.map((_,i)=>i)),
  })));
  state.gkQuiz = { subject, topicIdx, topic:bank.topic, questions, index:0, correctCt:0, wrongCt:0, answered:null };
  render();
}
function answerGkQuiz(selectedOrigIdx){
  const quiz = state.gkQuiz;
  if(!quiz || quiz.answered!=null) return;
  const q = quiz.questions[quiz.index];
  const correct = selectedOrigIdx === q.answer;
  quiz.answered = selectedOrigIdx;
  if(correct) quiz.correctCt++; else quiz.wrongCt++; // accuracy meter: up on sahi, down on galat
  render();
}
function nextGkQuizQuestion(){
  const quiz = state.gkQuiz;
  if(!quiz) return;
  quiz.index++;
  quiz.answered = null;
  render();
}
function quitGkQuiz(){
  state.gkQuiz = null;
  render();
}

function viewGkQuizSession(){
  const quiz = state.gkQuiz;
  const total = quiz.questions.length;
  if(quiz.index >= total){
    const acc = total>0 ? Math.round((quiz.correctCt/total)*100) : 0;
    const msg = acc>=90 ? 'Zabardast! 🏆' : acc>=70 ? 'Badhiya kaam! 👍' : 'Aur practice karo — ho jayega! 💪';
    return `
    <div class="card practice-box">
      <h2>Quiz Poora — ${quiz.subject ? GK_DATA[quiz.subject].label : ''} · ${quiz.topic}</h2>
      <div class="stats-grid">
        <div class="stat"><div class="stat-num">${quiz.correctCt}/${total}</div><div class="stat-label">Sahi</div></div>
        <div class="stat"><div class="stat-num">${acc}%</div><div class="stat-label">Accuracy</div></div>
      </div>
      <p class="hint">${msg}</p>
      <button class="btn teal" id="retryGkQuizBtn">🔁 Yeh Quiz Phir Se Karein</button>
      <button class="btn secondary" id="quitGkQuizBtn">📚 Topics Par Wapas Jayein</button>
    </div>`;
  }
  const q = quiz.questions[quiz.index];
  const liveTotal = quiz.correctCt + quiz.wrongCt;
  const liveAcc = liveTotal>0 ? Math.round((quiz.correctCt/liveTotal)*100) : 100;
  const liveAccColor = liveAcc>=90 ? 'var(--green)' : liveAcc>=70 ? 'var(--amber)' : 'var(--red)';
  const liveAccHtml = liveTotal>0 ? `<div class="timer" style="color:${liveAccColor};">🎯 Live Accuracy: ${liveAcc}% (${quiz.correctCt} sahi / ${quiz.wrongCt} galat)</div>` : '';
  const optsHtml = q._order.map(origIdx=>{
    let cls = 'quiz-opt';
    if(quiz.answered!=null){
      if(origIdx===q.answer) cls += ' correct';
      else if(origIdx===quiz.answered) cls += ' wrong';
    }
    return `<button class="${cls}" data-gkopt="${origIdx}" ${quiz.answered!=null?'disabled':''}>${q.options[origIdx]}</button>`;
  }).join('');
  return `
  <div class="card practice-box">
    <div class="progress">Sawaal ${quiz.index+1} / ${total} · ${quiz.topic}</div>
    <div class="qtext" style="font-size:1.1rem;">${q.q}</div>
    <div class="quiz-opts">${optsHtml}</div>
    ${liveAccHtml}
    ${quiz.answered!=null ? `<button class="btn teal" id="nextGkQuizBtn">${quiz.index+1>=total ? 'Result Dekhein →' : 'Agla Sawaal →'}</button>` : ''}
    <button class="btn secondary" id="quitGkQuizBtn">✋ Quiz Band Karein</button>
  </div>`;
}

      ${lr.pass && nextLvl ? `<button class="btn teal" id="nextLevelTrackBtn" data-op="${lr.op}" data-level="${nextLvl.id}">Agla Stage: ${STAGE_EMOJI[nextLvl.stage]} ${nextLvl.title} →</button>` : ''}
      ${lr.pass && !nextLvl ? `<p class="hint">${OP_LABEL[lr.op]} ka poora track complete — Advanced tak pahunch gaye! 🏆</p>` : ''}
      ${!lr.pass ? `<button class="btn teal" id="retryLevelTrackBtn" data-op="${lr.op}" data-level="${lr.id}">Yeh Stage Phir Se Karein</button>` : ''}
      <button class="btn secondary" id="backLevelsBtn">Beginner→Advanced Par Wapas Jayein</button>
    </div>`;
  }

  const lastStreak = state.history.length ? state.history[state.history.length-1].bestStreak : 0;
  const consistencyLabel = ts.stdDev<0.5 ? 'Bahut Stable 🎯' : ts.stdDev<1.2 ? 'Stable' : 'Utaar-Chadhaav';

  return `
  ${courseBlock}
  ${levelBlock}
  <div class="card">
    <h2>Result — Sabse dheema upar, sabse tez neeche</h2>
    <div class="stats-grid">
      <div class="stat"><div class="stat-num">${correctCount}/${res.length}</div><div class="stat-label">Sahi</div></div>
      <div class="stat"><div class="stat-num">${avgTime.toFixed(3)}s</div><div class="stat-label">Average time</div></div>
      <div class="stat"><div class="stat-num">${totalTime.toFixed(3)}s</div><div class="stat-label">Total time</div></div>
      ${rank ? `<div class="stat"><div class="stat-num">${rank.emoji} ${rank.tier} ${rank.sub}</div><div class="stat-label">Rank · Score ${rank.score}/100</div></div>` : ''}
      ${lastStreak>=2 ? `<div class="stat"><div class="stat-num">🔥 ${lastStreak}</div><div class="stat-label">Best Speed Streak</div></div>` : ''}
    </div>
    <p class="hint">🎯 Accuracy sirf pehle try me sahi jawaab ka % hai — ek baar bhi red (galat) hua to woh sawaal "sahi" nahi ginta, chahe baad me sahi jawaab de diya ho.</p>
    ${rows}
    <button class="btn secondary" id="homeBtn">🏠 Home — Naya Setup Karein</button>
  </div>
  <div class="card">
    <h2>⏱️ Timing Analytics</h2>
    <div class="stats-grid">
      <div class="stat"><div class="stat-num">${ts.min.toFixed(3)}s</div><div class="stat-label">Fastest</div></div>
      <div class="stat"><div class="stat-num">${ts.max.toFixed(3)}s</div><div class="stat-label">Slowest</div></div>
      <div class="stat"><div class="stat-num">${ts.median.toFixed(3)}s</div><div class="stat-label">Median</div></div>
      <div class="stat"><div class="stat-num">${avgReaction.toFixed(3)}s</div><div class="stat-label">Avg Reaction Time</div></div>
    </div>
    <p class="hint">Consistency (std. dev): <b class="num">±${ts.stdDev.toFixed(3)}s</b> — ${consistencyLabel}</p>
    <p class="hint">Reaction Time = pehli key press tak ka waqt · Solve Time = jawaab jama karne tak ka poora waqt. Reaction time kam karo to overall speed apne aap badhegi.</p>
  </div>`;
}

function viewHistory(){
  if(state.history.length===0){
    return `<div class="card"><p class="empty-msg">Abhi tak koi practice history nahi hai.</p></div>`;
  }
  const rows = [...state.history].reverse().map(h=>{
    const expanded = state.expandedHistory === h.id;
    let detailHtml = '';
    if(expanded && h.details && h.details.length){
      const sortedD = [...h.details].sort((a,b)=>b.time-a.time);
      const maxT = Math.max(...h.details.map(d=>d.time));
      const totalMistakes = h.details.reduce((s,d)=>s+(d.mistakes||0),0);
      const rowsD = sortedD.map(d=>{
        const pct = Math.max(8,(d.time/maxT)*100);
        const color = d.time===maxT ? 'var(--red)' : 'var(--amber)';
        return `
        <div class="ladder-row">
          <div class="ladder-q num">${d.text} ${d.mistakes ? `❌ (${d.mistakes} galat try)` : '✅'}</div>
          <div class="ladder-bar-wrap"><div class="ladder-bar" style="width:${pct}%; background:${color};"></div></div>
          <div class="ladder-time num">${d.time.toFixed(3)}s</div>
        </div>`;
      }).join('');
      const tsLine = h.timeStats
        ? `<p class="hint">Fastest ${h.timeStats.min.toFixed(3)}s · Slowest ${h.timeStats.max.toFixed(3)}s · Median ${h.timeStats.median.toFixed(3)}s · Consistency ±${h.timeStats.stdDev.toFixed(3)}s ${h.avgReaction!=null?`· Avg reaction ${h.avgReaction.toFixed(3)}s`:''}</p>`
        : '';
      detailHtml = `
        <div class="hist-detail">
          <p class="hint">Kul galat try: ${totalMistakes} · Digit setup: ${h.digitInfo||'—'}</p>
          ${tsLine}
          ${rowsD}
        </div>`;
    }
    return `
    <div class="hist-row">
      <div class="hist-main">
        <span class="hist-op">${h.opLabel}${h.master?' · Master':''}</span>
        <span class="hist-time-tag">${h.time}</span>
      </div>
      <div class="hist-stats">
        <span>${h.correctCt}/${h.total} sahi (${h.accuracy.toFixed(0)}%)</span>
        <span>avg ${h.avgTime.toFixed(3)}s</span>
        <span>total ${h.totalTime.toFixed(3)}s</span>
        <span>${h.rank.emoji} ${h.rank.tier} ${h.rank.sub}</span>
      </div>
      <button class="btn secondary hist-toggle" data-id="${h.id}">${expanded ? 'Detail Chhupayein' : 'Detail Dekhein'}</button>
      ${detailHtml}
    </div>
  `;
  }).join('');
  return `
  <div class="card">
    <h2>Practice History</h2>
    ${rows}
    <button class="btn secondary" id="homeBtn2">🏠 Home — Naya Setup Karein</button>
  </div>`;
}

function viewRank(){
  if(state.history.length===0){
    return `<div class="card"><p class="empty-msg">Rank dekhne ke liye pehle ek practice session poora karein.</p></div>`;
  }
  const ops = ['add','sub','mul','div','mix','lcm','square','percent'].filter(op => state.history.some(h=>h.op===op));
  const scores = state.history.map(h=>h.rank.score);
  const avgScore = Math.round(scores.reduce((s,x)=>s+x,0)/scores.length);
  const overall = tierFromScore(avgScore);
  const overallProgress = overall.next ? Math.round(((avgScore-overall.min)/(overall.max-overall.min))*100) : 100;
  const scoreStd = Math.sqrt(scores.reduce((s,x)=>s+(x-avgScore)*(x-avgScore),0)/scores.length);
  const recentScores = scores.slice(-5);
  const recentAvg = recentScores.reduce((s,x)=>s+x,0)/recentScores.length;
  const overallTrend = scores.length>=2
    ? (recentAvg > avgScore+1 ? '📈 Recent sessions overall se behtar' : recentAvg < avgScore-1 ? '📉 Recent sessions overall se kamzor' : '➡️ Stable performance')
    : '';

  const perOp = ops.map(op=>{
    const entries = state.history.filter(h=>h.op===op);
    const latest = entries[entries.length-1];
    const prev = entries.length>1 ? entries[entries.length-2] : null;
    const best = state.bestRank[op];
    const nextText = latest.rank.next ? `agla: ${latest.rank.next.emoji} ${latest.rank.next.tier}` : 'top rank!';
    const trendArrow = prev
      ? (latest.rank.score > prev.rank.score ? '↑' : latest.rank.score < prev.rank.score ? '↓' : '→')
      : '';
    const trendColor = trendArrow==='↑' ? 'var(--green)' : trendArrow==='↓' ? 'var(--red)' : 'rgba(241,236,221,0.6)';
    return `
    <div class="rank-op-card">
      <div class="rank-op-head">
        <span class="rank-op-name">${OP_LABEL[op]}</span>
        <span>${latest.rank.emoji} ${latest.rank.tier} ${latest.rank.sub} ${trendArrow?`<span style="color:${trendColor}">${trendArrow}</span>`:''}</span>
      </div>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${latest.rank.progressPct}%"></div></div>
      <div class="hist-stats">
        <span>Score ${latest.rank.score}/100</span>
        <span>${nextText}</span>
        ${best ? `<span>Best: ${best.emoji} ${best.tier} ${best.sub||''}</span>` : ''}
        <span>Sessions: ${entries.length}</span>
      </div>
    </div>`;
  }).join('');

  // Milestone badges
  const badges = [];
  if(scoreStd < 8 && scores.length>=3) badges.push({emoji:'🎯', label:'Consistent Performer', note:`Score variation sirf ±${scoreStd.toFixed(0)}`});
  const bestStreakEver = state.history.reduce((m,h)=>Math.max(m,h.bestStreak||0),0);
  if(bestStreakEver>=5) badges.push({emoji:'🔥', label:'Speed Streaker', note:`${bestStreakEver} sawaal lagatar tez solve kiye`});
  ops.forEach(op=>{
    if(state.bestRank[op] && state.bestRank[op].score>=93) badges.push({emoji:'👑', label:`${OP_LABEL[op]} Grandmaster`, note:`Best score ${state.bestRank[op].score}/100`});
  });
  const totalQ = state.history.reduce((s,h)=>s+h.total,0);
  if(totalQ>=100) badges.push({emoji:'💯', label:'Century Club', note:`${totalQ} sawaal ab tak solve kiye`});
  const badgesHtml = badges.length
    ? `<div class="chip-row">${badges.map(b=>`<span class="combo-chip" style="background:var(--teal);" title="${b.note}">${b.emoji} ${b.label}</span>`).join('')}</div>`
    : `<p class="hint">Aur practice karo — badges yahan unlock honge.</p>`;

  return `
  <div class="card">
    <h2>Overall Rank</h2>
    <div class="stats-grid">
      <div class="stat"><div class="stat-num" style="font-size:2rem;">${overall.emoji}</div><div class="stat-label">${overall.tier} ${overall.sub} · Score ${avgScore}/100</div></div>
      <div class="stat"><div class="stat-num">±${scoreStd.toFixed(0)}</div><div class="stat-label">Consistency</div></div>
    </div>
    <div class="rank-bar-wrap"><div class="rank-bar" style="width:${overallProgress}%"></div></div>
    <p class="hint">${overall.next ? `Agli rank ${overall.next.emoji} ${overall.next.tier} tak ${overall.max - avgScore} score aur chahiye.` : 'Aap sabse top rank par ho!'}</p>
    ${overallTrend ? `<p class="hint">${overallTrend}</p>` : ''}
  </div>
  <div class="card">
    <h2>Badges</h2>
    ${badgesHtml}
  </div>
  <div class="card">
    <h2>Operation-wise Rank</h2>
    ${perOp}
    <p class="hint">Score speed (limit time ke muqable average time) aur accuracy dono se banta hai — 50% weight har ek ko. Har tier ke andar 1→2→3→4 sub-levels hote hain, jitna high number utna agli tier ke paas (jaise Silver 4 ke baad Gold 1 aata hai).</p>
  </div>`;
}

function viewAnalysis(){
  if(state.history.length===0){
    return `<div class="card"><p class="empty-msg">Analysis dekhne ke liye pehle kuch practice sessions poore karein.</p></div>`;
  }
  const PILLAR_OPS = ['add','sub','mul','div','mix'].filter(op => state.history.some(h=>h.op===op));

  // Per-operation summary: average score/accuracy/time across all sessions of that op.
  const opStats = PILLAR_OPS.map(op=>{
    const entries = state.history.filter(h=>h.op===op);
    const avgScore = entries.reduce((s,e)=>s+e.rank.score,0)/entries.length;
    const avgAcc = entries.reduce((s,e)=>s+e.accuracy,0)/entries.length;
    const avgTime = entries.reduce((s,e)=>s+e.avgTime,0)/entries.length;
    return { op, sessions: entries.length, avgScore, avgAcc, avgTime };
  }).sort((a,b)=> b.avgScore - a.avgScore);

  const strengths = opStats.slice(0,2);
  const weaknesses = [...opStats].reverse().slice(0,2);

  const strengthChips = strengths.map(o=>
    `<span class="combo-chip" style="background:var(--green);">${OP_LABEL[o.op]} · avg score ${o.avgScore.toFixed(0)}/100</span>`
  ).join('');
  const weaknessChips = weaknesses.map(o=>
    `<span class="combo-chip" style="background:var(--red);">${OP_LABEL[o.op]} · avg score ${o.avgScore.toFixed(0)}/100</span>`
  ).join('');

  // Consistency — how much scores swing session to session.
  const scores = state.history.map(h=>h.rank.score);
  const meanScore = scores.reduce((s,x)=>s+x,0)/scores.length;
  const scoreStd = Math.sqrt(scores.reduce((s,x)=>s+(x-meanScore)*(x-meanScore),0)/scores.length);
  const consistencyLabel = scoreStd<6 ? 'Bahut Consistent 🎯' : scoreStd<14 ? 'Thodi Ups-Downs' : 'Inconsistent — practice ka pattern set karo';

  // Digit-tier weak spots across the four pillars, using each history entry's digitTier.
  const tierCounts = {1:0,2:0,3:0};
  state.history.filter(h=>['add','sub','mul','div','mix'].includes(h.op)).forEach(h=>{
    if(h.digitTier) tierCounts[h.digitTier] = (tierCounts[h.digitTier]||0) + 1;
  });
  const leastPracticedTier = Object.entries(tierCounts).sort((a,b)=>a[1]-b[1])[0];

  const weakList = getWeakList();
  const weakByTier = {1:0,2:0,3:0};
  weakList.forEach(w=>{ weakByTier[w.tier] = (weakByTier[w.tier]||0)+1; });

  // Recommendations — plain-language next steps built from the numbers above.
  const recs = [];
  if(weaknesses[0]) recs.push(`${OP_LABEL[weaknesses[0].op]} me sabse kam score aa raha hai (${weaknesses[0].avgScore.toFixed(0)}/100) — isi par Master Practice ya Levels track try karein.`);
  if(weakList.length>0) recs.push(`Abhi ${weakList.length} kamzor combinations record me hain — sabse zyada ${TIER_LABEL[Object.entries(weakByTier).sort((a,b)=>b[1]-a[1])[0][0]]} me hain.`);
  if(leastPracticedTier && Number(leastPracticedTier[1])===0) recs.push(`${TIER_LABEL[leastPracticedTier[0]]} numbers ki practice abhi tak nahi hui — Setup se ek round try karein.`);
  if(scoreStd>=14) recs.push('Score session-to-session bahut upar-neeche ho raha hai — roz thoda thoda practice karo, ek hi din bahut zyada mat karo.');
  if(recs.length===0) recs.push('Sab operations me balanced progress hai — is tarah practice jaari rakho!');

  const opRows = opStats.map(o=>`
    <div class="hist-row">
      <div class="hist-main">
        <span class="hist-op">${OP_LABEL[o.op]}</span>
        <span class="num">${o.avgScore.toFixed(0)}/100</span>
      </div>
      <div class="hist-stats">
        <span>Sessions: ${o.sessions}</span>
        <span>Avg accuracy: ${o.avgAcc.toFixed(0)}%</span>
        <span>Avg time: ${o.avgTime.toFixed(2)}s</span>
      </div>
    </div>`).join('');

  return `
  <div class="card">
    <h2>🔎 Strengths & Weaknesses</h2>
    <p class="hint">Best</p>
    <div class="chip-row">${strengthChips || '<span class="empty-msg">Data kam hai</span>'}</div>
    <p class="hint" style="margin-top:10px;">Needs Work</p>
    <div class="chip-row">${weaknessChips || '<span class="empty-msg">Data kam hai</span>'}</div>
  </div>
  <div class="card">
    <h2>Operation-wise Summary</h2>
    ${opRows}
  </div>
  <div class="card">
    <h2>Consistency</h2>
    <div class="stats-grid">
      <div class="stat"><div class="stat-num">±${scoreStd.toFixed(0)}</div><div class="stat-label">Score Variation</div></div>
      <div class="stat"><div class="stat-num" style="font-size:1.1rem;">${consistencyLabel}</div><div class="stat-label">Overall Pattern</div></div>
    </div>
  </div>
  <div class="card">
    <h2>💡 Recommendations</h2>
    <ul class="tip-list">${recs.map(r=>`<li>${r}</li>`).join('')}</ul>
  </div>`;
}

function viewProgress(){
  if(state.history.length===0){
    return `<div class="card"><p class="empty-msg">Progress dekhne ke liye pehle practice karein.</p></div>`;
  }
  const totalSessions = state.history.length;
  const totalQuestions = state.history.reduce((s,h)=>s+h.total,0);
  const totalCorrect = state.history.reduce((s,h)=>s+h.correctCt,0);
  const totalTimeSpent = state.history.reduce((s,h)=>s+h.totalTime,0);
  const overallAccuracy = (totalCorrect/totalQuestions)*100;
  const bestStreakEver = state.history.reduce((m,h)=>Math.max(m,h.bestStreak||0),0);
  const totalMins = totalTimeSpent/60;

  const overviewCard = `
  <div class="card">
    <h2>Overview</h2>
    <div class="stats-grid">
      <div class="stat"><div class="stat-num">${totalSessions}</div><div class="stat-label">Sessions</div></div>
      <div class="stat"><div class="stat-num">${totalQuestions}</div><div class="stat-label">Sawaal Solve Kiye</div></div>
      <div class="stat"><div class="stat-num">${overallAccuracy.toFixed(0)}%</div><div class="stat-label">Overall Accuracy</div></div>
      <div class="stat"><div class="stat-num">${totalMins.toFixed(1)}m</div><div class="stat-label">Total Practice Time</div></div>
      ${bestStreakEver>=2 ? `<div class="stat"><div class="stat-num">🔥 ${bestStreakEver}</div><div class="stat-label">Best Streak Ever</div></div>` : ''}
    </div>
    <p class="hint">🎯 Accuracy = pehle-try-me-sahi jawaab ÷ total sawaal. Speed kabhi precision ki keemat par nahi ginta — red hote hi woh sawaal accuracy me "galat" ban jaata hai.</p>
  </div>`;

  const ops = ['add','sub','mul','div','mix','lcm','square','percent','table','sqdrill','cbrt'].filter(op => state.history.some(h=>h.op===op));
  const FOUR_PILLARS = ['add','sub','mul','div'];
  const digitFilter = state.progressDigitFilter || 'all';
  const filterChips = `
  <div class="card">
    <h2>📊 Progress Check — Apne Hisab Se</h2>
    <p class="hint">Digit ya Row chuno, sirf wahi subsection dikhega.</p>
    <div class="chip-row">
      <button data-progfilter="all" class="chip-btn ${digitFilter==='all'?'active':''}">Sabhi</button>
      <button data-progfilter="1" class="chip-btn ${digitFilter==='1'?'active':''}">1-Digit</button>
      <button data-progfilter="2" class="chip-btn ${digitFilter==='2'?'active':''}">2-Digit</button>
      <button data-progfilter="3" class="chip-btn ${digitFilter==='3'?'active':''}">3-Digit</button>
      <button data-progfilter="4" class="chip-btn ${digitFilter==='4'?'active':''}">4-Digit</button>
      <button data-progfilter="row" class="chip-btn ${digitFilter==='row'?'active':''}">Row</button>
    </div>
  </div>`;
  const blocks = ops.map(op=>{
    const entries = state.history.filter(h=>h.op===op);
    const maxTime = Math.max(...entries.map(e=>e.avgTime));
    const bars = entries.map(e=>{
      const pct = Math.max(6,(e.avgTime/maxTime)*100);
      return `<div class="prog-bar-wrap" title="${e.avgTime.toFixed(2)}s · ${e.accuracy.toFixed(0)}% accuracy"><div class="prog-bar" style="height:${pct}%"></div></div>`;
    }).join('');
    const accBars = entries.map(e=>{
      const pct = Math.max(6, e.accuracy);
      const color = e.accuracy>=90 ? 'var(--green)' : e.accuracy>=70 ? 'var(--amber)' : 'var(--red)';
      return `<div class="prog-bar-wrap" title="${e.accuracy.toFixed(0)}% accuracy"><div class="prog-bar" style="height:${pct}%; background:${color};"></div></div>`;
    }).join('');
    const first = entries[0].avgTime, last = entries[entries.length-1].avgTime;
    const diffPct = ((first-last)/first*100).toFixed(0);
    const trendMsg = entries.length>1
      ? (last<first ? `${diffPct}% tez ho gaye ho pehle session se 🎉` : `Abhi pehle session se ${Math.abs(diffPct)}% dheema ho — practice jaari rakho`)
      : `Sirf ek session hua hai, aur practice karo trend dekhne ke liye`;
    const bestTime = Math.min(...entries.map(e=>e.avgTime));
    const bestAcc = Math.max(...entries.map(e=>e.accuracy));
    const opQuestions = entries.reduce((s,e)=>s+e.total,0);
    const opAccuracy = (entries.reduce((s,e)=>s+e.correctCt,0)/opQuestions)*100;

    // Progress Check — subsection under subsection: 1-digit / 2-digit / 3-digit / 4-digit, with the exact
    // digit-combos practiced inside each tier (e.g. "1×2 digit"), only for the four pillars.
    // Filterable via state.progressDigitFilter so the user can look at just the tier/row they want.
    let tierCheckHtml = '';
    if(FOUR_PILLARS.includes(op)){
      const tierNums = digitFilter==='all' ? [1,2,3,4] : (digitFilter==='row' ? [] : [Number(digitFilter)]);
      const tierBlocks = tierNums.map(tier=>{
        const tEntries = entries.filter(e=>e.digitTier===tier);
        if(tEntries.length===0) return '';
        const combos = {};
        tEntries.forEach(e=>{
          const k = `${e.digitA||'?'} × ${e.digitB||'?'} digit`;
          combos[k] = (combos[k]||0) + 1;
        });
        const comboChips = Object.entries(combos)
          .map(([k,c])=>`<span class="combo-chip">${k} · ${c} session${c>1?'s':''} practiced</span>`)
          .join('');
        const tQ = tEntries.reduce((s,e)=>s+e.total,0);
        const tAcc = (tEntries.reduce((s,e)=>s+e.correctCt,0)/tQ)*100;
        const tAvg = tEntries.reduce((s,e)=>s+e.avgTime,0)/tEntries.length;
        return `
        <div class="tier-sub">
          <h4>${TIER_LABEL[tier]}</h4>
          <p class="hint">${tEntries.length} session${tEntries.length>1?'s':''} · ${tQ} sawaal · avg <b class="num">${tAvg.toFixed(2)}s</b> · <b class="num">${tAcc.toFixed(0)}%</b> accuracy</p>
          <div>${comboChips}</div>
        </div>`;
      }).join('');
      const tierEmpty = tierNums.length>0 && tierBlocks.trim()==='' ? `<p class="empty-msg">Is digit-tier ki abhi tak koi practice nahi hai.</p>` : '';

      let rowCheckHtml = '';
      if(op==='add' && (digitFilter==='all' || digitFilter==='row')){
        const rowGroups = {};
        entries.forEach(e=>{
          const rc = e.rowCount || 2;
          if(!rowGroups[rc]) rowGroups[rc] = [];
          rowGroups[rc].push(e);
        });
        const rowKeys = Object.keys(rowGroups).map(Number).sort((a,b)=>a-b);
        if(rowKeys.length>1 || rowKeys[0]>2 || digitFilter==='row'){
          const rowChips = rowKeys.map(rc=>{
            const g = rowGroups[rc];
            return `<span class="combo-chip">${rc} numbers/row · ${g.length} session${g.length>1?'s':''}</span>`;
          }).join('');

      tierCheckHtml = `

        <p class="hint">Kaunse digit-tier aur combination practice ki hai — subsection wise.</p>
        ${tierBlocks}${tierEmpty}
        ${rowCheckHtml}
      </div>`;
    }

    return `
    <div class="tip-group">
      <h3>${OP_LABEL[op]} <span class="hint">(${entries.length} session${entries.length>1?'s':''} · ${opQuestions} sawaal)</span></h3>

  return `${overviewCard}${filterChips}<div class="card"><h2>Progress — Per Operation Detail</h2>${blocks}</div>`;
}
